<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map Editor Prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0&icon_names=add_circle,arrow_selector_tool,delete,image,label,new_label,route">
  <style>
    /* Without this, any display rule on an element overrides its hidden attribute. */
    [hidden] {
      display: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
    }
    .material-symbols-rounded {
      font-variation-settings: 'wght' 300;
    }
    #canvas-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #label-input {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: sans-serif;
      text-align: center;
    }
    #crossing-dialog {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      font: 13px sans-serif;
      white-space: nowrap;
    }
    #mode-menu {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #mode-menu button {
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    #mode-menu button[aria-pressed="true"] {
      background: #ddd;
    }
    #mode-menu hr {
      margin: 2px 4px;
      border: none;
      border-top: 1px solid #ddd;
    }
    #panel {
      flex: none;
      width: 300px;
      padding: 8px;
      box-sizing: border-box;
    }
    #image-preview {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #image-preview img {
      min-width: 0;
      max-width: 100%;
    }
    #image-delete {
      flex: none;
      display: flex;
      padding: 0;
    }
    .field {
      display: block;
    }
    * + .field {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
    <input id="label-input" type="text" hidden>
    <div id="crossing-dialog" hidden>
      Add intersections?
      <button id="crossing-yes" type="button">Yes</button>
      <button id="crossing-no" type="button">No</button>
    </div>
    <div id="mode-menu">
      <button type="button" data-mode="labels" aria-label="Labels mode" aria-pressed="false">
        <span class="material-symbols-rounded">label</span>
      </button>
      <button type="button" data-mode="path" aria-label="Path editing mode" aria-pressed="true">
        <span class="material-symbols-rounded">route</span>
      </button>
      <button type="button" data-mode="background" aria-label="Background mode" aria-pressed="false">
        <span class="material-symbols-rounded">image</span>
      </button>
      <div id="label-tools" hidden>
        <hr>
        <button type="button" data-label-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-label-tool="add" aria-label="New label" aria-pressed="false">
          <span class="material-symbols-rounded">new_label</span>
        </button>
      </div>
      <div id="path-tools">
        <hr>
        <button type="button" data-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-tool="add" aria-label="Add path" aria-pressed="false">
          <span class="material-symbols-rounded">add_circle</span>
        </button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="labels-panel" hidden>
      <div id="label-properties" hidden>
        <label class="field">
          Text
          <input id="label-text" type="text">
        </label>
        <label class="field">
          X
          <input id="label-x" type="number" min="0" max="1500" step="1">
        </label>
        <label class="field">
          Y
          <input id="label-y" type="number" min="0" max="1500" step="1">
        </label>
        <label class="field">
          Style
          <select id="label-style"></select>
        </label>
      </div>
      <div id="label-styles">
        <div id="label-style-list"></div>
        <button id="new-label-style" class="field" type="button">New label style</button>
        <form id="label-style-form" hidden>
          <label class="field">
            Name
            <input id="style-name" type="text" required>
          </label>
          <label class="field">
            Font
            <input id="style-font" type="text" list="google-fonts-list" required>
          </label>
          <label class="field">
            Font size
            <input id="style-size" type="number" min="4" max="200" step="1" required>
          </label>
          <label class="field">
            Color
            <input id="style-color" type="color">
          </label>
          <label class="field">
            <input id="style-outline-on" type="checkbox">
            Outline color
            <input id="style-outline" type="color">
          </label>
          <label class="field">
            <input id="style-shadow-on" type="checkbox">
            Shadow color
            <input id="style-shadow" type="color">
          </label>
          <label class="field">
            Padding
            <input id="style-padding" type="number" min="0" max="200" step="1">
          </label>
          <label class="field">
            <input id="style-background-on" type="checkbox">
            Background color
            <input id="style-background" type="color">
          </label>
          <label class="field">
            Border radius
            <input id="style-radius" type="number" min="0" max="200" step="1">
          </label>
          <div class="field">
            <button type="submit">Save</button>
            <button id="style-cancel" type="button">Cancel</button>
          </div>
        </form>
      </div>
      <datalist id="google-fonts-list"></datalist>
    </div>
    <div id="path-panel">
      <label class="field">
        Snap distance
        <input id="snap-distance" type="range" min="0" max="50" value="15">
        <output for="snap-distance"></output>
      </label>
      <label class="field">
        Segment hover distance
        <input id="segment-distance" type="range" min="1" max="50" value="10">
        <output for="segment-distance"></output>
      </label>
      <label class="field">
        Bend focus
        <input id="bend-focus" type="range" min="0" max="100" value="0">
        <output for="bend-focus"></output>
      </label>
      <label class="field">
        Nudge amount
        <input id="nudge-amount" type="range" min="1" max="20" value="1">
        <output for="nudge-amount"></output>
      </label>
      <label class="field">
        Path color
        <input id="path-color" type="color" value="#ffbf17">
      </label>
      <label id="intersection-field" class="field" hidden>
        <input id="intersection" type="checkbox">
        Intersection
      </label>
      <button id="create-path" class="field" type="button" hidden>Create path</button>
      <label id="path-visible-field" class="field" hidden>
        <input id="path-visible" type="checkbox">
        Visible
      </label>
      <div id="path-width-fields" hidden>
        <label class="field">
          Width
          <input id="path-width" type="range" min="1" max="100">
          <output for="path-width"></output>
        </label>
        <label class="field">
          Width color
          <input id="path-width-color" type="color">
        </label>
      </div>
      <button id="destroy-path" class="field" type="button" hidden>Destroy path</button>
      <button id="delete-bend" class="field" type="button" hidden>Delete bend</button>
      <label id="fill-area-field" class="field" hidden>
        <input id="fill-area" type="checkbox">
        Fill area
      </label>
      <label id="fill-visible-field" class="field" hidden>
        <input id="fill-visible" type="checkbox">
        Visible
      </label>
      <label id="fill-color-field" class="field" hidden>
        Fill color
        <input id="fill-color" type="color">
      </label>
    </div>
    <div id="background-panel" hidden>
      <input id="image-upload" type="file" accept="image/*">
      <div id="image-preview" hidden>
        <img alt="Background image">
        <button id="image-delete" type="button" aria-label="Delete image">
          <span class="material-symbols-rounded">delete</span>
        </button>
      </div>
      <label class="field">
        Background color
        <input id="canvas-color" type="color" value="#7b8365">
      </label>
    </div>
  </div>
  <script src="google-fonts.js"></script>
  <script>
    const modeButtons = document.querySelectorAll('#mode-menu [data-mode]');
    const labelTools = document.getElementById('label-tools');
    const labelToolButtons = document.querySelectorAll('[data-label-tool]');
    let labelTool = 'select';
    let selectedLabel = null;

    function setLabelTool(name) {
      labelTool = name;
      for (const button of labelToolButtons) {
        button.setAttribute('aria-pressed', button.dataset.labelTool === name);
      }
      updateCursor();
    }
    for (const button of labelToolButtons) {
      button.addEventListener('click', () => setLabelTool(button.dataset.labelTool));
    }
    const modePanels = {
      path: document.getElementById('path-panel'),
      background: document.getElementById('background-panel'),
      labels: document.getElementById('labels-panel'),
    };
    const pathTools = document.getElementById('path-tools');
    const toolButtons = document.querySelectorAll('#path-tools [data-tool]');
    let tool = 'select';

    function setTool(name) {
      tool = name;
      for (const button of toolButtons) {
        button.setAttribute('aria-pressed', button.dataset.tool === name);
      }
      updateCursor();
      draw();
    }

    function setMode(mode) {
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', button.dataset.mode === mode);
      }
      for (const [name, panel] of Object.entries(modePanels)) {
        panel.hidden = name !== mode;
      }
      pathTools.hidden = mode !== 'path';
      labelTools.hidden = mode !== 'labels';
      if (mode !== 'labels') {
        setLabelTool('select');
        finishLabel(false);
        selectedLabel = null;
      }
      if (mode !== 'path') selected = null;
      closeCrossingDialog();
      setTool('select');
    }

    for (const button of modeButtons) {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    }
    for (const button of toolButtons) {
      button.addEventListener('click', () => setTool(button.dataset.tool));
    }

    // A path is a set of points joined by segments. A segment is [a, b] or
    // [a, b, c1, c2]: its ends are the point objects themselves, so moving a
    // point moves its segments, and two control points bend it into a curve.
    const paths = [];
    // { path, point }, { path, segment }, { path, area: Set of its points }, or
    // { items: [...] } for two or more dots and segments.
    let selected = null;

    const selectionItems = () => selected?.items ?? (selected?.point || selected?.segment ? [selected] : []);

    // A user-made path: segments grouped so that they select and move as one.
    // Internally "path" already names a connected set of dots, so these are
    // groups in the code. { segments: Set, visible, width, widthColor }, with
    // width in background pixels so it scales with the map.
    const groups = [];
    const groupOf = (segment) => groups.find((group) => group.segments.has(segment));
    const pathOf = (segment) => paths.find((path) => path.segments.includes(segment));
    const groupItems = (group) => [...group.segments].map((segment) => ({ path: pathOf(segment), segment }));

    // Drops segments that no longer exist from groups, and groups left empty.
    function pruneGroups() {
      for (const group of groups) {
        for (const segment of group.segments) {
          if (!pathOf(segment)) group.segments.delete(segment);
        }
      }
      groups.splice(0, groups.length, ...groups.filter((group) => group.segments.size));
    }

    // Any grouped segment brings its whole group along. A selection that is
    // exactly one group is tagged with it.
    function setSelectionItems(items) {
      const expanded = [...items];
      for (const item of items) {
        const group = item.segment && groupOf(item.segment);
        if (!group) continue;
        for (const member of groupItems(group)) {
          if (!expanded.some((other) => sameItem(other, member))) expanded.push(member);
        }
      }
      const first = expanded[0]?.segment && groupOf(expanded[0].segment);
      const whole = first && expanded.length === first.segments.size && expanded.every((item) => first.segments.has(item.segment));
      if (whole) selected = { items: expanded, group: first };
      else selected = expanded.length === 0 ? null : expanded.length === 1 ? expanded[0] : { items: expanded };
    }

    // Every point a move of the selection carries: selected dots and the ends
    // of selected segments.
    const movingPoints = () =>
      new Set(selectionItems().flatMap((item) => (item.point ? [item.point] : item.segment.slice(0, 2))));

    const sameItem = (a, b) => (a.point ? a.point === b.point : a.segment === b.segment);

    function toggleInSelection(item) {
      const group = item.segment && groupOf(item.segment);
      const members = group ? groupItems(group) : [item];
      const items = selectionItems();
      const kept = items.filter((other) => !members.some((member) => sameItem(other, member)));
      setSelectionItems(kept.length === items.length ? [...items, ...members] : kept);
    }
    const DOT_RADIUS = 5;
    const SELECTED_DOT_RADIUS = 7;
    // Bending right at an end would swing the control points wildly, so a
    // bend is placed at least this far (as a fraction of the segment) from
    // either end.
    const BEND_END_MARGIN = 0.1;

    function labelledSlider(id, unit = 'px') {
      const input = document.getElementById(id);
      const output = document.querySelector(`output[for="${id}"]`);
      const show = () => { output.value = `${input.value}${unit}`; };
      show();
      input.addEventListener('input', show);
      return input;
    }
    const snapInput = labelledSlider('snap-distance');
    const segmentDistanceInput = labelledSlider('segment-distance');
    const nudgeInput = labelledSlider('nudge-amount');
    const bendFocusInput = labelledSlider('bend-focus', '%');
    const SHIFT_NUDGE_FACTOR = 10;
    const NUDGE_DIRECTIONS = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
    };
    const pathColor = document.getElementById('path-color');
    pathColor.addEventListener('input', () => draw());

    // Distances are in screen pixels so they feel the same at any zoom.
    function nearestPoint(sx, sy, maxDistance, exclude) {
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const point of path.points) {
          if (point === exclude) continue;
          const d = Math.hypot(point.x * view.scale + view.x - sx, point.y * view.scale + view.y - sy);
          if (d <= bestDistance) {
            best = { path, point };
            bestDistance = d;
          }
        }
      }
      return best;
    }

    function pointAt(sx, sy) {
      return nearestPoint(sx, sy, SELECTED_DOT_RADIUS);
    }

    const lerp = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });

    function segmentPoint([a, b, c1, c2], t) {
      if (!c1) return lerp(a, b, t);
      const p12 = lerp(c1, c2, t);
      return lerp(lerp(lerp(a, c1, t), p12, t), lerp(p12, lerp(c2, b, t), t), t);
    }

    // The closest spot on a segment to p, all in background coordinates.
    // Curves are approximated by short straight pieces.
    function closestOnSegment(segment, p) {
      const steps = segment[2] ? 32 : 1;
      let best = null;
      for (let i = 0; i < steps; i++) {
        const a = segmentPoint(segment, i / steps);
        const b = segmentPoint(segment, (i + 1) / steps);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSq = dx * dx + dy * dy;
        const u = lengthSq === 0 ? 0 : Math.min(1, Math.max(0, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSq));
        const q = lerp(a, b, u);
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (!best || d < best.distance) best = { point: q, t: (i + u) / steps, distance: d };
      }
      return best;
    }

    // The segment nearest screen point s within the hover distance, and t,
    // where along it the nearest spot is.
    function segmentHit(sx, sy, maxDistance = Number(segmentDistanceInput.value), skip = () => false) {
      const p = toBackground(sx, sy);
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const segment of path.segments) {
          if (skip(segment)) continue;
          const { t, distance } = closestOnSegment(segment, p);
          if (distance * view.scale <= bestDistance) {
            best = { path, segment, t };
            bestDistance = distance * view.scale;
          }
        }
      }
      return best;
    }

    function segmentAt(sx, sy) {
      const hit = segmentHit(sx, sy);
      return hit && { path: hit.path, segment: hit.segment };
    }

    const bendT = (t) => Math.min(1 - BEND_END_MARGIN, Math.max(BEND_END_MARGIN, t));

    // Replaces any bend with one that passes through m at t. It starts from
    // the straight segment (control points at its thirds) and pushes the two
    // control points by k1 and k2 times the offset of m from that line.
    // Equal weights give a symmetric bulge peaking mid-segment. Focused
    // weights put the peak at t, or a third of the way from an end when t is
    // nearer than that, since a single bulge can't peak closer. The bend focus
    // slider blends between the two; both keep the weights non-negative, so
    // the curve never doubles back into an S.
    function bendSegment(segment, t, m) {
      const [a, b] = segment;
      const u = 1 - t;
      const base = lerp(a, b, t);
      const dx = m.x - base.x;
      const dy = m.y - base.y;
      // The curve's offset at t is 3tu(u·k1 + t·k2), which must equal 1 there.
      // For the focused weights its slope must also be 0 at t.
      const reach = 1 / (3 * t * u);
      const spread = -((1 - 2 * t) * reach) / (t * u);
      let f1 = reach - t * spread;
      let f2 = f1 + spread;
      if (f2 < 0) [f1, f2] = [reach / u, 0];
      if (f1 < 0) [f1, f2] = [0, reach / t];
      const focus = Number(bendFocusInput.value) / 100;
      const k1 = reach + (f1 - reach) * focus;
      const k2 = reach + (f2 - reach) * focus;
      const third = lerp(a, b, 1 / 3);
      const twoThirds = lerp(a, b, 2 / 3);
      segment[2] = { x: third.x + dx * k1, y: third.y + dy * k1 };
      segment[3] = { x: twoThirds.x + dx * k2, y: twoThirds.y + dy * k2 };
    }

    // Splits a segment at t, keeping any bend's shape. The split point is new
    // unless one already in the path is given.
    function splitSegment(path, segment, t, point = segmentPoint(segment, t)) {
      const [a, b, c1, c2] = segment;
      if (!path.points.includes(point)) path.points.push(point);
      let halves = [[a, point], [point, b]];
      if (c1) {
        const p01 = lerp(a, c1, t);
        const p12 = lerp(c1, c2, t);
        const p23 = lerp(c2, b, t);
        halves = [[a, point, p01, lerp(p01, p12, t)], [point, b, lerp(p12, p23, t), p23]];
      }
      path.segments.splice(path.segments.indexOf(segment), 1, ...halves);
      const group = groupOf(segment);
      if (group) {
        group.segments.delete(segment);
        for (const half of halves) group.segments.add(half);
      }
      for (const fill of fills) {
        if (fill.has(a) && fill.has(b)) fill.add(point);
      }
      return point;
    }

    function insertOnSegment({ t }) {
      const { path, segment } = selected;
      selected = { path, point: splitSegment(path, segment, t) };
    }

    // An area is a bounded face of a path: the smallest loop of segments
    // around a spot. Fills are remembered by the set of points on the loop,
    // so they survive moving and bending.
    const fills = [];

    // Points along a segment walked from one end, without the far end.
    function sampleEdge({ from, segment }) {
      const steps = segment[2] ? 16 : 1;
      const forward = segment[0] === from;
      const points = [];
      for (let i = 0; i < steps; i++) points.push(segmentPoint(segment, forward ? i / steps : 1 - i / steps));
      return points;
    }

    function computeAreas() {
      const areas = [];
      for (const path of paths) {
        const out = new Map();
        const addEdge = (from, to, segment, toward) => {
          if (!out.has(from)) out.set(from, []);
          out.get(from).push({ from, to, segment, angle: Math.atan2(toward.y - from.y, toward.x - from.x) });
        };
        for (const segment of path.segments) {
          const [a, b, c1, c2] = segment;
          addEdge(a, b, segment, c1 ?? b);
          addEdge(b, a, segment, c2 ?? a);
        }
        for (const edges of out.values()) edges.sort((p, q) => p.angle - q.angle);

        // Walk each face by always taking the next edge clockwise at every
        // point. Bounded faces come out with positive area, the outer one negative.
        const seen = new Set();
        for (const edges of out.values()) {
          for (const start of edges) {
            if (seen.has(start)) continue;
            const loop = [];
            let edge = start;
            do {
              seen.add(edge);
              loop.push(edge);
              const next = out.get(edge.to);
              const back = next.findIndex((e) => e.segment === edge.segment && e.to === edge.from);
              edge = next[(back - 1 + next.length) % next.length];
            } while (edge !== start);
            const polygon = loop.flatMap(sampleEdge);
            let area = 0;
            for (let i = 0; i < polygon.length; i++) {
              const p = polygon[i];
              const q = polygon[(i + 1) % polygon.length];
              area += p.x * q.y - q.x * p.y;
            }
            if (area > 1e-6) {
              areas.push({ path, loop, polygon, area: area / 2, points: new Set(loop.map((e) => e.from)) });
            }
          }
        }
      }
      return areas;
    }

    const samePoints = (s, t) => s.size === t.size && [...s].every((p) => t.has(p));
    // Each fill is a Set of its area's points, carrying `visible` and `color`
    // like a path: a visible fill shows in its own color in both modes.
    const fillOf = (points) => fills.find((fill) => samePoints(fill, points));
    const isFilled = (area) => !!fillOf(area.points);

    function insidePolygon(polygon, p) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if ((a.y > p.y) !== (b.y > p.y) && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) {
          inside = !inside;
        }
      }
      return inside;
    }

    function areaAt(areas, sx, sy) {
      const p = toBackground(sx, sy);
      let best = null;
      for (const area of areas) {
        if (insidePolygon(area.polygon, p) && (!best || area.area < best.area)) best = area;
      }
      return best;
    }

    // Returns the segment drawn to the new point, if any.
    function addPoint(point) {
      if (selected?.point) {
        const segment = [selected.point, point];
        selected.path.points.push(point);
        selected.path.segments.push(segment);
        selected = { path: selected.path, point };
        return segment;
      }
      const path = { points: [point], segments: [] };
      paths.push(path);
      selected = { path, point };
      return null;
    }

    // Folds point `from` into `onto`, keeping every connection either had.
    // Segments between the two vanish, and duplicates collapse to one.
    function mergePoints(path, from, onto) {
      const into = onto.path;
      mergePaths(into, path);
      for (const segment of into.segments) {
        if (segment[0] === from) segment[0] = onto.point;
        if (segment[1] === from) segment[1] = onto.point;
      }
      into.points.splice(into.points.indexOf(from), 1);
      const seen = new Set();
      into.segments = into.segments.filter(([a, b]) => {
        const key = [into.points.indexOf(a), into.points.indexOf(b)].sort().join();
        if (a === b || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      for (const fill of fills) {
        if (fill.delete(from)) fill.add(onto.point);
      }
      onto.point.intersection ||= from.intersection;
      pruneGroups();
      selected = { path: into, point: onto.point };
    }

    function mergePaths(into, from) {
      if (into === from) return;
      into.points.push(...from.points);
      into.segments.push(...from.segments);
      paths.splice(paths.indexOf(from), 1);
    }

    // Returns the segment it creates, or null if the two were already joined.
    function connectTo(target) {
      const path = selected.path;
      const from = selected.point;
      const to = target.point;
      mergePaths(path, target.path);
      selected = { path, point: to };
      if (path.segments.some(([a, b]) => (a === from && b === to) || (a === to && b === from))) return null;
      const segment = [from, to];
      path.segments.push(segment);
      return segment;
    }

    // Where a segment crosses others away from either one's ends, as
    // { path, segment, t (along that segment), s (along this one), point }.
    // Curves are approximated by short straight pieces.
    function findCrossings(piece) {
      const pieces = (segment) => {
        const steps = segment[2] ? 32 : 1;
        return Array.from({ length: steps }, (_, i) => [segmentPoint(segment, i / steps), segmentPoint(segment, (i + 1) / steps), i, steps]);
      };
      const mine = pieces(piece);
      const crossings = [];
      const nearEnd = (t) => t < 1e-4 || t > 1 - 1e-4;
      for (const path of paths) {
        for (const segment of path.segments) {
          if (segment === piece) continue;
          for (const [m0, m1, i, mSteps] of mine) {
            for (const [o0, o1, j, oSteps] of pieces(segment)) {
              const rx = m1.x - m0.x, ry = m1.y - m0.y, sx = o1.x - o0.x, sy = o1.y - o0.y;
              const denom = rx * sy - ry * sx;
              if (Math.abs(denom) < 1e-9) continue;
              const u = ((o0.x - m0.x) * sy - (o0.y - m0.y) * sx) / denom;
              const v = ((o0.x - m0.x) * ry - (o0.y - m0.y) * rx) / denom;
              if (u < 0 || u > 1 || v < 0 || v > 1) continue;
              const t = (j + v) / oSteps;
              const s = (i + u) / mSteps;
              if (nearEnd(t) || nearEnd(s)) continue;
              crossings.push({ path, segment, t, s, point: lerp(m0, m1, u) });
            }
          }
        }
      }
      return crossings;
    }

    // Adds a shared intersection node wherever the segment crosses another,
    // splitting both.
    function addCrossingNodes(start) {
      const work = [start];
      for (let guard = 0; work.length && guard < 200; guard++) {
        const piece = work.pop();
        const path = pathOf(piece);
        const hit = path && findCrossings(piece)[0];
        if (!hit) continue;
        mergePaths(path, hit.path);
        const point = splitSegment(path, hit.segment, hit.t);
        point.intersection = true;
        const at = path.segments.indexOf(piece);
        splitSegment(path, piece, hit.s, point);
        work.push(path.segments[at], path.segments[at + 1]);
      }
      if (selected?.point) selected = { path: paths.find((path) => path.points.includes(selected.point)), point: selected.point };
    }

    // An item may already be gone when an earlier deletion in the same
    // selection took it along, as an orphaned end or a dot's segment.
    function deleteItem({ path, point, segment }) {
      if (!paths.includes(path)) return;
      if (segment) {
        if (!path.segments.includes(segment)) return;
        path.segments.splice(path.segments.indexOf(segment), 1);
        for (const end of segment.slice(0, 2)) {
          if (!path.segments.some(([a, b]) => a === end || b === end)) {
            path.points.splice(path.points.indexOf(end), 1);
          }
        }
      } else {
        if (!path.points.includes(point)) return;
        path.points.splice(path.points.indexOf(point), 1);
        path.segments = path.segments.filter(([a, b]) => a !== point && b !== point);
      }
      if (path.points.length === 0) paths.splice(paths.indexOf(path), 1);
    }

    function deleteSelected() {
      for (const item of selectionItems()) deleteItem(item);
      pruneGroups();
      selected = null;
    }

    // One step of undo: a copy of the paths, fills and selection taken just
    // before the last edit. Copies of points replace the originals everywhere
    // so segments, fills and the selection still share them.
    let undoState = null;

    function snapshot() {
      const copies = new Map();
      const segmentCopies = new Map();
      const copy = (p) => {
        if (!copies.has(p)) copies.set(p, { ...p });
        return copies.get(p);
      };
      const copiedPaths = paths.map((path) => ({
        points: path.points.map(copy),
        segments: path.segments.map((segment) => {
          const [a, b, ...controls] = segment;
          const copied = [copy(a), copy(b), ...controls.map((c) => ({ ...c }))];
          segmentCopies.set(segment, copied);
          return copied;
        }),
      }));
      const copyItem = ({ path, point, segment }) => ({
        pathIndex: paths.indexOf(path),
        point: point && copy(point),
        segmentIndex: segment && path.segments.indexOf(segment),
      });
      let copiedSelection = { items: selectionItems().map(copyItem) };
      if (selected?.area) copiedSelection = { pathIndex: paths.indexOf(selected.path), area: new Set([...selected.area].map(copy)) };
      return {
        paths: copiedPaths,
        fills: fills.map((fill) => Object.assign(new Set([...fill].filter((p) => copies.has(p)).map(copy)), { visible: fill.visible, color: fill.color })),
        groups: groups.map((group) => ({ ...group, segments: new Set([...group.segments].map((segment) => segmentCopies.get(segment))) })),
        labels: labels.map((label) => ({ ...label })),
        labelStyles: labelStyles.map((style) => ({ ...style })),
        selection: copiedSelection,
      };
    }

    function recordUndo(state = snapshot()) {
      undoState = state;
    }

    function undo() {
      if (!undoState) return;
      const { paths: restoredPaths, fills: restoredFills, groups: restoredGroups, labels: restoredLabels, labelStyles: restoredStyles, selection } = undoState;

      paths.splice(0, paths.length, ...restoredPaths);
      groups.splice(0, groups.length, ...restoredGroups);
      labels.splice(0, labels.length, ...restoredLabels);
      labelStyles.splice(0, labelStyles.length, ...restoredStyles);

      closeStyleForm();
      selectedLabel = null;
      fills.splice(0, fills.length, ...restoredFills);
      if (selection.area) {

          const path = restoredPaths[pathIndex];
          return point ? { path, point } : { path, segment: path.segments[segmentIndex] };
        }));
      }
      drag = null;
      draw();
      updateCursor();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input[type="text"], textarea')) return;

        e.preventDefault();
        undo();

    document.addEventListener('keydown', (e) => {
      if (pathTools.hidden || e.target.closest('input')) return;

      if (plain && e.key === '1') setTool('select');
      if (plain && e.key === '2') setTool('add');
      const nudge = NUDGE_DIRECTIONS[e.key];
      if (nudge && selectionItems().length) {
        e.preventDefault();

        const step = Number(nudgeInput.value) * (e.shiftKey ? SHIFT_NUDGE_FACTOR : 1);

        // of this frame, and then the next Esc never arrives here.
        e.preventDefault();

        if (!selected) setTool('select');
        selected = null;
        draw();
        updateCursor();
      } else if (e.key === 'Enter') {
        // Stops a focused toolbar button from being pressed.
        e.preventDefault();
        selected = null;
        draw();
        updateCursor();
      }

    const BACKGROUND = 1500;
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 20;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const canvasColor = document.getElementById('canvas-color');
    canvasColor.addEventListener('input', () => draw());

    const view = { scale: 1, x: 0, y: 0 };
    let size = null;

    function centerBackground(w, h) {
      view.scale = Math.min(w, h) / BACKGROUND * 0.9;
      view.x = (w - BACKGROUND * view.scale) / 2;
      view.y = (h - BACKGROUND * view.scale) / 2;
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      // centre on the first real size and keep the view centred through resizes.
      if (size === null) {

      } else {
        view.x += (w - size.w) / 2;
        view.y += (h - size.h) / 2;
      }
      size = { w, h };
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      draw();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = canvasColor.value;
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);
      if (backgroundImage) {
        // Cover the background, centred, and draw the overflow too.
        const s = Math.max(BACKGROUND / backgroundImage.naturalWidth, BACKGROUND / backgroundImage.naturalHeight);
        const w = backgroundImage.naturalWidth * s;
        const h = backgroundImage.naturalHeight * s;
        ctx.drawImage(backgroundImage, (BACKGROUND - w) / 2, (BACKGROUND - h) / 2, w, h);
      }
      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 1 / view.scale;
      ctx.strokeRect(0, 0, BACKGROUND, BACKGROUND);
      if (pathTools.hidden) {
        for (const area of computeAreas()) {
          const fill = fillOf(area.points);
          if (!fill?.visible) continue;
          ctx.fillStyle = fill.color;
          traceArea(area);
          ctx.fill();
        }
        for (const group of groups) {
          if (group.visible && group.width > 0) strokeGroupWidth(group);
        }
        drawLabels();
        updatePanel();
        return;
      }

      // Lines and dots keep the same on-screen size at any zoom.
      const px = 1 / view.scale;
      const items = selectionItems();
      const selectedPoints = new Set(items.map((item) => item.point).filter(Boolean));
      const selectedSegments = new Set(items.map((item) => item.segment).filter(Boolean));
      const color = pathColor.value;
      const shadow = () => {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4 * dpr;
        ctx.shadowOffsetY = 1 * dpr;
      };

      const areas = computeAreas();
      if (selected?.area && !areas.some((area) => samePoints(area.points, selected.area))) selected = null;
      const fillArea = (area) => {
        traceArea(area);
        ctx.fill();
      };
      for (const area of areas) {
        const fill = fillOf(area.points);
        if (!fill) continue;
        ctx.save();
        if (fill.visible) {
          ctx.fillStyle = fill.color;
        } else {
          ctx.fillStyle = color;
          ctx.globalAlpha = 0.8;
        }
        fillArea(area);
        ctx.restore();
      }
      ctx.fillStyle = color;
      // A hovered area shows a ghost fill, and a selected one keeps it.
      const selectedArea = selected?.area && areas.find((area) => samePoints(area.points, selected.area));
      const ghostAreas = new Set([hoveredAreaIn(areas), selectedArea].filter((area) => area && !isFilled(area)));
      ctx.save();
      ctx.globalAlpha = 0.3;
      ghostAreas.forEach(fillArea);
      ctx.restore();

      // The selected area gets a white border just inside its edges: a wide
      // stroke clipped to the area, whose inner rim the edge lines then cover.
      if (selectedArea) {
        ctx.save();
        ctx.beginPath();
        traceArea(selectedArea);
        ctx.clip();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 6 * px;
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }

      for (const group of groups) {
        if (group.visible && group.width > 0) strokeGroupWidth(group);
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * px;
      ctx.beginPath();
      for (const path of paths) {
        for (const segment of path.segments) {
          if (!selectedSegments.has(segment)) traceSegment(segment);
        }
      }
      ctx.stroke();

      if (selectedSegments.size) {
        ctx.save();
        ctx.lineCap = 'round';
        shadow();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 7 * px;
        ctx.beginPath();
        for (const segment of selectedSegments) traceSegment(segment);
        ctx.stroke();
        ctx.restore();
        ctx.lineWidth = 3 * px;
        ctx.stroke();
      }

      const target = addTarget();
      const lineEnd = target?.connect?.point ?? target?.split?.point ?? target?.add;
      if (selected?.point && lineEnd) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2 * px;
        ctx.setLineDash([6 * px, 4 * px]);
        ctx.beginPath();
        ctx.moveTo(selected.point.x, selected.point.y);
        ctx.lineTo(lineEnd.x, lineEnd.y);
        ctx.stroke();
        ctx.restore();
      }

      const guides = drag?.guides ?? target?.guides;
      if (guides?.length) {
        const length = 4 * BACKGROUND;
        ctx.save();
        ctx.strokeStyle = 'red';
        ctx.lineWidth = px;
        ctx.beginPath();
        for (const { origin, dx, dy } of guides) {
          ctx.moveTo(origin.x - dx * length, origin.y - dy * length);
          ctx.lineTo(origin.x + dx * length, origin.y + dy * length);
        }
        ctx.stroke();
        ctx.restore();
      }

      const hovered = drag?.snapTo?.point ?? hoveredPoint(target);
      ctx.fillStyle = color;
      for (const path of paths) {
        for (const point of path.points) {
          if (selectedPoints.has(point) || point === hovered) continue;
          ctx.beginPath();
          ctx.arc(point.x, point.y, DOT_RADIUS * px, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const emphasise = (point, outlineAlpha) => {
        ctx.save();
        shadow();
        ctx.beginPath();
        ctx.arc(point.x, point.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = `rgba(255, 255, 255, ${outlineAlpha})`;
        ctx.lineWidth = 2 * px;
        ctx.stroke();
      };
      if (hovered) emphasise(hovered, 0.7);
      for (const point of selectedPoints) emphasise(point, 1);

      const ghost = target?.insert?.point ?? target?.split?.point ?? bendGhost();
      if (ghost) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawLabels();

      if (drag?.marquee && drag.active) {
        const box = marqueeBox();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(box.x, box.y, box.w, box.h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w, box.h);
      }
      updatePanel();
    }

    const createPathButton = document.getElementById('create-path');
    createPathButton.addEventListener('click', () => {
      recordUndo();
      const segments = selectionItems().filter((item) => item.segment);
      for (const { segment } of segments) groupOf(segment)?.segments.delete(segment);
      pruneGroups();
      groups.push({ segments: new Set(segments.map((item) => item.segment)), visible: false, width: 20, widthColor: '#000000' });
      setSelectionItems(segments);
      draw();
    });

    const destroyPathButton = document.getElementById('destroy-path');
    destroyPathButton.addEventListener('click', () => {
      recordUndo();
      groups.splice(groups.indexOf(selected.group), 1);
      setSelectionItems(selectionItems());
      draw();
    });

    // A field that sets a property of the selected path (or another target)
    // as it changes, and becomes one undo step when the edit is committed.
    function liveField(id, key, read, target = () => selected?.group) {
      const input = document.getElementById(id);
      let before = null;
      input.addEventListener('input', () => {
        const object = target();
        if (!object) return;
        before ??= snapshot();
        object[key] = read(input);
        draw();
      });
      input.addEventListener('change', () => {
        if (before) recordUndo(before);
        before = null;
        // Hand focus back so keyboard shortcuts keep working.
        input.blur();
      });
      return input;
    }
    const pathWidthFields = document.getElementById('path-width-fields');
    labelledSlider('path-width');
    const pathWidthInput = liveField('path-width', 'width', (input) => Number(input.value));
    const pathWidthOutput = document.querySelector('output[for="path-width"]');
    const pathWidthColor = liveField('path-width-color', 'widthColor', (input) => input.value);
    const selectedFill = () => selected?.area && fillOf(selected.area);
    const fillColorInput = liveField('fill-color', 'color', (input) => input.value, selectedFill);
    const labelProperties = document.getElementById('label-properties');
    const labelStylesSection = document.getElementById('label-styles');
    const labelStyleList = document.getElementById('label-style-list');
    const labelStyleSelect = document.getElementById('label-style');
    const styleForm = document.getElementById('label-style-form');
    const styleInputs = Object.fromEntries(
      ['name', 'font', 'size', 'color', 'outline-on', 'outline', 'shadow-on', 'shadow', 'padding', 'background-on', 'background', 'radius'].map((key) => [key, document.getElementById(`style-${key}`)]),
    );
    // Edits to an existing style show on the map as they're made. Save keeps
    // them as one undo step; Cancel puts back the values from when editing began.
    let editingStyle = null; // the style being edited, or null for a new one
    let styleBefore = null; // { values, snapshot } from when editing began
    const googleFonts = new Set(GOOGLE_FONTS);

    document.getElementById('google-fonts-list').append(
      ...GOOGLE_FONTS.map((font) => Object.assign(document.createElement('option'), { value: font })),
    );

    // Rebuilds the style list and the label style picker from labelStyles.
    function renderLabelStyles() {
      labelStyleList.replaceChildren(...labelStyles.map((style, i) => {
        const row = document.createElement('div');
        row.className = 'field';
        const edit = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Edit' });
        edit.addEventListener('click', () => openStyleForm(style));
        row.append(`${style.name} `, edit);
        if (i > 0) {
          const remove = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Delete' });
          remove.addEventListener('click', () => {
            recordUndo();
            labelStyles.splice(labelStyles.indexOf(style), 1);
            renderLabelStyles();
            draw();
          });
          row.append(' ', remove);
        }
        return row;
      }));
      labelStyleSelect.replaceChildren(...labelStyles.map((style) =>
        Object.assign(document.createElement('option'), { value: style.id, textContent: style.name })));
    }

    function readStyleForm() {
      return {
        name: styleInputs.name.value.trim(),
        font: styleInputs.font.value.trim(),
        size: Math.max(4, Number(styleInputs.size.value) || 24),
        color: styleInputs.color.value,
        outline: styleInputs['outline-on'].checked ? styleInputs.outline.value : null,
        shadow: styleInputs['shadow-on'].checked ? styleInputs.shadow.value : null,
        padding: Math.max(0, Number(styleInputs.padding.value) || 0),
        background: styleInputs['background-on'].checked ? styleInputs.background.value : null,
        radius: Math.max(0, Number(styleInputs.radius.value) || 0),
      };
    }

    function openStyleForm(style) {
      cancelStyleForm();
      editingStyle = style;
      styleBefore = style && { values: { ...style }, snapshot: snapshot() };
      const values = style ?? { ...NEW_STYLE, name: '' };
      styleInputs.name.value = values.name;
      styleInputs.font.value = values.font;
      styleInputs.size.value = values.size;
      styleInputs.color.value = values.color;
      styleInputs['outline-on'].checked = !!values.outline;
      styleInputs.outline.value = values.outline ?? '#ffffff';
      styleInputs['shadow-on'].checked = !!values.shadow;
      styleInputs.shadow.value = values.shadow ?? '#000000';
      styleInputs.padding.value = values.padding;
      styleInputs['background-on'].checked = !!values.background;
      styleInputs.background.value = values.background ?? '#ffffff';
      styleInputs.radius.value = values.radius;
      styleForm.hidden = false;
      styleInputs.name.focus();
    }

    function closeStyleForm() {
      editingStyle = null;
      styleBefore = null;
      styleForm.hidden = true;
    }

    function cancelStyleForm() {
      if (styleForm.hidden) return;
      if (editingStyle) Object.assign(editingStyle, styleBefore.values);
      closeStyleForm();
      draw();
    }

    function previewStyleForm() {
      if (!editingStyle) return;

      // Half-typed font names aren't fonts; keep showing the last real one.
      if (!googleFonts.has(values.font)) delete values.font;
      Object.assign(editingStyle, values);
      draw();
    }

    document.getElementById('new-label-style').addEventListener('click', () => openStyleForm(null));
    document.getElementById('style-cancel').addEventListener('click', cancelStyleForm);
    styleForm.addEventListener('input', previewStyleForm);
    styleForm.addEventListener('change', previewStyleForm);
    styleForm.addEventListener('submit', (e) => {

      draw();

      recordUndo();
      selectedLabel.styleId = Number(labelStyleSelect.value);

    const labelTextInput = liveField('label-text', 'text', (input) => input.value, () => selectedLabel);
    const labelXInput = liveField('label-x', 'x', (input) => clampToBackground(Number(input.value) || 0), () => selectedLabel);
    const labelYInput = liveField('label-y', 'y', (input) => clampToBackground(Number(input.value) || 0), () => selectedLabel);
    const fillVisibleField = document.getElementById('fill-visible-field');
    const fillColorField = document.getElementById('fill-color-field');

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map Editor Prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0&icon_names=add_circle,add_location,arrow_back,arrow_selector_tool,block,delete,east,edit,image,label,new_label,north,north_east,north_west,route,south,south_east,south_west,west">
  <style>
    /* Without this, any display rule on an element overrides its hidden attribute. */
    [hidden] {
      display: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
    }
    .material-symbols-rounded {
      font-variation-settings: 'wght' 300;
    }
    #canvas-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #label-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .font-picker {
      position: relative;
      display: inline-block;
    }
    #font-options {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #ccc;
    }
    #font-options div {
      padding: 2px 6px;
      cursor: pointer;
    }
    #font-options div[aria-selected="true"] {
      background: #ddd;
    }
    #crossing-dialog {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      font: 13px sans-serif;
      white-space: nowrap;
    }
    #mode-menu {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #mode-menu button {
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    #mode-menu button[aria-pressed="true"] {
      background: #ddd;
    }
    #mode-menu hr {
      margin: 2px 4px;
      border: none;
      border-top: 1px solid #ddd;
    }
    #panel {
      flex: none;
      width: 300px;
      padding: 4px 8px;
      box-sizing: border-box;
      background: #f2f2f2;
      font: 13px system-ui, sans-serif;
    }
    .group {
      padding: 6px 0;
    }
    .group:not(:first-child) {
      border-top: 1px solid #ddd;
    }
    .group:not(:has(> :not([hidden]))) {
      display: none;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
    }
    .row > span:first-child {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .row.stacked {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 4px 0;
    }
    .row input[type="checkbox"],
    .row input[type="radio"] {
      margin: 0;
    }
    #panel input[type="text"],
    #panel input[type="number"],
    #panel select,
    #panel textarea {
      box-sizing: border-box;
      padding: 3px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font: inherit;
    }
    #panel textarea {
      resize: vertical;
    }
    .row input[type="text"],
    .row select {
      width: 140px;
    }
    .row input[type="number"]:not(.opacity) {
      width: 64px;
    }
    #panel .opacity {
      width: 52px;
      margin-left: 2px;
      padding: 3px 4px;
    }
    .slider {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .slider input {
      width: 110px;
      margin: 0;
    }
    .slider output {
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .color-field {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .color-field input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: none;
    }
    #panel button {
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    #panel button:hover {
      background: #f8f8f8;
    }
    .group > button {
      display: block;
      margin: 4px 0;
    }
    #panel #style-back,
    #panel #image-delete,
    #label-style-picker label button {
      flex: none;
      display: flex;
      padding: 2px;
      border: none;
      background: none;
    }
    #panel #style-back:hover,
    #panel #image-delete:hover,
    #label-style-picker label button:hover {
      background: #e4e4e4;
    }
    #label-pointer {
      display: grid;
      grid-template-columns: repeat(3, max-content);
      gap: 2px;
    }
    #label-pointer button {
      display: flex;
      padding: 2px;
    }
    #panel #add-pin {
      display: flex;
      padding: 2px;
    }
    #label-pointer button[aria-pressed="true"],
    #panel #add-pin[aria-pressed="true"] {
      background: #ddd;
    }
    #image-upload {
      max-width: 100%;
      font: inherit;
    }
    #image-preview {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 8px;
    }
    #image-preview img {
      min-width: 0;
      max-width: 100%;
    }
    #label-style-list .row {
      justify-content: flex-start;
    }
    #label-style-list .row > span {
      flex: 1;
    }
    #label-style-picker label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
    <textarea id="label-input" rows="1" hidden></textarea>
    <div id="crossing-dialog" hidden>
      Add intersections?
      <button id="crossing-yes" type="button">Yes</button>
      <button id="crossing-no" type="button">No</button>
    </div>
    <div id="mode-menu">
      <button type="button" data-mode="labels" aria-label="Labels mode" aria-pressed="false">
        <span class="material-symbols-rounded">label</span>
      </button>
      <button type="button" data-mode="path" aria-label="Path editing mode" aria-pressed="true">
        <span class="material-symbols-rounded">route</span>
      </button>
      <button type="button" data-mode="background" aria-label="Background mode" aria-pressed="false">
        <span class="material-symbols-rounded">image</span>
      </button>
      <div id="label-tools" hidden>
        <hr>
        <button type="button" data-label-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-label-tool="add" aria-label="New label" aria-pressed="false">
          <span class="material-symbols-rounded">new_label</span>
        </button>
      </div>
      <div id="path-tools">
        <hr>
        <button type="button" data-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-tool="add" aria-label="Add path" aria-pressed="false">
          <span class="material-symbols-rounded">add_circle</span>
        </button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="labels-panel" hidden>
      <div id="label-properties" hidden>
        <div id="label-single-fields" class="group">
          <label class="row stacked">
            Text
            <textarea id="label-text" rows="2"></textarea>
          </label>
          <label class="row">
            X
            <input id="label-x" type="number" min="0" max="1500" step="1">
          </label>
          <label class="row">
            Y
            <input id="label-y" type="number" min="0" max="1500" step="1">
          </label>
          <div class="row">
            Pointer
            <div id="label-pointer">
              <button type="button" data-pointer="nw" aria-label="Top left"><span class="material-symbols-rounded">north_west</span></button>
              <button type="button" data-pointer="n" aria-label="Top"><span class="material-symbols-rounded">north</span></button>
              <button type="button" data-pointer="ne" aria-label="Top right"><span class="material-symbols-rounded">north_east</span></button>
              <button type="button" data-pointer="w" aria-label="Left"><span class="material-symbols-rounded">west</span></button>
              <button type="button" data-pointer="" aria-label="No pointer"><span class="material-symbols-rounded">block</span></button>
              <button type="button" data-pointer="e" aria-label="Right"><span class="material-symbols-rounded">east</span></button>
              <button type="button" data-pointer="sw" aria-label="Bottom left"><span class="material-symbols-rounded">south_west</span></button>
              <button type="button" data-pointer="s" aria-label="Bottom"><span class="material-symbols-rounded">south</span></button>
              <button type="button" data-pointer="se" aria-label="Bottom right"><span class="material-symbols-rounded">south_east</span></button>
            </div>
          <div class="row">
            Pins
            <button id="add-pin" type="button" aria-label="Add location" aria-pressed="false">
              <span class="material-symbols-rounded">add_location</span>
            </button>
          </div>
          </div>
        </div>
        <div id="label-style-picker" class="group">
          Style
        </div>
      </div>
      <div id="label-styles">
        <div id="label-style-browser" class="group">
          <div id="label-style-list"></div>
          <button id="new-label-style" type="button">New label style</button>
        </div>
        <form id="label-style-form" hidden>
          <button id="style-back" type="button" aria-label="Back to label styles">
            <span class="material-symbols-rounded">arrow_back</span>
          </button>
          <div class="group">
            <label class="row">
              Name
              <input id="style-name" type="text" required>
            </label>
            <label class="row">
              Font
              <span class="font-picker">
                <input id="style-font" type="text" autocomplete="off" required>
                <div id="font-options" hidden></div>
              </span>
            </label>
            <label class="row">
              Font weight
              <select id="style-weight">
                <option value="100">Thin</option>
                <option value="200">Extra light</option>
                <option value="300">Light</option>
                <option value="400">Regular</option>
                <option value="500">Medium</option>
                <option value="600">Semi bold</option>
                <option value="700">Bold</option>
                <option value="800">Extra bold</option>
                <option value="900">Black</option>
              </select>
            </label>
            <label class="row">
              Font size
              <input id="style-size" type="number" min="4" max="200" step="1" required>
            </label>
            <label class="row">
              Line height
              <input id="style-line-height" type="number" min="0.5" max="4" step="0.1" required>
            </label>
            <label class="row">
              <span><input id="style-caps" type="checkbox"> All caps</span>
            </label>
          </div>
          <div class="group">
            <label class="row">
              Color
              <span class="color-field"><input id="style-color" type="color"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
            </label>
            <label class="row">
              <span><input id="style-outline-on" type="checkbox"> Outline color</span>
              <span class="color-field"><input id="style-outline" type="color"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
            </label>
            <label class="row">
              Outline weight
              <input id="style-outline-width" type="number" min="0" max="50" step="0.5">
            </label>
            <label class="row">
              <span><input id="style-shadow-on" type="checkbox"> Shadow color</span>
              <span class="color-field"><input id="style-shadow" type="color"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
            </label>
          </div>
          <div class="group">
            <label class="row">
              Padding top and bottom
              <input id="style-padding-y" type="number" min="0" max="200" step="1">
            </label>
            <label class="row">
              Padding sides
              <input id="style-padding-x" type="number" min="0" max="200" step="1">
            </label>
            <label class="row">
              <span><input id="style-background-on" type="checkbox"> Background color</span>
              <span class="color-field"><input id="style-background" type="color"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
            </label>
            <label class="row">
              Border radius
              <input id="style-radius" type="number" min="0" max="200" step="1">
            </label>
          </div>
        </form>
      </div>
    </div>
    <div id="path-panel">
      <div class="group">
        <label class="row">
          <span><input id="show-labels" type="checkbox" checked> Show labels</span>
        </label>
        <label class="row">
          Snap distance
          <span class="slider"><input id="snap-distance" type="range" min="0" max="50" value="15"><output for="snap-distance"></output></span>
        </label>
        <label class="row">
          Segment hover distance
          <span class="slider"><input id="segment-distance" type="range" min="1" max="50" value="10"><output for="segment-distance"></output></span>
        </label>
        <label class="row">
          Bend focus
          <span class="slider"><input id="bend-focus" type="range" min="0" max="100" value="0"><output for="bend-focus"></output></span>
        </label>
        <label class="row">
          Nudge amount
          <span class="slider"><input id="nudge-amount" type="range" min="1" max="20" value="1"><output for="nudge-amount"></output></span>
        </label>
        <label class="row">
          Path color
          <span class="color-field"><input id="path-color" type="color" value="#ffbf17"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
        </label>
      </div>
      <div class="group">
        <label id="intersection-field" class="row" hidden>
          <span><input id="intersection" type="checkbox"> Intersection</span>
        </label>
        <button id="create-path" type="button" hidden>Create path</button>
        <label id="path-visible-field" class="row" hidden>
          <span><input id="path-visible" type="checkbox"> Visible</span>
        </label>
        <div id="path-width-fields" hidden>
          <label class="row">
            Width
            <span class="slider"><input id="path-width" type="range" min="1" max="100"><output for="path-width"></output></span>
          </label>
          <label class="row">
            Width color
            <span class="color-field"><input id="path-width-color" type="color"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
          </label>
        </div>
        <button id="destroy-path" type="button" hidden>Destroy path</button>
        <button id="delete-bend" type="button" hidden>Delete bend</button>
        <label id="fill-area-field" class="row" hidden>
          <span><input id="fill-area" type="checkbox"> Fill area</span>
        </label>
        <label id="fill-visible-field" class="row" hidden>
          <span><input id="fill-visible" type="checkbox"> Visible</span>
        </label>
        <label id="fill-color-field" class="row" hidden>
          Fill color
          <span class="color-field"><input id="fill-color" type="color"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
        </label>
      </div>
    </div>
    <div id="background-panel" hidden>
      <div class="group">
        <input id="image-upload" type="file" accept="image/*">
        <div id="image-preview" hidden>
          <img alt="Background image">
          <button id="image-delete" type="button" aria-label="Delete image">
            <span class="material-symbols-rounded">delete</span>
          </button>
        </div>
        <label class="row">
          Background color
          <span class="color-field"><input id="canvas-color" type="color" value="#7b8365"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>
        </label>
      </div>
    </div>
  </div>
  <script src="google-fonts.js"></script>
  <script>
    // Each color input is followed by an opacity percentage, and the two
    // together make one #rrggbbaa color.
    function colorOf(input) {
      const percent = input.nextElementSibling.valueAsNumber;
      const alpha = Math.round(Math.min(100, Math.max(0, Number.isNaN(percent) ? 100 : percent)) * 2.55);
      return alpha === 255 ? input.value : input.value + alpha.toString(16).padStart(2, '0');
    }
    function showColor(input, color) {
      input.value = color.slice(0, 7);
      const opacity = input.nextElementSibling;
      if (document.activeElement !== opacity) {
        opacity.value = color.length > 7 ? Math.round(parseInt(color.slice(7), 16) / 2.55) : 100;
      }
    }
    for (const opacity of document.querySelectorAll('.opacity')) {
      const color = opacity.previousElementSibling;
      opacity.addEventListener('input', () => color.dispatchEvent(new Event('input')));
      opacity.addEventListener('change', () => {
        color.dispatchEvent(new Event('change'));
        opacity.blur();
      });
    }
    const modeButtons = document.querySelectorAll('#mode-menu [data-mode]');
    const labelTools = document.getElementById('label-tools');
    const labelToolButtons = document.querySelectorAll('[data-label-tool]');
    let labelTool = 'select';
    let selectedLabels = [];
    const soleLabel = () => (selectedLabels.length === 1 ? selectedLabels[0] : null);
    // Selected pins always belong to selected labels.
    let selectedPins = [];
    const pinOwner = (pin) => labels.find((label) => label.pins.includes(pin));
    const addPinButton = document.getElementById('add-pin');

    // 'pin' drops one pin for the selected label, from the panel's button.
    function setLabelTool(name) {
      labelTool = name;
      for (const button of labelToolButtons) {
        button.setAttribute('aria-pressed', button.dataset.labelTool === name);
      }
      addPinButton.setAttribute('aria-pressed', name === 'pin');
      updateCursor();
    }
    addPinButton.addEventListener('click', () => {
      setLabelTool(labelTool === 'pin' ? 'select' : 'pin');
      addPinButton.blur();
    });
    for (const button of labelToolButtons) {
      button.addEventListener('click', () => setLabelTool(button.dataset.labelTool));
    }
    const modePanels = {
      path: document.getElementById('path-panel'),
      background: document.getElementById('background-panel'),
      labels: document.getElementById('labels-panel'),
    };
    const pathTools = document.getElementById('path-tools');
    const toolButtons = document.querySelectorAll('#path-tools [data-tool]');
    let tool = 'select';

    function setTool(name) {
      tool = name;
      for (const button of toolButtons) {
        button.setAttribute('aria-pressed', button.dataset.tool === name);
      }
      updateCursor();
      draw();
    }

    function setMode(mode) {
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', button.dataset.mode === mode);
      }
      for (const [name, panel] of Object.entries(modePanels)) {
        panel.hidden = name !== mode;
      }
      pathTools.hidden = mode !== 'path';
      labelTools.hidden = mode !== 'labels';
      if (mode !== 'labels') {
        setLabelTool('select');
        finishLabel(false);
        selectedLabels = [];
      }
      if (mode !== 'path') selected = null;
      closeCrossingDialog();
      setTool('select');
    }

    for (const button of modeButtons) {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    }
    for (const button of toolButtons) {
      button.addEventListener('click', () => setTool(button.dataset.tool));
    }

    // A path is a set of points joined by segments. A segment is [a, b] or
    // [a, b, c1, c2]: its ends are the point objects themselves, so moving a
    // point moves its segments, and two control points bend it into a curve.
    const paths = [];
    // { path, point }, { path, segment }, { path, area: Set of its points }, or
    // { items: [...] } for two or more dots and segments.
    let selected = null;

    const selectionItems = () => selected?.items ?? (selected?.point || selected?.segment ? [selected] : []);

    // A user-made path: segments grouped so that they select and move as one.
    // Internally "path" already names a connected set of dots, so these are
    // groups in the code. { segments: Set, visible, width, widthColor }, with
    // width in background pixels so it scales with the map.
    const groups = [];
    const groupOf = (segment) => groups.find((group) => group.segments.has(segment));
    const pathOf = (segment) => paths.find((path) => path.segments.includes(segment));
    const groupItems = (group) => [...group.segments].map((segment) => ({ path: pathOf(segment), segment }));

    // Drops segments that no longer exist from groups, and groups left empty.
    function pruneGroups() {
      for (const group of groups) {
        for (const segment of group.segments) {
          if (!pathOf(segment)) group.segments.delete(segment);
        }
      }
      groups.splice(0, groups.length, ...groups.filter((group) => group.segments.size));
    }

    // Any grouped segment brings its whole group along. A selection that is
    // exactly one group is tagged with it.
    function setSelectionItems(items) {
      const expanded = [...items];
      for (const item of items) {
        const group = item.segment && groupOf(item.segment);
        if (!group) continue;
        for (const member of groupItems(group)) {
          if (!expanded.some((other) => sameItem(other, member))) expanded.push(member);
        }
      }
      const first = expanded[0]?.segment && groupOf(expanded[0].segment);
      const whole = first && expanded.length === first.segments.size && expanded.every((item) => first.segments.has(item.segment));
      if (whole) selected = { items: expanded, group: first };
      else selected = expanded.length === 0 ? null : expanded.length === 1 ? expanded[0] : { items: expanded };
    }

    // Every point a move of the selection carries: selected dots and the ends
    // of selected segments.
    const movingPoints = () =>
      new Set(selectionItems().flatMap((item) => (item.point ? [item.point] : item.segment.slice(0, 2))));

    const sameItem = (a, b) => (a.point ? a.point === b.point : a.segment === b.segment);

    function toggleInSelection(item) {
      const group = item.segment && groupOf(item.segment);
      const members = group ? groupItems(group) : [item];
      const items = selectionItems();
      const kept = items.filter((other) => !members.some((member) => sameItem(other, member)));
      setSelectionItems(kept.length === items.length ? [...items, ...members] : kept);
    }
    const DOT_RADIUS = 5;
    const SELECTED_DOT_RADIUS = 7;
    // Bending right at an end would swing the control points wildly, so a
    // bend is placed at least this far (as a fraction of the segment) from
    // either end.
    const BEND_END_MARGIN = 0.1;

    function labelledSlider(id, unit = 'px') {
      const input = document.getElementById(id);
      const output = document.querySelector(`output[for="${id}"]`);
      const show = () => { output.value = `${input.value}${unit}`; };
      show();
      input.addEventListener('input', show);
      return input;
    }
    const snapInput = labelledSlider('snap-distance');
    const segmentDistanceInput = labelledSlider('segment-distance');
    const nudgeInput = labelledSlider('nudge-amount');
    const bendFocusInput = labelledSlider('bend-focus', '%');
    const SHIFT_NUDGE_FACTOR = 10;
    const NUDGE_DIRECTIONS = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
    };
    const showLabelsToggle = document.getElementById('show-labels');
    showLabelsToggle.addEventListener('change', () => {
      showLabelsToggle.blur();
      draw();
    });
    const pathColor = document.getElementById('path-color');
    pathColor.addEventListener('input', () => draw());

    // Distances are in screen pixels so they feel the same at any zoom.
    function nearestPoint(sx, sy, maxDistance, exclude) {
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const point of path.points) {
          if (point === exclude) continue;
          const d = Math.hypot(point.x * view.scale + view.x - sx, point.y * view.scale + view.y - sy);
          if (d <= bestDistance) {
            best = { path, point };
            bestDistance = d;
          }
        }
      }
      return best;
    }

    function pointAt(sx, sy) {
      return nearestPoint(sx, sy, SELECTED_DOT_RADIUS);
    }

    const lerp = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });

    function segmentPoint([a, b, c1, c2], t) {
      if (!c1) return lerp(a, b, t);
      const p12 = lerp(c1, c2, t);
      return lerp(lerp(lerp(a, c1, t), p12, t), lerp(p12, lerp(c2, b, t), t), t);
    }

    // The closest spot on a segment to p, all in background coordinates.
    // Curves are approximated by short straight pieces.
    function closestOnSegment(segment, p) {
      const steps = segment[2] ? 32 : 1;
      let best = null;
      for (let i = 0; i < steps; i++) {
        const a = segmentPoint(segment, i / steps);
        const b = segmentPoint(segment, (i + 1) / steps);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSq = dx * dx + dy * dy;
        const u = lengthSq === 0 ? 0 : Math.min(1, Math.max(0, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSq));
        const q = lerp(a, b, u);
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (!best || d < best.distance) best = { point: q, t: (i + u) / steps, distance: d };
      }
      return best;
    }

    // The segment nearest screen point s within the hover distance, and t,
    // where along it the nearest spot is.
    function segmentHit(sx, sy, maxDistance = Number(segmentDistanceInput.value), skip = () => false) {
      const p = toBackground(sx, sy);
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const segment of path.segments) {
          if (skip(segment)) continue;
          const { t, distance } = closestOnSegment(segment, p);
          if (distance * view.scale <= bestDistance) {
            best = { path, segment, t };
            bestDistance = distance * view.scale;
          }
        }
      }
      return best;
    }

    function segmentAt(sx, sy) {
      const hit = segmentHit(sx, sy);
      return hit && { path: hit.path, segment: hit.segment };
    }

    const bendT = (t) => Math.min(1 - BEND_END_MARGIN, Math.max(BEND_END_MARGIN, t));

    // Replaces any bend with one that passes through m at t. It starts from
    // the straight segment (control points at its thirds) and pushes the two
    // control points by k1 and k2 times the offset of m from that line.
    // Equal weights give a symmetric bulge peaking mid-segment. Focused
    // weights put the peak at t, or a third of the way from an end when t is
    // nearer than that, since a single bulge can't peak closer. The bend focus
    // slider blends between the two; both keep the weights non-negative, so
    // the curve never doubles back into an S.
    function bendSegment(segment, t, m) {
      const [a, b] = segment;
      const u = 1 - t;
      const base = lerp(a, b, t);
      const dx = m.x - base.x;
      const dy = m.y - base.y;
      // The curve's offset at t is 3tu(u·k1 + t·k2), which must equal 1 there.
      // For the focused weights its slope must also be 0 at t.
      const reach = 1 / (3 * t * u);
      const spread = -((1 - 2 * t) * reach) / (t * u);
      let f1 = reach - t * spread;
      let f2 = f1 + spread;
      if (f2 < 0) [f1, f2] = [reach / u, 0];
      if (f1 < 0) [f1, f2] = [0, reach / t];
      const focus = Number(bendFocusInput.value) / 100;
      const k1 = reach + (f1 - reach) * focus;
      const k2 = reach + (f2 - reach) * focus;
      const third = lerp(a, b, 1 / 3);
      const twoThirds = lerp(a, b, 2 / 3);
      segment[2] = { x: third.x + dx * k1, y: third.y + dy * k1 };
      segment[3] = { x: twoThirds.x + dx * k2, y: twoThirds.y + dy * k2 };
    }

    // Splits a segment at t, keeping any bend's shape. The split point is new
    // unless one already in the path is given.
    function splitSegment(path, segment, t, point = segmentPoint(segment, t)) {
      const [a, b, c1, c2] = segment;
      if (!path.points.includes(point)) path.points.push(point);
      let halves = [[a, point], [point, b]];
      if (c1) {
        const p01 = lerp(a, c1, t);
        const p12 = lerp(c1, c2, t);
        const p23 = lerp(c2, b, t);
        halves = [[a, point, p01, lerp(p01, p12, t)], [point, b, lerp(p12, p23, t), p23]];
      }
      path.segments.splice(path.segments.indexOf(segment), 1, ...halves);
      const group = groupOf(segment);
      if (group) {
        group.segments.delete(segment);
        for (const half of halves) group.segments.add(half);
      }
      for (const fill of fills) {
        if (fill.has(a) && fill.has(b)) fill.add(point);
      }
      return point;
    }

    function insertOnSegment({ t }) {
      const { path, segment } = selected;
      selected = { path, point: splitSegment(path, segment, t) };
    }

    // An area is a bounded face of a path: the smallest loop of segments
    // around a spot. Fills are remembered by the set of points on the loop,
    // so they survive moving and bending.
    const fills = [];

    // Points along a segment walked from one end, without the far end.
    function sampleEdge({ from, segment }) {
      const steps = segment[2] ? 16 : 1;
      const forward = segment[0] === from;
      const points = [];
      for (let i = 0; i < steps; i++) points.push(segmentPoint(segment, forward ? i / steps : 1 - i / steps));
      return points;
    }

    function computeAreas() {
      const areas = [];
      for (const path of paths) {
        const out = new Map();
        const addEdge = (from, to, segment, toward) => {
          if (!out.has(from)) out.set(from, []);
          out.get(from).push({ from, to, segment, angle: Math.atan2(toward.y - from.y, toward.x - from.x) });
        };
        for (const segment of path.segments) {
          const [a, b, c1, c2] = segment;
          addEdge(a, b, segment, c1 ?? b);
          addEdge(b, a, segment, c2 ?? a);
        }
        for (const edges of out.values()) edges.sort((p, q) => p.angle - q.angle);

        // Walk each face by always taking the next edge clockwise at every
        // point. Bounded faces come out with positive area, the outer one negative.
        const seen = new Set();
        for (const edges of out.values()) {
          for (const start of edges) {
            if (seen.has(start)) continue;
            const loop = [];
            let edge = start;
            do {
              seen.add(edge);
              loop.push(edge);
              const next = out.get(edge.to);
              const back = next.findIndex((e) => e.segment === edge.segment && e.to === edge.from);
              edge = next[(back - 1 + next.length) % next.length];
            } while (edge !== start);
            const polygon = loop.flatMap(sampleEdge);
            let area = 0;
            for (let i = 0; i < polygon.length; i++) {
              const p = polygon[i];
              const q = polygon[(i + 1) % polygon.length];
              area += p.x * q.y - q.x * p.y;
            }
            if (area > 1e-6) {
              areas.push({ path, loop, polygon, area: area / 2, points: new Set(loop.map((e) => e.from)) });
            }
          }
        }
      }
      return areas;
    }

    const samePoints = (s, t) => s.size === t.size && [...s].every((p) => t.has(p));
    // Each fill is a Set of its area's points, carrying `visible` and `color`
    // like a path: a visible fill shows in its own color in both modes.
    const fillOf = (points) => fills.find((fill) => samePoints(fill, points));
    const isFilled = (area) => !!fillOf(area.points);

    function insidePolygon(polygon, p) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if ((a.y > p.y) !== (b.y > p.y) && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) {
          inside = !inside;
        }
      }
      return inside;
    }

    function areaAt(areas, sx, sy) {
      const p = toBackground(sx, sy);
      let best = null;
      for (const area of areas) {
        if (insidePolygon(area.polygon, p) && (!best || area.area < best.area)) best = area;
      }
      return best;
    }

    // Returns the segment drawn to the new point, if any.
    function addPoint(point) {
      if (selected?.point) {
        const segment = [selected.point, point];
        selected.path.points.push(point);
        selected.path.segments.push(segment);
        selected = { path: selected.path, point };
        return segment;
      }
      const path = { points: [point], segments: [] };
      paths.push(path);
      selected = { path, point };
      return null;
    }

    // Folds point `from` into `onto`, keeping every connection either had.
    // Segments between the two vanish, and duplicates collapse to one.
    function mergePoints(path, from, onto) {
      const into = onto.path;
      mergePaths(into, path);
      for (const segment of into.segments) {
        if (segment[0] === from) segment[0] = onto.point;
        if (segment[1] === from) segment[1] = onto.point;
      }
      into.points.splice(into.points.indexOf(from), 1);
      const seen = new Set();
      into.segments = into.segments.filter(([a, b]) => {
        const key = [into.points.indexOf(a), into.points.indexOf(b)].sort().join();
        if (a === b || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      for (const fill of fills) {
        if (fill.delete(from)) fill.add(onto.point);
      }
      onto.point.intersection ||= from.intersection;
      pruneGroups();
      selected = { path: into, point: onto.point };
    }

    function mergePaths(into, from) {
      if (into === from) return;
      into.points.push(...from.points);
      into.segments.push(...from.segments);
      paths.splice(paths.indexOf(from), 1);
    }

    // Returns the segment it creates, or null if the two were already joined.
    function connectTo(target) {
      const path = selected.path;
      const from = selected.point;
      const to = target.point;
      mergePaths(path, target.path);
      selected = { path, point: to };
      if (path.segments.some(([a, b]) => (a === from && b === to) || (a === to && b === from))) return null;
      const segment = [from, to];
      path.segments.push(segment);
      return segment;
    }

    // Where a segment crosses others away from either one's ends, as
    // { path, segment, t (along that segment), s (along this one), point }.
    // Curves are approximated by short straight pieces.
    function findCrossings(piece) {
      const pieces = (segment) => {
        const steps = segment[2] ? 32 : 1;
        return Array.from({ length: steps }, (_, i) => [segmentPoint(segment, i / steps), segmentPoint(segment, (i + 1) / steps), i, steps]);
      };
      const mine = pieces(piece);
      const crossings = [];
      const nearEnd = (t) => t < 1e-4 || t > 1 - 1e-4;
      for (const path of paths) {
        for (const segment of path.segments) {
          if (segment === piece) continue;
          for (const [m0, m1, i, mSteps] of mine) {
            for (const [o0, o1, j, oSteps] of pieces(segment)) {
              const rx = m1.x - m0.x, ry = m1.y - m0.y, sx = o1.x - o0.x, sy = o1.y - o0.y;
              const denom = rx * sy - ry * sx;
              if (Math.abs(denom) < 1e-9) continue;
              const u = ((o0.x - m0.x) * sy - (o0.y - m0.y) * sx) / denom;
              const v = ((o0.x - m0.x) * ry - (o0.y - m0.y) * rx) / denom;
              if (u < 0 || u > 1 || v < 0 || v > 1) continue;
              const t = (j + v) / oSteps;
              const s = (i + u) / mSteps;
              if (nearEnd(t) || nearEnd(s)) continue;
              crossings.push({ path, segment, t, s, point: lerp(m0, m1, u) });
            }
          }
        }
      }
      return crossings;
    }

    // Adds a shared intersection node wherever the segment crosses another,
    // splitting both.
    function addCrossingNodes(start) {
      const work = [start];
      for (let guard = 0; work.length && guard < 200; guard++) {
        const piece = work.pop();
        const path = pathOf(piece);
        const hit = path && findCrossings(piece)[0];
        if (!hit) continue;
        mergePaths(path, hit.path);
        const point = splitSegment(path, hit.segment, hit.t);
        point.intersection = true;
        const at = path.segments.indexOf(piece);
        splitSegment(path, piece, hit.s, point);
        work.push(path.segments[at], path.segments[at + 1]);
      }
      if (selected?.point) selected = { path: paths.find((path) => path.points.includes(selected.point)), point: selected.point };
    }

    // An item may already be gone when an earlier deletion in the same
    // selection took it along, as an orphaned end or a dot's segment.
    function deleteItem({ path, point, segment }) {
      if (!paths.includes(path)) return;
      if (segment) {
        if (!path.segments.includes(segment)) return;
        path.segments.splice(path.segments.indexOf(segment), 1);
        for (const end of segment.slice(0, 2)) {
          if (!path.segments.some(([a, b]) => a === end || b === end)) {
            path.points.splice(path.points.indexOf(end), 1);
          }
        }
      } else {
        if (!path.points.includes(point)) return;
        path.points.splice(path.points.indexOf(point), 1);
        path.segments = path.segments.filter(([a, b]) => a !== point && b !== point);
      }
      if (path.points.length === 0) paths.splice(paths.indexOf(path), 1);
    }

    function deleteSelected() {
      for (const item of selectionItems()) deleteItem(item);
      pruneGroups();
      selected = null;
    }

    // One step of undo: a copy of the paths, fills and selection taken just
    // before the last edit. Copies of points replace the originals everywhere
    // so segments, fills and the selection still share them.
    let undoState = null;

    function snapshot() {
      const copies = new Map();
      const segmentCopies = new Map();
      const copy = (p) => {
        if (!copies.has(p)) copies.set(p, { ...p });
        return copies.get(p);
      };
      const copiedPaths = paths.map((path) => ({
        points: path.points.map(copy),
        segments: path.segments.map((segment) => {
          const [a, b, ...controls] = segment;
          const copied = [copy(a), copy(b), ...controls.map((c) => ({ ...c }))];
          segmentCopies.set(segment, copied);
          return copied;
        }),
      }));
      const copyItem = ({ path, point, segment }) => ({
        pathIndex: paths.indexOf(path),
        point: point && copy(point),
        segmentIndex: segment && path.segments.indexOf(segment),
      });
      let copiedSelection = { items: selectionItems().map(copyItem) };
      if (selected?.area) copiedSelection = { pathIndex: paths.indexOf(selected.path), area: new Set([...selected.area].map(copy)) };
      return {
        paths: copiedPaths,
        fills: fills.map((fill) => Object.assign(new Set([...fill].filter((p) => copies.has(p)).map(copy)), { visible: fill.visible, color: fill.color })),
        groups: groups.map((group) => ({ ...group, segments: new Set([...group.segments].map((segment) => segmentCopies.get(segment))) })),
        labels: labels.map((label) => ({ ...label, pins: label.pins.map((pin) => ({ ...pin })) })),
        labelStyles: labelStyles.map((style) => ({ ...style })),
        selection: copiedSelection,
      };
    }

    function recordUndo(state = snapshot()) {
      undoState = state;
    }

    function undo() {
      if (!undoState) return;
      const { paths: restoredPaths, fills: restoredFills, groups: restoredGroups, labels: restoredLabels, labelStyles: restoredStyles, selection } = undoState;
      undoState = null;
      paths.splice(0, paths.length, ...restoredPaths);
      groups.splice(0, groups.length, ...restoredGroups);
      labels.splice(0, labels.length, ...restoredLabels);
      labelStyles.splice(0, labelStyles.length, ...restoredStyles);
      renderLabelStyles();
      closeStyleForm();
      selectedLabels = [];
      selectedPins = [];
      fills.splice(0, fills.length, ...restoredFills);
      if (selection.area) {
        selected = { path: restoredPaths[selection.pathIndex], area: selection.area };
      } else {
        setSelectionItems(selection.items.map(({ pathIndex, point, segmentIndex }) => {
          const path = restoredPaths[pathIndex];
          return point ? { path, point } : { path, segment: path.segments[segmentIndex] };
        }));
      }
      drag = null;
      draw();
      updateCursor();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input[type="text"], textarea')) return;
      if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (pathTools.hidden || e.target.closest('input, textarea, select')) return;
      const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
      if (plain && e.key === '1') setTool('select');
      if (plain && e.key === '2') setTool('add');
      const nudge = NUDGE_DIRECTIONS[e.key];
      if (nudge && selectionItems().length) {
        e.preventDefault();
        // Background pixels, so a nudge is the same distance on the map at any zoom.
        const step = Number(nudgeInput.value) * (e.shiftKey ? SHIFT_NUDGE_FACTOR : 1);
        recordUndo();
        moveSelection(nudge[0] * step, nudge[1] * step);
        draw();
        updateCursor();
      }
      // Mac keyboards label Backspace "delete".
      const deleting = e.key === 'Delete' || e.key === 'Backspace';
      const fillIndex = selected?.area ? fills.findIndex((fill) => samePoints(fill, selected.area)) : -1;
      if (deleting && selectionItems().length) {
        e.preventDefault();
        recordUndo();
        deleteSelected();
        draw();
        updateCursor();
      } else if (deleting && fillIndex !== -1) {
        // On a selected area, Delete only ever removes its fill.
        e.preventDefault();
        recordUndo();
        fills.splice(fillIndex, 1);
        draw();
      } else if (e.key === 'Escape') {
        // An embedding page may otherwise take Esc as a cue to move focus out
        // of this frame, and then the next Esc never arrives here.
        e.preventDefault();
        closeCrossingDialog();
        // A first Esc clears the selection; with nothing selected it returns to the cursor tool.
        if (!selected) setTool('select');
        selected = null;
        draw();
        updateCursor();
      } else if (e.key === 'Enter') {
        // Stops a focused toolbar button from being pressed.
        e.preventDefault();
        selected = null;
        draw();
        updateCursor();
      }
    });

    const BACKGROUND = 1500;
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 20;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const canvasColor = document.getElementById('canvas-color');
    canvasColor.addEventListener('input', () => draw());

    const view = { scale: 1, x: 0, y: 0 };
    let size = null;

    function centerBackground(w, h) {
      view.scale = Math.min(w, h) / BACKGROUND * 0.9;
      view.x = (w - BACKGROUND * view.scale) / 2;
      view.y = (h - BACKGROUND * view.scale) / 2;
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      // The canvas can still be settling into its final size after load, so
      // centre on the first real size and keep the view centred through resizes.
      if (size === null) {
        centerBackground(w, h);
      } else {
        view.x += (w - size.w) / 2;
        view.y += (h - size.h) / 2;
      }
      size = { w, h };
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      draw();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.fillStyle = colorOf(canvasColor);
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);
      if (backgroundImage) {
        // Cover the background, centred, and draw the overflow too.
        const s = Math.max(BACKGROUND / backgroundImage.naturalWidth, BACKGROUND / backgroundImage.naturalHeight);
        const w = backgroundImage.naturalWidth * s;
        const h = backgroundImage.naturalHeight * s;
        ctx.drawImage(backgroundImage, (BACKGROUND - w) / 2, (BACKGROUND - h) / 2, w, h);
      }
      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 1 / view.scale;
      ctx.strokeRect(0, 0, BACKGROUND, BACKGROUND);
      if (pathTools.hidden) {
        for (const area of computeAreas()) {
          const fill = fillOf(area.points);
          if (!fill?.visible) continue;
          ctx.fillStyle = fill.color;
          traceArea(area);
          ctx.fill();
        }
        for (const group of groups) {
          if (group.visible && group.width > 0) strokeGroupWidth(group);
        }
        drawLabels();
        if (!labelTools.hidden) drawPins();
        drawMarquee();
        updatePanel();
        return;
      }

      // Lines and dots keep the same on-screen size at any zoom.
      const px = 1 / view.scale;
      const items = selectionItems();
      const selectedPoints = new Set(items.map((item) => item.point).filter(Boolean));
      const selectedSegments = new Set(items.map((item) => item.segment).filter(Boolean));
      const color = colorOf(pathColor);
      const shadow = () => {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4 * dpr;
        ctx.shadowOffsetY = 1 * dpr;
      };

      const areas = computeAreas();
      if (selected?.area && !areas.some((area) => samePoints(area.points, selected.area))) selected = null;
      const fillArea = (area) => {
        traceArea(area);
        ctx.fill();
      };
      for (const area of areas) {
        const fill = fillOf(area.points);
        if (!fill) continue;
        ctx.save();
        if (fill.visible) {
          ctx.fillStyle = fill.color;
        } else {
          ctx.fillStyle = color;
          ctx.globalAlpha = 0.8;
        }
        fillArea(area);
        ctx.restore();
      }
      ctx.fillStyle = color;
      // A hovered area shows a ghost fill, and a selected one keeps it.
      const selectedArea = selected?.area && areas.find((area) => samePoints(area.points, selected.area));
      const ghostAreas = new Set([hoveredAreaIn(areas), selectedArea].filter((area) => area && !isFilled(area)));
      ctx.save();
      ctx.globalAlpha = 0.3;
      ghostAreas.forEach(fillArea);
      ctx.restore();

      // The selected area gets a white border just inside its edges: a wide
      // stroke clipped to the area, whose inner rim the edge lines then cover.
      if (selectedArea) {
        ctx.save();
        ctx.beginPath();
        traceArea(selectedArea);
        ctx.clip();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 6 * px;
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();
      }

      for (const group of groups) {
        if (group.visible && group.width > 0) strokeGroupWidth(group);
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * px;
      ctx.beginPath();
      for (const path of paths) {
        for (const segment of path.segments) {
          if (!selectedSegments.has(segment)) traceSegment(segment);
        }
      }
      ctx.stroke();

      if (selectedSegments.size) {
        ctx.save();
        ctx.lineCap = 'round';
        shadow();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 7 * px;
        ctx.beginPath();
        for (const segment of selectedSegments) traceSegment(segment);
        ctx.stroke();
        ctx.restore();
        ctx.lineWidth = 3 * px;
        ctx.stroke();
      }

      const target = addTarget();
      const lineEnd = target?.connect?.point ?? target?.split?.point ?? target?.add;
      if (selected?.point && lineEnd) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2 * px;
        ctx.setLineDash([6 * px, 4 * px]);
        ctx.beginPath();
        ctx.moveTo(selected.point.x, selected.point.y);
        ctx.lineTo(lineEnd.x, lineEnd.y);
        ctx.stroke();
        ctx.restore();
      }

      const guides = drag?.guides ?? target?.guides;
      if (guides?.length) {
        const length = 4 * BACKGROUND;
        ctx.save();
        ctx.strokeStyle = 'red';
        ctx.lineWidth = px;
        ctx.beginPath();
        for (const { origin, dx, dy } of guides) {
          ctx.moveTo(origin.x - dx * length, origin.y - dy * length);
          ctx.lineTo(origin.x + dx * length, origin.y + dy * length);
        }
        ctx.stroke();
        ctx.restore();
      }

      const hovered = drag?.snapTo?.point ?? hoveredPoint(target);
      ctx.fillStyle = color;
      for (const path of paths) {
        for (const point of path.points) {
          if (selectedPoints.has(point) || point === hovered) continue;
          ctx.beginPath();
          ctx.arc(point.x, point.y, DOT_RADIUS * px, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const emphasise = (point, outlineAlpha) => {
        ctx.save();
        shadow();
        ctx.beginPath();
        ctx.arc(point.x, point.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = `rgba(255, 255, 255, ${outlineAlpha})`;
        ctx.lineWidth = 2 * px;
        ctx.stroke();
      };
      if (hovered) emphasise(hovered, 0.7);
      for (const point of selectedPoints) emphasise(point, 1);

      const ghost = target?.insert?.point ?? target?.split?.point ?? bendGhost();
      if (ghost) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (showLabelsToggle.checked) drawLabels();

      drawMarquee();
      updatePanel();
    }

    const createPathButton = document.getElementById('create-path');
    createPathButton.addEventListener('click', () => {
      recordUndo();
      const segments = selectionItems().filter((item) => item.segment);
      for (const { segment } of segments) groupOf(segment)?.segments.delete(segment);
      pruneGroups();
      groups.push({ segments: new Set(segments.map((item) => item.segment)), visible: false, width: 20, widthColor: '#000000' });
      setSelectionItems(segments);
      draw();
    });

    const destroyPathButton = document.getElementById('destroy-path');
    destroyPathButton.addEventListener('click', () => {
      recordUndo();
      groups.splice(groups.indexOf(selected.group), 1);
      setSelectionItems(selectionItems());
      draw();
    });

    // A field that sets a property of the selected path (or another target)
    // as it changes, and becomes one undo step when the edit is committed.
    function liveField(id, key, read, target = () => selected?.group) {
      const input = document.getElementById(id);
      let before = null;
      input.addEventListener('input', () => {
        const object = target();
        if (!object) return;
        before ??= snapshot();
        object[key] = read(input);
        draw();
      });
      input.addEventListener('change', () => {
        if (before) recordUndo(before);
        before = null;
        // Hand focus back so keyboard shortcuts keep working.
        input.blur();
      });
      return input;
    }
    const pathWidthFields = document.getElementById('path-width-fields');
    labelledSlider('path-width');
    const pathWidthInput = liveField('path-width', 'width', (input) => Number(input.value));
    const pathWidthOutput = document.querySelector('output[for="path-width"]');
    const pathWidthColor = liveField('path-width-color', 'widthColor', colorOf);
    const selectedFill = () => selected?.area && fillOf(selected.area);
    const fillColorInput = liveField('fill-color', 'color', colorOf, selectedFill);
    const labelProperties = document.getElementById('label-properties');
    const labelStylesSection = document.getElementById('label-styles');
    const labelStyleList = document.getElementById('label-style-list');
    const labelStylePicker = document.getElementById('label-style-picker');
    let stylePickerKey = '';
    let loadedFontCount = 0;
    const styleForm = document.getElementById('label-style-form');
    const styleInputs = Object.fromEntries(
      ['name', 'font', 'weight', 'size', 'line-height', 'caps', 'color', 'outline-on', 'outline', 'outline-width', 'shadow-on', 'shadow', 'padding-y', 'padding-x', 'background-on', 'background', 'radius'].map((key) => [key, document.getElementById(`style-${key}`)]),
    );
    // A style's form saves as it goes: each change applies to the style and
    // its labels at once, and a whole visit to the form is one undo step.
    let editingStyle = null;
    let styleBefore = null; // { snapshot, recorded } from when the form opened
    const googleFonts = new Set(GOOGLE_FONTS);

    // Searchable font list: typing filters Google Fonts by any part of the
    // name; arrows move, Enter or a click picks.
    const fontInput = styleInputs.font;
    const fontOptions = document.getElementById('font-options');
    let fontMatches = [];
    let activeFont = -1;

    function showFontOptions() {
      const query = fontInput.value.trim().toLowerCase();
      // A complete font name shows the whole list rather than just itself.
      const filter = googleFonts.has(fontInput.value.trim()) ? '' : query;
      fontMatches = GOOGLE_FONTS.filter((font) => font.toLowerCase().includes(filter));
      activeFont = fontMatches.indexOf(fontInput.value.trim());
      fontOptions.replaceChildren(...fontMatches.map((font, i) => {
        const option = Object.assign(document.createElement('div'), { textContent: font });
        option.setAttribute('aria-selected', i === activeFont);
        // mousedown, not click, so the input keeps focus.
        option.addEventListener('mousedown', (e) => {
          e.preventDefault();
          pickFont(font);
        });
        return option;
      }));
      fontOptions.hidden = fontMatches.length === 0;
      fontOptions.children[activeFont]?.scrollIntoView({ block: 'nearest' });
    }

    function pickFont(font) {
      fontInput.value = font;
      fontInput.dispatchEvent(new Event('input', { bubbles: true }));
      fontOptions.hidden = true;
    }

    fontInput.addEventListener('focus', showFontOptions);
    fontInput.addEventListener('input', () => { if (document.activeElement === fontInput) showFontOptions(); });
    fontInput.addEventListener('blur', () => { fontOptions.hidden = true; });
    fontInput.addEventListener('keydown', (e) => {
      if (fontOptions.hidden && e.key !== 'ArrowDown') return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (fontOptions.hidden) showFontOptions();
        activeFont = Math.max(0, Math.min(fontMatches.length - 1, activeFont + (e.key === 'ArrowDown' ? 1 : -1)));
        [...fontOptions.children].forEach((option, i) => option.setAttribute('aria-selected', i === activeFont));
        fontOptions.children[activeFont]?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' && fontMatches[activeFont]) {
        e.preventDefault();
        pickFont(fontMatches[activeFont]);
      } else if (e.key === 'Escape') {
        fontOptions.hidden = true;
      }
    });

    // Rebuilds the style list and the label style picker from labelStyles.
    function renderLabelStyles() {
      labelStyleList.replaceChildren(...labelStyles.map((style, i) => {
        const row = document.createElement('div');
        row.className = 'row';
        const edit = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Edit' });
        edit.addEventListener('click', () => openStyleForm(style));
        const pick = Object.assign(document.createElement('input'), {
          type: 'radio',
          name: 'current-label-style',
          checked: style === currentStyle(),
          title: 'Use for new labels',
        });
        pick.addEventListener('change', () => {
          currentStyleId = style.id;
          pick.blur();
        });
        row.append(pick, Object.assign(document.createElement('span'), { textContent: style.name }), edit);
        if (i > 0) {
          const remove = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Delete' });
          remove.addEventListener('click', () => {
            recordUndo();
            labelStyles.splice(labelStyles.indexOf(style), 1);
            renderLabelStyles();
            draw();
          });
          row.append(remove);
        }
        return row;
      }));
    }

    function readStyleForm() {
      return {
        name: styleInputs.name.value.trim(),
        font: styleInputs.font.value.trim(),
        weight: Number(styleInputs.weight.value),
        size: Math.max(4, Number(styleInputs.size.value) || 24),
        lineHeight: Math.max(0.5, Number(styleInputs['line-height'].value) || 1.2),
        caps: styleInputs.caps.checked,
        color: colorOf(styleInputs.color),
        outline: styleInputs['outline-on'].checked ? colorOf(styleInputs.outline) : null,
        outlineWidth: Math.max(0, Number(styleInputs['outline-width'].value) || 0),
        shadow: styleInputs['shadow-on'].checked ? colorOf(styleInputs.shadow) : null,
        paddingY: Math.max(0, Number(styleInputs['padding-y'].value) || 0),
        paddingX: Math.max(0, Number(styleInputs['padding-x'].value) || 0),
        background: styleInputs['background-on'].checked ? colorOf(styleInputs.background) : null,
        radius: Math.max(0, Number(styleInputs.radius.value) || 0),
      };
    }

    const styleBrowser = document.getElementById('label-style-browser');

    function openStyleForm(style, recorded = false) {
      closeStyleForm();
      editingStyle = style;
      styleBefore = { snapshot: snapshot(), recorded };
      const values = style;
      styleInputs.name.value = values.name;
      styleInputs.font.value = values.font;
      styleInputs.weight.value = values.weight;
      styleInputs.size.value = values.size;
      styleInputs['line-height'].value = values.lineHeight;
      styleInputs.caps.checked = values.caps;
      showColor(styleInputs.color, values.color);
      styleInputs['outline-on'].checked = !!values.outline;
      showColor(styleInputs.outline, values.outline ?? '#ffffff');
      styleInputs['outline-width'].value = values.outlineWidth;
      styleInputs['shadow-on'].checked = !!values.shadow;
      showColor(styleInputs.shadow, values.shadow ?? '#000000');
      styleInputs['padding-y'].value = values.paddingY;
      styleInputs['padding-x'].value = values.paddingX;
      styleInputs['background-on'].checked = !!values.background;
      showColor(styleInputs.background, values.background ?? '#ffffff');
      styleInputs.radius.value = values.radius;
      styleBrowser.hidden = true;
      styleForm.hidden = false;
      styleInputs.name.focus();
    }

    function closeStyleForm() {
      editingStyle = null;
      styleBefore = null;
      styleForm.hidden = true;
      styleBrowser.hidden = false;
    }

    function applyStyleForm() {
      if (!editingStyle) return;
      const values = readStyleForm();
      // Half-typed font names aren't fonts, and a style needs a name; keep
      // the last good value of each.
      if (!googleFonts.has(values.font)) delete values.font;
      if (!values.name) delete values.name;
      if (!styleBefore.recorded) {
        recordUndo(styleBefore.snapshot);
        styleBefore.recorded = true;
      }
      Object.assign(editingStyle, values);
      renderLabelStyles();
      draw();
    }

    // Selected labels take the new style, and are let go so its form can show.
    function newLabelStyle() {
      recordUndo();
      const style = { id: nextStyleId++, name: `Style ${labelStyles.length + 1}`, ...NEW_STYLE };
      labelStyles.push(style);
      for (const label of selectedLabels) label.styleId = style.id;
      selectedLabels = [];
      draw();
      renderLabelStyles();
      openStyleForm(style, true);
      styleInputs.name.select();
    }
    document.getElementById('new-label-style').addEventListener('click', newLabelStyle);
    document.getElementById('style-back').addEventListener('click', closeStyleForm);
    styleForm.addEventListener('input', applyStyleForm);
    styleForm.addEventListener('change', applyStyleForm);
    // Enter in a field would otherwise submit the form and reload the page.
    styleForm.addEventListener('submit', (e) => e.preventDefault());

    function renderStylePicker(text) {
      const dpr = window.devicePixelRatio || 1;
      const room = labelStylePicker.clientWidth - 30;
      labelStylePicker.replaceChildren('Style', ...labelStyles.map((style) => {
        const option = document.createElement('label');
        const pick = Object.assign(document.createElement('input'), { type: 'radio', name: 'label-style', value: style.id });
        pick.addEventListener('change', () => {
          recordUndo();
          for (const label of selectedLabels) label.styleId = style.id;
          pick.blur();
          draw();
        });
        const preview = document.createElement('canvas');
        const label = { x: 0, y: 0, text, styleId: style.id };
        const box = labelBox(label);
        // Room for the outline and shadow around the box.
        const margin = style.size * 0.5;
        const w = box.w + 2 * margin;
        const h = box.h + 2 * margin;
        const scale = Math.min(1, room / w);
        preview.style.width = `${w * scale}px`;
        preview.style.height = `${h * scale}px`;
        preview.width = Math.ceil(w * scale * dpr);
        preview.height = Math.ceil(h * scale * dpr);
        const c = preview.getContext('2d');
        c.scale(scale * dpr, scale * dpr);
        c.translate(w / 2, h / 2);
        c.textAlign = 'center';
        c.textBaseline = 'alphabetic';
        c.lineJoin = 'round';
        loadFont(style.font, style.weight);
        c.font = fontOf(style);
        c.shadowColor = style.shadow ?? 'transparent';
        c.shadowBlur = style.size * 0.25 * scale * dpr;
        c.shadowOffsetY = style.size * 0.08 * scale * dpr;
        paintLabel(c, label, style);
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.setAttribute('aria-label', 'Edit style');
        edit.innerHTML = '<span class="material-symbols-rounded">edit</span>';
        edit.addEventListener('click', (e) => {
          // Inside the label, a click would otherwise also pick the style.
          e.preventDefault();
          selectedLabels = [];
          openStyleForm(style);
          draw();
        });
        option.append(pick, preview, edit);
        return option;
      }));
      const create = Object.assign(document.createElement('button'), { type: 'button', textContent: 'New label style' });
      create.addEventListener('click', newLabelStyle);
      labelStylePicker.append(create);
    }
    const labelTextInput = liveField('label-text', 'text', (input) => input.value, soleLabel);
    const labelXInput = liveField('label-x', 'x', (input) => clampToBackground(Number(input.value) || 0), soleLabel);
    const labelYInput = liveField('label-y', 'y', (input) => clampToBackground(Number(input.value) || 0), soleLabel);
    const pointerButtons = document.querySelectorAll('[data-pointer]');
    for (const button of pointerButtons) {
      button.addEventListener('click', () => {
        recordUndo();
        soleLabel().pointer = button.dataset.pointer || null;
        button.blur();
        draw();
      });
    }
    const fillVisibleField = document.getElementById('fill-visible-field');
    const fillColorField = document.getElementById('fill-color-field');
    const fillVisibleToggle = document.getElementById('fill-visible');
    fillVisibleToggle.addEventListener('change', () => {
      recordUndo();
      selectedFill().visible = fillVisibleToggle.checked;
      fillVisibleToggle.blur();
      draw();
    });

    const pathVisibleField = document.getElementById('path-visible-field');
    const pathVisibleToggle = document.getElementById('path-visible');
    pathVisibleToggle.addEventListener('change', () => {
      recordUndo();
      selected.group.visible = pathVisibleToggle.checked;
      pathVisibleToggle.blur();
      draw();
    });

    // Asks whether to add intersection nodes where a newly drawn segment
    // crosses others. The dialog sits beside the crossing and follows it as
    // the view pans and zooms.
    const crossingDialog = document.getElementById('crossing-dialog');
    let pendingCrossing = null; // { segment, anchor }

    function askAboutCrossings(segment, anchor) {
      pendingCrossing = { segment, anchor };
    }

    function closeCrossingDialog() {
      pendingCrossing = null;
      crossingDialog.hidden = true;
    }

    function placeCrossingDialog() {
      // Undo or a deletion may have taken the segment away.
      if (pendingCrossing && !pathOf(pendingCrossing.segment)) pendingCrossing = null;
      crossingDialog.hidden = !pendingCrossing;
      if (!pendingCrossing) return;
      const { anchor } = pendingCrossing;
      crossingDialog.style.left = `${anchor.x * view.scale + view.x + 12}px`;
      crossingDialog.style.top = `${anchor.y * view.scale + view.y + 12}px`;
    }

    document.getElementById('crossing-yes').addEventListener('click', () => {
      recordUndo();
      addCrossingNodes(pendingCrossing.segment);
      closeCrossingDialog();
      document.activeElement.blur();
      draw();
      updateCursor();
    });
    document.getElementById('crossing-no').addEventListener('click', () => {
      closeCrossingDialog();
      draw();
    });

    const deleteBendButton = document.getElementById('delete-bend');
    deleteBendButton.addEventListener('click', () => {
      recordUndo();
      for (const { segment } of selectionItems()) {
        if (segment) segment.length = 2;
      }
      draw();
    });

    const fillAreaField = document.getElementById('fill-area-field');
    const fillAreaToggle = document.getElementById('fill-area');
    fillAreaToggle.addEventListener('change', () => {
      const index = fills.findIndex((fill) => samePoints(fill, selected.area));
      recordUndo();
      if (fillAreaToggle.checked && index === -1) fills.push(Object.assign(new Set(selected.area), { visible: false, color: '#000000' }));
      if (!fillAreaToggle.checked && index !== -1) fills.splice(index, 1);
      // Hand focus back so keyboard shortcuts keep working.
      fillAreaToggle.blur();
      draw();
    });

    const intersectionField = document.getElementById('intersection-field');
    const intersectionToggle = document.getElementById('intersection');
    const selectedPointsList = () => selectionItems().map((item) => item.point).filter(Boolean);
    intersectionToggle.addEventListener('change', () => {
      recordUndo();
      for (const point of selectedPointsList()) point.intersection = intersectionToggle.checked;
      intersectionToggle.blur();
      draw();
    });

    // Runs after every draw, which follows every change to the selection.
    function updatePanel() {
      placeCrossingDialog();
      const selectedSegments = selectionItems().filter((item) => item.segment);
      createPathButton.hidden = !!selected?.group || selectedSegments.length === 0;
      destroyPathButton.hidden = !selected?.group;
      pathVisibleField.hidden = !selected?.group;
      pathVisibleToggle.checked = !!selected?.group?.visible;
      pathWidthFields.hidden = !selected?.group?.visible;
      if (selected?.group) {
        pathWidthInput.value = selected.group.width;
        pathWidthOutput.value = `${selected.group.width}px`;
        showColor(pathWidthColor, selected.group.widthColor);
      }
      const points = selectedPointsList();
      intersectionField.hidden = points.length === 0;
      intersectionToggle.checked = points.length > 0 && points.every((point) => point.intersection);
      deleteBendButton.hidden = selectedSegments.length === 0;
      deleteBendButton.disabled = !selectedSegments.some((item) => item.segment[2]);
      fillAreaField.hidden = !selected?.area;
      fillAreaToggle.checked = !!selected?.area && fills.some((fill) => samePoints(fill, selected.area));
      const fill = selectedFill();
      fillVisibleField.hidden = !fill;
      fillVisibleToggle.checked = !!fill?.visible;
      fillColorField.hidden = !fill?.visible;
      if (fill) showColor(fillColorInput, fill.color);
      const anyLabels = selectedLabels.length > 0;
      labelProperties.hidden = !anyLabels;
      labelStylesSection.hidden = anyLabels;
      // Selecting a label swaps the style list and form for its properties.
      if (anyLabels && editingStyle) closeStyleForm();
      if (anyLabels) {
        const text = selectedLabels[0].text;
        const key = JSON.stringify([text, labelStyles, loadedFontCount, labelStylePicker.clientWidth]);
        if (key !== stylePickerKey) {
          stylePickerKey = key;
          renderStylePicker(text);
        }
        // Mixed styles leave the picker blank.
        const styleIds = new Set(selectedLabels.map((label) => styleOf(label).id));
        for (const pick of labelStylePicker.querySelectorAll('input')) {
          pick.checked = styleIds.size === 1 && styleIds.has(Number(pick.value));
        }
      }
      const selectedLabel = soleLabel();
      document.getElementById('label-single-fields').hidden = !selectedLabel;
      if (selectedLabel) {
        // Leave a field alone while it's being typed in.
        const show = (input, value) => { if (document.activeElement !== input) input.value = value; };
        show(labelTextInput, selectedLabel.text);
        show(labelXInput, Math.round(selectedLabel.x));
        show(labelYInput, Math.round(selectedLabel.y));
        for (const button of pointerButtons) {
          button.setAttribute('aria-pressed', button.dataset.pointer === (selectedLabel.pointer ?? ''));
        }
      }
    }

    function strokeGroupWidth(group) {
      ctx.save();
      ctx.strokeStyle = group.widthColor;
      ctx.lineWidth = group.width;
      ctx.lineCap = ctx.lineJoin = 'round';
      ctx.beginPath();
      group.segments.forEach(traceSegment);
      ctx.stroke();
      ctx.restore();
    }

    // Text labels on the map, at background-pixel positions. Every display
    // property comes from the label's style; sizes are in background pixels
    // too, so labels scale with the map.
    const labels = []; // { x, y, text, styleId }
    // { id, name, font, weight, size, lineHeight, caps, color, outline,
    // outlineWidth, shadow, paddingY, paddingX, background, radius }; lineHeight
    // is how far apart a label's lines stack, as a multiple of size, and caps
    // shows the text in capitals without changing what was typed. outlineWidth
    // is how thick the outline looks. outline, shadow and
    // background are null when off. The first style is the default and can't
    // be deleted.
    const NEW_STYLE = { font: 'Roboto', weight: 400, size: 24, lineHeight: 1.2, caps: false, color: '#000000', outline: null, outlineWidth: 2, shadow: null, paddingY: 0, paddingX: 0, background: null, radius: 0 };
    const labelStyles = [
      { id: 1, name: 'Default', ...NEW_STYLE },
      { ...NEW_STYLE, id: 2, name: 'Pill', font: 'National Park', weight: 600, caps: true, paddingY: 8, paddingX: 16, background: '#f5be41', radius: 20 },
    ];
    let nextStyleId = 3;
    // The style new labels are created in, picked in the style list.
    let currentStyleId = 1;
    const currentStyle = () => labelStyles.find((style) => style.id === currentStyleId) ?? labelStyles[0];
    const styleOf = (label) => labelStyles.find((style) => style.id === label.styleId) ?? labelStyles[0];
    const fontOf = (style) => `${style.weight} ${style.size}px "${style.font}", sans-serif`;

    // Fetches a Google font at a weight the first time a style uses it, and
    // redraws once it can be drawn. Google refuses a weight the family doesn't
    // have, so its regular style is fetched too for the browser to fall back on.
    const requestedFonts = new Set();
    function loadFont(font, weight) {
      for (const w of [400, weight]) {
        const key = `${font}:${w}`;
        if (requestedFonts.has(key)) continue;
        requestedFonts.add(key);
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@${w}&display=swap`;
        document.head.append(link);
        link.addEventListener('load', () => document.fonts.load(`${w} 16px "${font}"`).then(() => {
          loadedFontCount++;
          draw();
        }));
      }
    }

    const labelInput = document.getElementById('label-input');
    // A label being typed: { x, y } for a new one, or { x, y, label } when
    // editing an existing label in place.
    let editingLabel = null;

    function startLabel(p, label = null) {
      finishLabel(true);
      editingLabel = { x: p.x, y: p.y, label };
      labelInput.value = label?.text ?? '';
      labelInput.hidden = false;
      placeLabelInput();
      labelInput.focus();
    }

    function finishLabel(keep) {
      if (!editingLabel) return;
      const text = labelInput.value.trim();
      const { label } = editingLabel;
      let created = null;
      if (label && keep && text !== label.text) {
        // Clearing an existing label's text deletes it.
        recordUndo();
        if (text) label.text = text;
        else labels.splice(labels.indexOf(label), 1);
        selectedLabels = selectedLabels.filter((other) => labels.includes(other));
      } else if (!label && keep && text) {
        recordUndo();
        created = { x: editingLabel.x, y: editingLabel.y, text, styleId: currentStyle().id, pins: [] };
        labels.push(created);
      }
      editingLabel = null;
      labelInput.hidden = true;
      draw();
      return created;
    }

    // The text box is invisible and only gathers typing; it sits on the
    // label's spot so the browser's input method popups appear there.
    function placeLabelInput() {
      if (!editingLabel) return;
      labelInput.style.left = `${editingLabel.x * view.scale + view.x}px`;
      labelInput.style.top = `${editingLabel.y * view.scale + view.y}px`;
    }

      const inset = style.background ? Math.min(style.radius, box.w / 2, box.h / 2) : 0;

        if (d <= reach && (!best || d < best.d)) best = { x, d, guide: { origin: n, dx, dy } };

      if (!best) return { q: locked, guides };
      guides.push(best.guide);
      return { q: { x: best.x.x * view.scale + view.x, y: best.x.y * view.scale + view.y }, guides };

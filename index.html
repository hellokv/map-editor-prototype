<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map Editor Prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0&icon_names=add_circle,arrow_selector_tool,delete,image,route">
  <style>
    /* Without this, any display rule on an element overrides its hidden attribute. */
    [hidden] {
      display: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
    }
    .material-symbols-rounded {
      font-variation-settings: 'wght' 300;
    }
    #canvas-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #mode-menu {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #mode-menu button {
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    #mode-menu button[aria-pressed="true"] {
      background: #ddd;
    }
    #mode-menu hr {
      margin: 2px 4px;
      border: none;
      border-top: 1px solid #ddd;
    }
    #panel {
      flex: none;
      width: 300px;
      padding: 8px;
      box-sizing: border-box;
    }
    #image-preview {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #image-preview img {
      min-width: 0;
      max-width: 100%;
    }
    #image-delete {
      flex: none;
      display: flex;
      padding: 0;
    }
    .field {
      display: block;
    }
    * + .field {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
    <div id="mode-menu">
      <button type="button" data-mode="path" aria-label="Path editing mode" aria-pressed="true">
        <span class="material-symbols-rounded">route</span>
      </button>
      <button type="button" data-mode="background" aria-label="Background mode" aria-pressed="false">
        <span class="material-symbols-rounded">image</span>
      </button>
      <div id="path-tools">
        <hr>
        <button type="button" data-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-tool="add" aria-label="Add path" aria-pressed="false">
          <span class="material-symbols-rounded">add_circle</span>
        </button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="path-panel">
      <label class="field">
        Snap distance
        <input id="snap-distance" type="range" min="0" max="50" value="15">
        <output for="snap-distance"></output>
      </label>
      <label class="field">
        Segment hover distance
        <input id="segment-distance" type="range" min="1" max="50" value="10">
        <output for="segment-distance"></output>
      </label>
      <label class="field">
        Nudge amount
        <input id="nudge-amount" type="range" min="1" max="20" value="1">
        <output for="nudge-amount"></output>
      </label>
      <label class="field">
        Path color
        <input id="path-color" type="color" value="#ffbf17">
      </label>
      <label id="intersection-field" class="field" hidden>
        <input id="intersection" type="checkbox">
        Intersection
      </label>
      <button id="delete-bend" class="field" type="button" hidden>Delete bend</button>
      <label id="fill-area-field" class="field" hidden>
        <input id="fill-area" type="checkbox">
        Fill area
      </label>
    </div>
    <div id="background-panel" hidden>
      <input id="image-upload" type="file" accept="image/*">
      <div id="image-preview" hidden>
        <img alt="Background image">
        <button id="image-delete" type="button" aria-label="Delete image">
          <span class="material-symbols-rounded">delete</span>
        </button>
      </div>
      <label class="field">
        Background color
        <input id="canvas-color" type="color" value="#7b8365">
      </label>
    </div>
  </div>
  <script>
    const modeButtons = document.querySelectorAll('#mode-menu [data-mode]');
    const modePanels = {
      path: document.getElementById('path-panel'),
      background: document.getElementById('background-panel'),
    };
    const pathTools = document.getElementById('path-tools');
    const toolButtons = document.querySelectorAll('#path-tools [data-tool]');
    let tool = 'select';

    function setTool(name) {
      tool = name;
      for (const button of toolButtons) {
        button.setAttribute('aria-pressed', button.dataset.tool === name);
      }
      updateCursor();
      draw();
    }

    function setMode(mode) {
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', button.dataset.mode === mode);
      }
      for (const [name, panel] of Object.entries(modePanels)) {
        panel.hidden = name !== mode;
      }
      pathTools.hidden = mode !== 'path';
      if (mode !== 'path') selected = null;
      setTool('select');
    }

    for (const button of modeButtons) {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    }
    for (const button of toolButtons) {
      button.addEventListener('click', () => setTool(button.dataset.tool));
    }

    // A path is a set of points joined by segments. A segment is [a, b] or
    // [a, b, control]: its ends are the point objects themselves, so moving a
    // point moves its segments, and a control point bends it into a curve.
    const paths = [];
    // { path, point }, { path, segment }, { path, area: Set of its points }, or
    // { items: [...] } for two or more dots and segments.
    let selected = null;

    const selectionItems = () => selected?.items ?? (selected?.point || selected?.segment ? [selected] : []);

    function setSelectionItems(items) {
      selected = items.length === 0 ? null : items.length === 1 ? items[0] : { items };
    }

    // Every point a move of the selection carries: selected dots and the ends
    // of selected segments.
    const movingPoints = () =>
      new Set(selectionItems().flatMap((item) => (item.point ? [item.point] : item.segment.slice(0, 2))));

    const sameItem = (a, b) => (a.point ? a.point === b.point : a.segment === b.segment);

    function toggleInSelection(item) {
      const items = selectionItems();
      const kept = items.filter((other) => !sameItem(other, item));
      setSelectionItems(kept.length === items.length ? [...items, item] : kept);
    }
    const DOT_RADIUS = 5;
    const SELECTED_DOT_RADIUS = 7;
    // Bending near an end would swing the control point wildly, so the grab
    // point stays this far (as a fraction of the segment) from either end.
    const BEND_END_MARGIN = 0.1;

    function pixelSlider(id) {
      const input = document.getElementById(id);
      const output = document.querySelector(`output[for="${id}"]`);
      const show = () => { output.value = `${input.value}px`; };
      show();
      input.addEventListener('input', show);
      return input;
    }
    const snapInput = pixelSlider('snap-distance');
    const segmentDistanceInput = pixelSlider('segment-distance');
    const nudgeInput = pixelSlider('nudge-amount');
    const SHIFT_NUDGE_FACTOR = 10;
    const NUDGE_DIRECTIONS = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
    };
    const pathColor = document.getElementById('path-color');
    pathColor.addEventListener('input', () => draw());

    // Distances are in screen pixels so they feel the same at any zoom.
    function nearestPoint(sx, sy, maxDistance, exclude) {
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const point of path.points) {
          if (point === exclude) continue;
          const d = Math.hypot(point.x * view.scale + view.x - sx, point.y * view.scale + view.y - sy);
          if (d <= bestDistance) {
            best = { path, point };
            bestDistance = d;
          }
        }
      }
      return best;
    }

    function pointAt(sx, sy) {
      return nearestPoint(sx, sy, SELECTED_DOT_RADIUS);
    }

    const lerp = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });

    function segmentPoint([a, b, c], t) {
      return c ? lerp(lerp(a, c, t), lerp(c, b, t), t) : lerp(a, b, t);
    }

    // The closest spot on a segment to p, all in background coordinates.
    // Curves are approximated by short straight pieces.
    function closestOnSegment(segment, p) {
      const steps = segment[2] ? 32 : 1;
      let best = null;
      for (let i = 0; i < steps; i++) {
        const a = segmentPoint(segment, i / steps);
        const b = segmentPoint(segment, (i + 1) / steps);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSq = dx * dx + dy * dy;
        const u = lengthSq === 0 ? 0 : Math.min(1, Math.max(0, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSq));
        const q = lerp(a, b, u);
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (!best || d < best.distance) best = { point: q, t: (i + u) / steps, distance: d };
      }
      return best;
    }

    // The segment nearest screen point s within the hover distance, and t,
    // where along it the nearest spot is.
    function segmentHit(sx, sy, maxDistance = Number(segmentDistanceInput.value), skip = () => false) {
      const p = toBackground(sx, sy);
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const segment of path.segments) {
          if (skip(segment)) continue;
          const { t, distance } = closestOnSegment(segment, p);
          if (distance * view.scale <= bestDistance) {
            best = { path, segment, t };
            bestDistance = distance * view.scale;
          }
        }
      }
      return best;
    }

    function segmentAt(sx, sy) {
      const hit = segmentHit(sx, sy);
      return hit && { path: hit.path, segment: hit.segment };
    }

    const bendT = (t) => Math.min(1 - BEND_END_MARGIN, Math.max(BEND_END_MARGIN, t));

    // Choose the control point so the curve passes through m at t.
    function bendSegment(segment, t, m) {
      const [a, b] = segment;
      const u = 1 - t;
      const k = 2 * t * u;
      segment[2] = {
        x: (m.x - u * u * a.x - t * t * b.x) / k,
        y: (m.y - u * u * a.y - t * t * b.y) / k,
      };
    }

    // Splits a segment at t with a new point, keeping any bend's shape.
    function splitSegment(path, segment, t) {
      const [a, b, c] = segment;
      const point = segmentPoint(segment, t);
      path.points.push(point);
      const halves = c
        ? [[a, point, lerp(a, c, t)], [point, b, lerp(c, b, t)]]
        : [[a, point], [point, b]];
      path.segments.splice(path.segments.indexOf(segment), 1, ...halves);
      for (const fill of fills) {
        if (fill.has(a) && fill.has(b)) fill.add(point);
      }
      return point;
    }

    function insertOnSegment({ t }) {
      const { path, segment } = selected;
      selected = { path, point: splitSegment(path, segment, t) };
    }

    // An area is a bounded face of a path: the smallest loop of segments
    // around a spot. Fills are remembered by the set of points on the loop,
    // so they survive moving and bending.
    const fills = [];

    // Points along a segment walked from one end, without the far end.
    function sampleEdge({ from, segment }) {
      const steps = segment[2] ? 16 : 1;
      const forward = segment[0] === from;
      const points = [];
      for (let i = 0; i < steps; i++) points.push(segmentPoint(segment, forward ? i / steps : 1 - i / steps));
      return points;
    }

    function computeAreas() {
      const areas = [];
      for (const path of paths) {
        const out = new Map();
        const addEdge = (from, to, segment, toward) => {
          if (!out.has(from)) out.set(from, []);
          out.get(from).push({ from, to, segment, angle: Math.atan2(toward.y - from.y, toward.x - from.x) });
        };
        for (const segment of path.segments) {
          const [a, b, c] = segment;
          addEdge(a, b, segment, c ?? b);
          addEdge(b, a, segment, c ?? a);
        }
        for (const edges of out.values()) edges.sort((p, q) => p.angle - q.angle);

        // Walk each face by always taking the next edge clockwise at every
        // point. Bounded faces come out with positive area, the outer one negative.
        const seen = new Set();
        for (const edges of out.values()) {
          for (const start of edges) {
            if (seen.has(start)) continue;
            const loop = [];
            let edge = start;
            do {
              seen.add(edge);
              loop.push(edge);
              const next = out.get(edge.to);
              const back = next.findIndex((e) => e.segment === edge.segment && e.to === edge.from);
              edge = next[(back - 1 + next.length) % next.length];
            } while (edge !== start);
            const polygon = loop.flatMap(sampleEdge);
            let area = 0;
            for (let i = 0; i < polygon.length; i++) {
              const p = polygon[i];
              const q = polygon[(i + 1) % polygon.length];
              area += p.x * q.y - q.x * p.y;
            }
            if (area > 1e-6) {
              areas.push({ path, loop, polygon, area: area / 2, points: new Set(loop.map((e) => e.from)) });
            }
          }
        }
      }
      return areas;
    }

    const samePoints = (s, t) => s.size === t.size && [...s].every((p) => t.has(p));
    const isFilled = (area) => fills.some((fill) => samePoints(fill, area.points));

    function insidePolygon(polygon, p) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if ((a.y > p.y) !== (b.y > p.y) && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) {
          inside = !inside;
        }
      }
      return inside;
    }

    function areaAt(areas, sx, sy) {
      const p = toBackground(sx, sy);
      let best = null;
      for (const area of areas) {
        if (insidePolygon(area.polygon, p) && (!best || area.area < best.area)) best = area;
      }
      return best;
    }

    function addPoint(point) {
      if (selected?.point) {
        selected.path.points.push(point);
        selected.path.segments.push([selected.point, point]);
        selected = { path: selected.path, point };
      } else {
        const path = { points: [point], segments: [] };
        paths.push(path);
        selected = { path, point };
      }
    }

    function connectTo(target) {
      const path = selected.path;
      const from = selected.point;
      const to = target.point;
      if (target.path !== path) {
        path.points.push(...target.path.points);
        path.segments.push(...target.path.segments);
        paths.splice(paths.indexOf(target.path), 1);
      }
      const exists = path.segments.some(([a, b]) => (a === from && b === to) || (a === to && b === from));
      if (!exists) path.segments.push([from, to]);
      selected = { path, point: to };
    }

    // An item may already be gone when an earlier deletion in the same
    // selection took it along, as an orphaned end or a dot's segment.
    function deleteItem({ path, point, segment }) {
      if (!paths.includes(path)) return;
      if (segment) {
        if (!path.segments.includes(segment)) return;
        path.segments.splice(path.segments.indexOf(segment), 1);
        for (const end of segment.slice(0, 2)) {
          if (!path.segments.some(([a, b]) => a === end || b === end)) {
            path.points.splice(path.points.indexOf(end), 1);
          }
        }
      } else {
        if (!path.points.includes(point)) return;
        path.points.splice(path.points.indexOf(point), 1);
        path.segments = path.segments.filter(([a, b]) => a !== point && b !== point);
      }
      if (path.points.length === 0) paths.splice(paths.indexOf(path), 1);
    }

    function deleteSelected() {
      for (const item of selectionItems()) deleteItem(item);
      selected = null;
    }

    // One step of undo: a copy of the paths, fills and selection taken just
    // before the last edit. Copies of points replace the originals everywhere
    // so segments, fills and the selection still share them.
    let undoState = null;

    function snapshot() {
      const copies = new Map();
      const copy = (p) => {
        if (!copies.has(p)) copies.set(p, { ...p });
        return copies.get(p);
      };
      const copiedPaths = paths.map((path) => ({
        points: path.points.map(copy),
        segments: path.segments.map(([a, b, c]) => (c ? [copy(a), copy(b), { ...c }] : [copy(a), copy(b)])),
      }));
      const copyItem = ({ path, point, segment }) => ({
        pathIndex: paths.indexOf(path),
        point: point && copy(point),
        segmentIndex: segment && path.segments.indexOf(segment),
      });
      let copiedSelection = { items: selectionItems().map(copyItem) };
      if (selected?.area) copiedSelection = { pathIndex: paths.indexOf(selected.path), area: new Set([...selected.area].map(copy)) };
      return {
        paths: copiedPaths,
        fills: fills.map((fill) => new Set([...fill].filter((p) => copies.has(p)).map(copy))),
        selection: copiedSelection,
      };
    }

    function recordUndo(state = snapshot()) {
      undoState = state;
    }

    function undo() {
      if (!undoState) return;
      const { paths: restoredPaths, fills: restoredFills, selection } = undoState;
      undoState = null;
      paths.splice(0, paths.length, ...restoredPaths);
      fills.splice(0, fills.length, ...restoredFills);
      if (selection.area) {
        selected = { path: restoredPaths[selection.pathIndex], area: selection.area };
      } else {
        setSelectionItems(selection.items.map(({ pathIndex, point, segmentIndex }) => {
          const path = restoredPaths[pathIndex];
          return point ? { path, point } : { path, segment: path.segments[segmentIndex] };
        }));
      }
      drag = null;
      draw();
      updateCursor();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input[type="text"], textarea')) return;
      if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (pathTools.hidden || e.target.closest('input')) return;
      const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
      if (plain && e.key === '1') setTool('select');
      if (plain && e.key === '2') setTool('add');
      const nudge = NUDGE_DIRECTIONS[e.key];
      if (nudge && selectionItems().length) {
        e.preventDefault();
        // Background pixels, so a nudge is the same distance on the map at any zoom.
        const step = Number(nudgeInput.value) * (e.shiftKey ? SHIFT_NUDGE_FACTOR : 1);
        recordUndo();
        moveSelection(nudge[0] * step, nudge[1] * step);
        draw();
        updateCursor();
      }
      // Mac keyboards label Backspace "delete".
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectionItems().length) {
        e.preventDefault();
        recordUndo();
        deleteSelected();
        draw();
        updateCursor();
      } else if (e.key === 'Escape') {
        // An embedding page may otherwise take Esc as a cue to move focus out
        // of this frame, and then the next Esc never arrives here.
        e.preventDefault();
        // A first Esc clears the selection; with nothing selected it returns to the cursor tool.
        if (!selected) setTool('select');
        selected = null;
        draw();
        updateCursor();
      }
    });

    const BACKGROUND = 1500;
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 20;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const canvasColor = document.getElementById('canvas-color');
    canvasColor.addEventListener('input', () => draw());

    const view = { scale: 1, x: 0, y: 0 };
    let size = null;

    function centerBackground(w, h) {
      view.scale = Math.min(w, h) / BACKGROUND * 0.9;
      view.x = (w - BACKGROUND * view.scale) / 2;
      view.y = (h - BACKGROUND * view.scale) / 2;
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      // The canvas can still be settling into its final size after load, so
      // centre on the first real size and keep the view centred through resizes.
      if (size === null) {
        centerBackground(w, h);
      } else {
        view.x += (w - size.w) / 2;
        view.y += (h - size.h) / 2;
      }
      size = { w, h };
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      draw();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = canvasColor.value;
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);
      if (backgroundImage) {
        // Cover the background, centred, and draw the overflow too.
        const s = Math.max(BACKGROUND / backgroundImage.naturalWidth, BACKGROUND / backgroundImage.naturalHeight);
        const w = backgroundImage.naturalWidth * s;
        const h = backgroundImage.naturalHeight * s;
        ctx.drawImage(backgroundImage, (BACKGROUND - w) / 2, (BACKGROUND - h) / 2, w, h);
      }
      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 1 / view.scale;
      ctx.strokeRect(0, 0, BACKGROUND, BACKGROUND);
      if (pathTools.hidden) {
        updatePanel();
        return;
      }

      // Lines and dots keep the same on-screen size at any zoom.
      const px = 1 / view.scale;
      const items = selectionItems();
      const selectedPoints = new Set(items.map((item) => item.point).filter(Boolean));
      const selectedSegments = new Set(items.map((item) => item.segment).filter(Boolean));
      const color = pathColor.value;
      const shadow = () => {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4 * dpr;
        ctx.shadowOffsetY = 1 * dpr;
      };

      const areas = computeAreas();
      if (selected?.area && !areas.some((area) => samePoints(area.points, selected.area))) selected = null;
      const fillArea = (area) => {
        ctx.beginPath();
        area.polygon.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.closePath();
        ctx.fill();
      };
      ctx.fillStyle = color;
      ctx.save();
      ctx.globalAlpha = 0.8;
      for (const area of areas) {
        if (isFilled(area)) fillArea(area);
      }
      ctx.restore();
      const hoveredArea = hoveredAreaIn(areas);
      if (hoveredArea && !isFilled(hoveredArea)) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        fillArea(hoveredArea);
        ctx.restore();
      }

      const selectedArea = selected?.area && areas.find((area) => samePoints(area.points, selected.area));
      if (selectedArea) {
        ctx.save();
        ctx.lineCap = ctx.lineJoin = 'round';
        shadow();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 7 * px;
        ctx.beginPath();
        for (const edge of selectedArea.loop) traceSegment(edge.segment);
        ctx.stroke();
        ctx.restore();
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * px;
      ctx.beginPath();
      for (const path of paths) {
        for (const segment of path.segments) {
          if (!selectedSegments.has(segment)) traceSegment(segment);
        }
      }
      ctx.stroke();

      if (selectedSegments.size) {
        ctx.save();
        ctx.lineCap = 'round';
        shadow();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 7 * px;
        ctx.beginPath();
        for (const segment of selectedSegments) traceSegment(segment);
        ctx.stroke();
        ctx.restore();
        ctx.lineWidth = 3 * px;
        ctx.stroke();
      }

      const target = addTarget();
      const lineEnd = target?.connect?.point ?? target?.split?.point ?? target?.add;
      if (selected?.point && lineEnd) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2 * px;
        ctx.setLineDash([6 * px, 4 * px]);
        ctx.beginPath();
        ctx.moveTo(selected.point.x, selected.point.y);
        ctx.lineTo(lineEnd.x, lineEnd.y);
        ctx.stroke();
        ctx.restore();
      }

      const guides = drag?.guides ?? target?.guides;
      if (guides?.length) {
        const length = 4 * BACKGROUND;
        ctx.save();
        ctx.strokeStyle = 'red';
        ctx.lineWidth = px;
        ctx.beginPath();
        for (const { origin, dx, dy } of guides) {
          ctx.moveTo(origin.x - dx * length, origin.y - dy * length);
          ctx.lineTo(origin.x + dx * length, origin.y + dy * length);
        }
        ctx.stroke();
        ctx.restore();
      }

      const hovered = hoveredPoint(target);
      ctx.fillStyle = color;
      for (const path of paths) {
        for (const point of path.points) {
          if (selectedPoints.has(point) || point === hovered) continue;
          ctx.beginPath();
          ctx.arc(point.x, point.y, DOT_RADIUS * px, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const emphasise = (point, outlineAlpha) => {
        ctx.save();
        shadow();
        ctx.beginPath();
        ctx.arc(point.x, point.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = `rgba(255, 255, 255, ${outlineAlpha})`;
        ctx.lineWidth = 2 * px;
        ctx.stroke();
      };
      if (hovered) emphasise(hovered, 0.7);
      for (const point of selectedPoints) emphasise(point, 1);

      const ghost = target?.insert?.point ?? target?.split?.point ?? bendGhost();
      if (ghost) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (drag?.marquee && drag.active) {
        const box = marqueeBox();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(box.x, box.y, box.w, box.h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w, box.h);
      }
      updatePanel();
    }

    const deleteBendButton = document.getElementById('delete-bend');
    deleteBendButton.addEventListener('click', () => {
      recordUndo();
      selected.segment.length = 2;
      draw();
    });

    const fillAreaField = document.getElementById('fill-area-field');
    const fillAreaToggle = document.getElementById('fill-area');
    fillAreaToggle.addEventListener('change', () => {
      const index = fills.findIndex((fill) => samePoints(fill, selected.area));
      recordUndo();
      if (fillAreaToggle.checked && index === -1) fills.push(new Set(selected.area));
      if (!fillAreaToggle.checked && index !== -1) fills.splice(index, 1);
      // Hand focus back so keyboard shortcuts keep working.
      fillAreaToggle.blur();
      draw();
    });

    const intersectionField = document.getElementById('intersection-field');
    const intersectionToggle = document.getElementById('intersection');
    const selectedPointsList = () => selectionItems().map((item) => item.point).filter(Boolean);
    intersectionToggle.addEventListener('change', () => {
      recordUndo();
      for (const point of selectedPointsList()) point.intersection = intersectionToggle.checked;
      intersectionToggle.blur();
      draw();
    });

    // Runs after every draw, which follows every change to the selection.
    function updatePanel() {
      const points = selectedPointsList();
      intersectionField.hidden = points.length === 0;
      intersectionToggle.checked = points.length > 0 && points.every((point) => point.intersection);
      deleteBendButton.hidden = !selected?.segment;
      deleteBendButton.disabled = !selected?.segment?.[2];
      fillAreaField.hidden = !selected?.area;
      fillAreaToggle.checked = !!selected?.area && fills.some((fill) => samePoints(fill, selected.area));
    }

    function traceSegment([a, b, c]) {
      ctx.moveTo(a.x, a.y);
      if (c) ctx.quadraticCurveTo(c.x, c.y, b.x, b.y);
      else ctx.lineTo(b.x, b.y);
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * Math.exp(-e.deltaY * 0.001)));
      // Keep the point under the cursor fixed while zooming.
      view.x = mx - (mx - view.x) * (next / view.scale);
      view.y = my - (my - view.y) * (next / view.scale);
      view.scale = next;
      draw();
      updateCursor();
    }, { passive: false });

    function toBackground(sx, sy) {
      return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale };
    }

    function inBackground(p) {
      return p.x >= 0 && p.x <= BACKGROUND && p.y >= 0 && p.y <= BACKGROUND;
    }

    function clampToBackground(v) {
      return Math.min(BACKGROUND, Math.max(0, v));
    }

    let addCursor = 'crosshair';
    document.fonts.load('300 24px "Material Symbols Rounded"', 'add_circle').then(() => {
      const icon = document.createElement('canvas');
      icon.width = icon.height = 24;
      const c = icon.getContext('2d');
      c.font = '300 24px "Material Symbols Rounded"';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      // A white halo keeps the icon visible over dark background images.
      c.strokeStyle = '#fff';
      c.lineWidth = 3;
      c.strokeText('add_circle', 12, 12);
      c.fillText('add_circle', 12, 12);
      addCursor = `url(${icon.toDataURL()}) 12 12, crosshair`;
      updateCursor();
    });

    let pointer = null;

    let shiftHeld = false;
    const trackShift = (e) => {
      if (e.key !== 'Shift' || shiftHeld === (e.type === 'keydown')) return;
      shiftHeld = e.type === 'keydown';
      draw();
      updateCursor();
    };
    document.addEventListener('keydown', trackShift);
    document.addEventListener('keyup', trackShift);
    window.addEventListener('blur', () => { shiftHeld = false; });

    // Moves screen point s onto the nearest of the 8 rays (every 45°) out of
    // the given point, keeping how far along that ray it reaches.
    function lockAngle(from, s) {
      const ox = from.x * view.scale + view.x;
      const oy = from.y * view.scale + view.y;
      const angle = Math.round(Math.atan2(s.y - oy, s.x - ox) / (Math.PI / 4)) * (Math.PI / 4);
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const reach = Math.max(0, (s.x - ox) * dx + (s.y - oy) * dy);
      return { x: ox + dx * reach, y: oy + dy * reach, dx, dy };
    }

    // Shift while drawing: lock to 45° steps from the point being drawn from,
    // then, within snap distance, slide along that ray to where it crosses a
    // 45° line through the point nearest the cursor. Returns the screen point
    // and the guide lines used.
    function shiftSnapFrom(from, s) {
      const locked = lockAngle(from, s);
      const guides = [{ origin: from, dx: locked.dx, dy: locked.dy }];
      const nearest = nearestPoint(s.x, s.y, Infinity, from);
      if (!nearest) return { q: locked, guides };
      const p = toBackground(locked.x, locked.y);
      const n = nearest.point;
      const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS) / view.scale;
      let best = null;
      for (let k = 0; k < 4; k++) {
        const dx = Math.cos((k * Math.PI) / 4);
        const dy = Math.sin((k * Math.PI) / 4);
        const denom = locked.dx * dy - locked.dy * dx;
        if (Math.abs(denom) < 1e-9) continue;
        const u = ((n.x - from.x) * dy - (n.y - from.y) * dx) / denom;
        if (u < 0) continue;
        const x = { x: from.x + locked.dx * u, y: from.y + locked.dy * u };
        const d = Math.hypot(x.x - p.x, x.y - p.y);
        if (d <= reach && (!best || d < best.d)) best = { x, d, guide: { origin: n, dx, dy } };
      }
      if (!best) return { q: locked, guides };
      guides.push(best.guide);
      return { q: { x: best.x.x * view.scale + view.x, y: best.x.y * view.scale + view.y }, guides };
    }

    // Pulls a dragged point onto lines at multiples of 45° through the points
    // it connects to, when it comes within snap distance of them. Near a
    // crossing of two such lines it goes to the crossing. Returns the guide
    // lines it snapped to, as { origin, angle }.
    function snapToNeighbourAngles(path, point, target) {
      const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS) / view.scale;
      const lines = [];
      for (const [a, b] of path.segments) {
        const origin = a === point ? b : b === point ? a : null;
        if (!origin) continue;
        let best = null;
        for (let k = 0; k < 4; k++) {
          const angle = (k * Math.PI) / 4;
          const dx = Math.cos(angle);
          const dy = Math.sin(angle);
          const offset = Math.abs((target.x - origin.x) * dy - (target.y - origin.y) * dx);
          if (offset <= reach && (!best || offset < best.offset)) best = { origin, angle, dx, dy, offset };
        }
        if (best) lines.push(best);
      }

      let crossing = null;
      for (let i = 0; i < lines.length; i++) {
        for (let j = i + 1; j < lines.length; j++) {
          const l = lines[i];
          const m = lines[j];
          const denom = l.dx * m.dy - l.dy * m.dx;
          if (Math.abs(denom) < 1e-9) continue;
          const u = ((m.origin.x - l.origin.x) * m.dy - (m.origin.y - l.origin.y) * m.dx) / denom;
          const x = { x: l.origin.x + l.dx * u, y: l.origin.y + l.dy * u };
          const d = Math.hypot(x.x - target.x, x.y - target.y);
          if (d <= reach * Math.SQRT2 && (!crossing || d < crossing.d)) crossing = { point: x, lines: [l, m], d };
        }
      }
      if (crossing) return { target: crossing.point, guides: crossing.lines };

      if (lines.length === 0) return { target, guides: [] };
      const l = lines.reduce((p, q) => (q.offset < p.offset ? q : p));
      const along = (target.x - l.origin.x) * l.dx + (target.y - l.origin.y) * l.dy;
      return { target: { x: l.origin.x + l.dx * along, y: l.origin.y + l.dy * along }, guides: [l] };
    }

    // What a click with the add tool at screen point s would do:
    // { connect: {path, point} } joins the selected point to an existing one,
    // { add: p } places a new point, { insert: {point, t} } splits the selected
    // segment, and { split: {path, segment, t, point} } splits a segment the
    // pointer snapped to. null means the click selects or deselects instead.
    function addTarget(s = pointer) {
      if (!s || drag || spaceHeld || tool !== 'add' || pathTools.hidden) return null;
      const hit = pointAt(s.x, s.y);
      const p = toBackground(s.x, s.y);
      if (selected?.point) {
        if (hit?.point === selected.point) return null;
        const { q, guides } = shiftHeld ? shiftSnapFrom(selected.point, s) : { q: s, guides: [] };
        const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS);
        const snap = nearestPoint(q.x, q.y, reach, selected.point);
        if (snap) return { connect: snap, guides };
        const from = selected.point;
        const onto = segmentHit(q.x, q.y, reach, ([a, b]) => a === from || b === from);
        if (onto) return { split: { ...onto, point: segmentPoint(onto.segment, onto.t) }, guides };
        const end = toBackground(q.x, q.y);
        return inBackground(end) ? { add: end, guides } : null;
      }
      if (hit) return null;
      if (selected?.segment) {
        const { t } = closestOnSegment(selected.segment, p);
        return { insert: { point: segmentPoint(selected.segment, t), t } };
      }
      const onto = segmentHit(s.x, s.y, Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS));
      if (onto) return { split: { ...onto, point: segmentPoint(onto.segment, onto.t) } };
      return inBackground(p) ? { add: p } : null;
    }

    // In the cursor tool, a ghost dot marks where a segment would be grabbed
    // for bending: the spot on it nearest the pointer.
    function bendGhost() {
      if (drag?.bend) return drag.bending ? segmentPoint(drag.bend, drag.t) : drag.grab;
      if (!pointer || drag || spaceHeld || tool !== 'select' || pathTools.hidden) return null;
      if (pointAt(pointer.x, pointer.y)) return null;
      const hit = segmentHit(pointer.x, pointer.y);
      if (!hit || grabbedSelectionItem(null, hit)) return null;
      return segmentPoint(hit.segment, bendT(hit.t));
    }

    function hoveredAreaIn(areas) {
      if (!pointer || drag || spaceHeld || tool !== 'select' || pathTools.hidden) return null;
      if (pointAt(pointer.x, pointer.y) || segmentHit(pointer.x, pointer.y)) return null;
      return areaAt(areas, pointer.x, pointer.y);
    }

    function hoveredPoint(target) {
      if (!pointer || drag || spaceHeld || pathTools.hidden) return null;
      if (target?.connect) return target.connect.point;
      const hit = pointAt(pointer.x, pointer.y);
      return hit && hit.point !== selected?.point ? hit.point : null;
    }

    function updateCursor() {
      if (spaceHeld || drag?.spacePan) canvas.style.cursor = drag ? 'grabbing' : 'grab';
      else canvas.style.cursor = addTarget() ? addCursor : '';
    }

    // Holding space turns every press on the canvas into a pan.
    let spaceHeld = false;
    const trackSpace = (e) => {
      if (e.code !== 'Space' || e.target.closest('input[type="text"], textarea')) return;
      // Stops the page scrolling and a focused button being pressed.
      e.preventDefault();
      const down = e.type === 'keydown';
      if (spaceHeld === down) return;
      spaceHeld = down;
      draw();
      updateCursor();
    };
    document.addEventListener('keydown', trackSpace);
    document.addEventListener('keyup', trackSpace);
    window.addEventListener('blur', () => { spaceHeld = false; });

    // Movement below this many pixels counts as a click rather than a pan.
    const CLICK_SLOP = 4;
    let drag = null;

    // With two or more things selected, pressing on one of them grabs the
    // whole selection. Returns the item pressed, or null.
    function grabbedSelectionItem(hit, handle) {
      const items = selectionItems();
      if (items.length < 2) return null;
      if (hit) return items.find((item) => item.point === hit.point) ?? null;
      if (handle) return items.find((item) => item.segment === handle.segment) ?? null;
      return null;
    }

    // Moves every selected dot and selected segment's ends together, keeping
    // the whole set inside the background. Each bend touching a moved point is
    // held relative to its segment's ends, so curves keep their shape rather
    // than being pulled toward a control point left behind.
    function moveSelection(dx, dy) {
      const moving = movingPoints();
      const xs = [...moving].map((p) => p.x);
      const ys = [...moving].map((p) => p.y);
      dx = Math.min(BACKGROUND - Math.max(...xs), Math.max(-Math.min(...xs), dx));
      dy = Math.min(BACKGROUND - Math.max(...ys), Math.max(-Math.min(...ys), dy));

      // A control point as (along, across) the segment, in units of its length.
      const bends = [];
      for (const path of paths) {
        for (const segment of path.segments) {
          const [a, b, c] = segment;
          if (!c || !(moving.has(a) || moving.has(b))) continue;
          const ex = b.x - a.x;
          const ey = b.y - a.y;
          const lengthSq = ex * ex + ey * ey;
          if (lengthSq === 0) continue;
          const cx = c.x - a.x;
          const cy = c.y - a.y;
          bends.push({ segment, along: (cx * ex + cy * ey) / lengthSq, across: (cy * ex - cx * ey) / lengthSq });
        }
      }

      for (const p of moving) {
        p.x += dx;
        p.y += dy;
      }

      for (const { segment, along, across } of bends) {
        const [a, b, c] = segment;
        const ex = b.x - a.x;
        const ey = b.y - a.y;
        c.x = a.x + along * ex - across * ey;
        c.y = a.y + along * ey + across * ex;
      }
    }

    // The marquee being dragged, in screen pixels.
    function marqueeBox() {
      const x = Math.min(drag.x0, pointer.x);
      const y = Math.min(drag.y0, pointer.y);
      return { x, y, w: Math.abs(pointer.x - drag.x0), h: Math.abs(pointer.y - drag.y0) };
    }

    // Dots inside the box, and segments lying wholly inside it.
    function itemsInBox(box) {
      const inside = (p) => {
        const sx = p.x * view.scale + view.x;
        const sy = p.y * view.scale + view.y;
        return sx >= box.x && sx <= box.x + box.w && sy >= box.y && sy <= box.y + box.h;
      };
      const items = [];
      for (const path of paths) {
        for (const point of path.points) {
          if (inside(point)) items.push({ path, point });
        }
        for (const segment of path.segments) {
          const steps = segment[2] ? 16 : 1;
          let all = true;
          for (let i = 0; i <= steps && all; i++) all = inside(segmentPoint(segment, i / steps));
          if (all) items.push({ path, segment });
        }
      }
      return items;
    }

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      const s = canvasPoint(e);
      if (spaceHeld) {
        drag = { x: e.clientX, y: e.clientY, spacePan: true };
        updateCursor();
        return;
      }
      const hit = pathTools.hidden || addTarget(s)?.connect ? null : pointAt(s.x, s.y);
      const handle = !hit && tool === 'select' && !pathTools.hidden ? segmentHit(s.x, s.y) : null;
      const p = toBackground(s.x, s.y);
      // With Shift in the cursor tool, a click adds to or removes from the
      // selection; a drag still moves or bends as usual.
      const toggling = shiftHeld && tool === 'select';
      const grabbed = !toggling && tool === 'select' && grabbedSelectionItem(hit, handle);
      if (grabbed) {
        // The snapshot only becomes the undo step once the selection actually moves.
        drag = { group: true, item: grabbed, last: p, startX: e.clientX, startY: e.clientY, before: snapshot() };
      } else if (hit) {
        if (!toggling) selected = hit;
        // The snapshot only becomes the undo step once the point actually moves.
        drag = { point: hit.point, path: hit.path, dx: hit.point.x - p.x, dy: hit.point.y - p.y, before: snapshot(), toggle: toggling && hit };
        draw();
      } else if (handle) {
        const item = { path: handle.path, segment: handle.segment };
        if (!toggling) selected = item;
        // The curve is pinned to pass through the pointer at the grabbed spot,
        // so that spot stays under the cursor for the whole drag.
        const t = bendT(handle.t);
        drag = { bend: handle.segment, t, grab: segmentPoint(handle.segment, t), startX: e.clientX, startY: e.clientY, before: snapshot(), toggle: toggling && item };
        draw();
      } else if (tool === 'select' && !pathTools.hidden) {
        drag = { marquee: true, x0: s.x, y0: s.y, startX: e.clientX, startY: e.clientY, base: toggling ? selectionItems() : [] };
      } else {
        drag = { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY };
      }
      updateCursor();
    });

    canvas.addEventListener('pointermove', (e) => {
      pointer = canvasPoint(e);
      shiftHeld = e.shiftKey;
      if (drag?.point) {
        const p = toBackground(pointer.x, pointer.y);
        let target = { x: p.x + drag.dx, y: p.y + drag.dy };
        drag.guides = [];
        if (shiftHeld) ({ target, guides: drag.guides } = snapToNeighbourAngles(drag.path, drag.point, target));
        if (drag.before) {
          recordUndo(drag.before);
          drag.before = null;
          if (drag.toggle) selected = drag.toggle;
          drag.toggle = null;
        }
        drag.point.x = clampToBackground(target.x);
        drag.point.y = clampToBackground(target.y);
      } else if (drag?.bend) {
        // Ignore jitter so a plain click doesn't bend a straight segment.
        if (drag.bending || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          if (!drag.bending) {
            recordUndo(drag.before);
            if (drag.toggle) selected = drag.toggle;
            drag.toggle = null;
          }
          drag.bending = true;
          const p = toBackground(pointer.x, pointer.y);
          bendSegment(drag.bend, drag.t, p);
        }
      } else if (drag?.group) {
        if (drag.moving || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          if (!drag.moving) recordUndo(drag.before);
          drag.moving = true;
          const p = toBackground(pointer.x, pointer.y);
          moveSelection(p.x - drag.last.x, p.y - drag.last.y);
          drag.last = p;
        }
      } else if (drag?.marquee) {
        if (drag.active || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          drag.active = true;
          const inside = itemsInBox(marqueeBox());
          setSelectionItems([...drag.base, ...inside.filter((item) => !drag.base.some((b) => sameItem(b, item)))]);
        }
      } else if (drag) {
        view.x += e.clientX - drag.x;
        view.y += e.clientY - drag.y;
        drag.x = e.clientX;
        drag.y = e.clientY;
      }
      draw();
      updateCursor();
    });

    canvas.addEventListener('pointerleave', () => {
      pointer = null;
      draw();
      updateCursor();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const { toggle, marquee, active, base, group, moving, item } = drag;
      const wasClick = !drag.point && !drag.bend && !drag.spacePan && !active && !group
        && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < CLICK_SLOP;
      drag = null;
      if (group && !moving) {
        // Clicking one member of a multi-selection without moving selects just it.
        selected = item;
      } else if (toggle) {
        toggleInSelection(toggle);
      } else if (marquee && wasClick && base.length) {
        // A Shift-click on empty space leaves the selection alone.
      } else if (wasClick && !pathTools.hidden) {
        const s = canvasPoint(e);
        const target = addTarget(s);
        if (target) recordUndo();
        if (target?.connect) {
          connectTo(target.connect);
        } else if (target?.add) {
          addPoint(target.add);
        } else if (target?.insert) {
          insertOnSegment(target.insert);
        } else if (target?.split) {
          const { path, segment, t } = target.split;
          const point = splitSegment(path, segment, t);
          if (selected?.point) connectTo({ path, point });
          else selected = { path, point };
        } else {
          const area = tool === 'select' ? areaAt(computeAreas(), s.x, s.y) : null;
          selected = segmentAt(s.x, s.y) ?? (area && { path: area.path, area: area.points });
        }
      }
      draw();
      updateCursor();
    });
    canvas.addEventListener('pointercancel', () => { drag = null; });

    const upload = document.getElementById('image-upload');
    const preview = document.getElementById('image-preview');
    const previewImg = preview.querySelector('img');
    let backgroundImage = null;

    function setBackgroundImage(src) {
      const img = new Image();
      img.onload = () => {
        backgroundImage = img;
        previewImg.src = img.src;
        upload.hidden = true;
        preview.hidden = false;
        draw();
      };
      img.src = src;
    }

    upload.addEventListener('change', () => {
      const file = upload.files[0];
      if (file) setBackgroundImage(URL.createObjectURL(file));
    });

    setBackgroundImage('demo-park.svg');

    document.getElementById('image-delete').addEventListener('click', () => {
      if (backgroundImage.src.startsWith('blob:')) URL.revokeObjectURL(backgroundImage.src);
      backgroundImage = null;
      previewImg.removeAttribute('src');
      upload.value = '';
      preview.hidden = true;
      upload.hidden = false;
      draw();
    });

    new ResizeObserver(resize).observe(canvas);
  </script>
</body>
</html>

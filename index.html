<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map Editor Prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0">
  <style>
    /* Without this, any display rule on an element overrides its hidden attribute. */
    [hidden] {
      display: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
    }
    .material-symbols-rounded {
      font-variation-settings: 'wght' 300;
    }
    #canvas-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #label-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .font-picker {
      position: relative;
      display: inline-block;
    }
    #font-options {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #ccc;
    }
    #font-options div {
      padding: 2px 6px;
      cursor: pointer;
    }
    .icon-picker {
      position: relative;
      display: inline-block;
    }
    #icon-options {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #ccc;
    }
    #icon-options div {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 6px;
      cursor: pointer;
    }
    #icon-options div[aria-selected="true"],
    #font-options div[aria-selected="true"] {
      background: #ddd;
    }
    #crossing-dialog {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      font: 13px sans-serif;
      white-space: nowrap;
    }
    #tooltip {
      position: fixed;
      z-index: 20;
      padding: 3px 8px;
      background: #333;
      color: #fff;
      border-radius: 4px;
      font: 12px system-ui, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }
    .device-size {
      color: #666;
      font-variant-numeric: tabular-nums;
    }
    #view-menu {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #view-menu button,
    #layers-close {
      display: flex;
      padding: 2px;
      border: none;
      border-radius: 4px;
      background: none;
      cursor: pointer;
    }
    #view-menu button:hover,
    #layers-close:hover {
      background: #eee;
    }
    #view-menu .percent-field input,
    .zoom-field input {
      box-sizing: border-box;
      width: 64px;
      padding: 2px 18px 2px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font: 13px system-ui, sans-serif;
      appearance: textfield;
    }
    #layers-modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.3);
    }
    #layers-modal [role="dialog"] {
      position: relative;
      padding: 28px 24px 24px;
      background: #e3e6ee;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      font: 15px system-ui, sans-serif;
      color: #2b3441;
    }
    #layers-close {
      position: absolute;
      top: 6px;
      right: 6px;
    }
    #layer-zoom-grid {
      display: grid;
      grid-template-columns: 130px 130px 130px;
      gap: 8px;
    }
    #layer-zoom-grid > div:nth-child(-n + 3) {
      font-weight: 600;
      font-size: 17px;
    }
    .layer-name {
      display: flex;
      align-items: center;
    }
    .zoom-field {
      display: flex;
      align-items: center;
      border: 2px solid #a3abb8;
      border-radius: 6px;
      background: #fff;
    }
    .zoom-field:has(input:disabled) {
      border-color: #cdd2da;
      background: #f6f7f9;
    }
    .zoom-field .percent-field {
      flex: 1;
    }
    .zoom-field input {
      width: 100%;
      padding: 8px 22px 8px 10px;
      border: none;
      background: none;
      font: inherit;
      outline: none;
    }
    .zoom-field input:disabled {
      color: #a3abb8;
    }
    .zoom-field button {
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      color: #6b7585;
      cursor: pointer;
    }
    #auto-layers {
      font: 12px system-ui, sans-serif;
      color: #666;
    }
    #view-menu select {
      padding: 2px 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font: 13px system-ui, sans-serif;
    }
    #mode-menu,
    #shape-menu {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #mode-menu button,
    #shape-menu button {
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    #mode-menu button[aria-pressed="true"],
    #shape-menu button[aria-pressed="true"] {
      background: #ddd;
    }
    #mode-menu hr {
      margin: 2px 4px;
      border: none;
      border-top: 1px solid #ddd;
    }
    #panel {
      flex: none;
      width: 300px;
      padding: 4px 8px;
      box-sizing: border-box;
      background: #f2f2f2;
      font: 13px system-ui, sans-serif;
    }
    .group {
      padding: 6px 0;
    }
    .group:not(:first-child) {
      border-top: 1px solid #ddd;
    }
    .group:not(:has(> :not([hidden]))) {
      display: none;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
    }
    .row > span:first-child {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .row.stacked {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 4px 0;
    }
    .row input[type="checkbox"],
    .row input[type="radio"] {
      margin: 0;
    }
    #panel input[type="text"],
    #panel input[type="number"],
    #panel select,
    #panel textarea {
      box-sizing: border-box;
      padding: 3px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font: inherit;
    }
    #panel textarea {
      resize: vertical;
    }
    .row input[type="text"],
    .row select {
      width: 140px;
    }
    .row input[type="number"]:not(.opacity) {
      width: 64px;
    }
    #panel .opacity {
      width: 52px;
      margin-left: 2px;
      padding: 3px 4px;
    }
    .slider {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .slider input {
      width: 110px;
      margin: 0;
    }
    .slider input[type="range"] + input[type="number"] {
      width: 60px;
    }
    .percent-field {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .percent-field::after {
      content: '%';
      position: absolute;
      right: 6px;
      color: #666;
      pointer-events: none;
    }
    #panel .percent-field input {
      width: 60px;
      padding-right: 18px;
      appearance: textfield;
    }
    /* Arrow keys still step the value; the spinner would cover the %. */
    .percent-field input::-webkit-inner-spin-button,
    .percent-field input::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }
    .slider:has(input[type="number"]) input[type="range"] {
      width: 80px;
    }
    .slider output {
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .color-field {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .color-field input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: none;
    }
    #panel button {
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    #panel button:hover {
      background: #f8f8f8;
    }
    .group > button {
      display: block;
      margin: 4px 0;
    }
    #panel #style-back,
    #panel #image-delete {
      flex: none;
      display: flex;
      padding: 2px;
      border: none;
      background: none;
    }
    #panel #style-back:hover,
    #panel #image-delete:hover {
      background: #e4e4e4;
    }
    #panel #image-delete {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
    }
    #label-pointer {
      display: grid;
      grid-template-columns: repeat(3, max-content);
      gap: 2px;
    }
    #label-pointer button {
      display: flex;
      padding: 2px;
    }
    #panel #add-pin {
      display: flex;
      padding: 2px;
    }
    #label-layers {
      display: flex;
      gap: 2px;
    }
    #panel #label-layers button {
      padding: 3px 8px;
    }
    #panel #label-layers button[aria-pressed="true"] {
      background: #ddd;
    }
    #label-icon-side {
      display: flex;
      gap: 2px;
    }
    #label-icon-side button {
      display: flex;
      padding: 2px;
    }
    #label-pointer button[aria-pressed="true"],
    #label-icon-side button[aria-pressed="true"],
    #panel #add-pin[aria-pressed="true"] {
      background: #ddd;
    }
    #image-upload {
      max-width: 100%;
      font: inherit;
    }
    /* The image sits on the background color, as it does on the map. */
    #image-preview {
      position: relative;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #image-preview img {
      display: block;
      width: 100%;
    }
    #label-style-list .row {
      justify-content: flex-start;
    }
    .style-menu {
      position: relative;
    }
    #panel .style-menu > button {
      display: flex;
      padding: 2px;
      border: none;
      background: none;
    }
    #panel .style-menu > button:hover {
      background: #e4e4e4;
    }
    .style-menu [role="menu"] {
      position: absolute;
      z-index: 1;
      right: 0;
      top: 100%;
      display: flex;
      flex-direction: column;
      min-width: 100px;
      padding: 4px 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    #panel .style-menu [role="menu"] button {
      padding: 4px 12px;
      border: none;
      border-radius: 0;
      text-align: left;
    }
    #panel .style-menu [role="menu"] button:hover {
      background: #eee;
    }
    #label-style-list .style-menu {
      margin-left: auto;
    }
    #label-style-picker .style-menu {
      margin-left: auto;
    }
    #label-style-picker label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      padding: 3px 6px;
      background: #fff;
      border-radius: 6px;
    }
    #label-style-picker label.dark {
      background: #4a4a4a;
      color: #eee;
    }
    #label-style-picker label.dark .style-option-name {
      color: #ccc;
    }
    #panel #label-style-picker label.dark .style-menu > button {
      color: #eee;
    }
    #panel #label-style-picker label.dark .style-menu > button:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .style-option-body {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
    }
    .style-option-name {
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
    <textarea id="label-input" rows="1" hidden></textarea>
    <div id="crossing-dialog" hidden>
      Add intersections?
      <button id="crossing-yes" type="button">Yes</button>
      <button id="crossing-no" type="button">No</button>
    </div>
    <div id="mode-menu">
      <button type="button" data-mode="preview" aria-label="Preview" aria-pressed="false">
        <span class="material-symbols-rounded">responsive_layout</span>
      </button>
      <button type="button" data-mode="labels" aria-label="Labels" aria-pressed="false">
        <span class="material-symbols-rounded">label</span>
      </button>
      <button type="button" data-mode="path" aria-label="Paths" aria-pressed="true">
        <span class="material-symbols-rounded">route</span>
      </button>
      <button type="button" data-mode="background" aria-label="Background" aria-pressed="false">
        <span class="material-symbols-rounded">image</span>
      </button>
      <div id="label-tools" hidden>
        <hr>
        <button type="button" data-label-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-label-tool="add" aria-label="New label" aria-pressed="false">
          <span class="material-symbols-rounded">new_label</span>
        </button>
      </div>
      <div id="background-tools" hidden>
        <hr>
        <button type="button" data-background-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-background-tool="shapes" aria-label="Shapes" aria-pressed="false">
          <span class="material-symbols-rounded">shapes</span>
        </button>
        <button type="button" data-background-tool="segments" aria-label="Segments" aria-pressed="false">
          <span class="material-symbols-rounded">polyline</span>
        </button>
      </div>
      <div id="path-tools">
        <hr>
        <button type="button" data-tool="select" aria-label="Select" aria-pressed="false">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-tool="add" aria-label="Add path" aria-pressed="true">
          <span class="material-symbols-rounded">add_circle</span>
        </button>
      </div>
    </div>
    <div id="tooltip" hidden></div>
    <div id="view-menu">
      <button id="layers-button" type="button" aria-label="Layer zoom levels"><span class="material-symbols-rounded">layers</span></button>
      <select id="layer-select" aria-label="Layer">
        <option selected>All</option>
        <option>Sky</option>
        <option>Canopy</option>
        <option>Ground</option>
        <option>Automatic</option>
      </select>
      <span id="auto-layers" hidden></span>
      <span class="percent-field"><input id="zoom-input" type="number" step="1" aria-label="Zoom"></span>
      <button id="fit-button" type="button" aria-label="Scale to fit"><span class="material-symbols-rounded">fit_screen</span></button>
    </div>
    <div id="layers-modal" hidden>
      <div role="dialog" aria-label="Layer zoom levels">
        <button id="layers-close" type="button" aria-label="Close"><span class="material-symbols-rounded">close</span></button>
        <div id="layer-zoom-grid">
          <div>Layer</div><div>Min</div><div>Max</div>
        </div>
      </div>
    </div>
    <div id="shape-menu" hidden>
      <button type="button" data-shape="circle" aria-label="Circle" aria-pressed="true">
        <span class="material-symbols-rounded">circle</span>
      </button>
      <button type="button" data-shape="square" aria-label="Square" aria-pressed="false">
        <span class="material-symbols-rounded">square</span>
      </button>
      <button type="button" data-shape="triangle" aria-label="Triangle" aria-pressed="false">
        <span class="material-symbols-rounded">change_history</span>
      </button>
      <button type="button" data-shape="polygon" aria-label="Polygon" aria-pressed="false">
        <span class="material-symbols-rounded">pentagon</span>
      </button>
    </div>
  </div>
  <div id="panel">
    <div id="labels-panel" hidden>
      <div id="label-properties" hidden>
        <div id="label-single-fields" class="group">
          <label class="row stacked">
            Text
            <textarea id="label-text" rows="2"></textarea>
          </label>
          <label id="label-hide-text-field" class="row">
            <span><input id="label-hide-text" type="checkbox"> Hide text</span>
          </label>
          <label class="row">
            X
            <input id="label-x" type="number" min="0" max="1500" step="1">
          </label>
          <label class="row">
            Y
            <input id="label-y" type="number" min="0" max="1500" step="1">
          </label>
          <div class="row">
            Pointer
            <div id="label-pointer">
              <button type="button" data-pointer="nw" aria-label="Top left"><span class="material-symbols-rounded">north_west</span></button>
              <button type="button" data-pointer="n" aria-label="Top"><span class="material-symbols-rounded">north</span></button>
              <button type="button" data-pointer="ne" aria-label="Top right"><span class="material-symbols-rounded">north_east</span></button>
              <button type="button" data-pointer="w" aria-label="Left"><span class="material-symbols-rounded">west</span></button>
              <button type="button" data-pointer="" aria-label="No pointer"><span class="material-symbols-rounded">block</span></button>
              <button type="button" data-pointer="e" aria-label="Right"><span class="material-symbols-rounded">east</span></button>
              <button type="button" data-pointer="sw" aria-label="Bottom left"><span class="material-symbols-rounded">south_west</span></button>
              <button type="button" data-pointer="s" aria-label="Bottom"><span class="material-symbols-rounded">south</span></button>
              <button type="button" data-pointer="se" aria-label="Bottom right"><span class="material-symbols-rounded">south_east</span></button>
            </div>
          </div>
          <div class="row">
            Pins
            <button id="add-pin" type="button" aria-label="Add location" aria-pressed="false">
              <span class="material-symbols-rounded">add_location</span>
            </button>
          </div>
          <label class="row">
            <span><input id="label-icon-on" type="checkbox"> Icon</span>
          </label>
          <div id="label-icon-field" class="row">
            <span id="label-icon-preview" class="material-symbols-rounded"></span>
            <span class="icon-picker">
              <input id="label-icon" type="text" autocomplete="off" placeholder="Search icons">
              <div id="icon-options" hidden></div>
            </span>
          </div>
          <div id="label-icon-side-field" class="row">
            Icon position
            <div id="label-icon-side">
              <button type="button" data-icon-side="left" aria-label="Icon left of text"><span class="material-symbols-rounded">align_horizontal_left</span></button>
              <button type="button" data-icon-side="right" aria-label="Icon right of text"><span class="material-symbols-rounded">align_horizontal_right</span></button>
              <button type="button" data-icon-side="top" aria-label="Icon above text"><span class="material-symbols-rounded">align_vertical_top</span></button>
              <button type="button" data-icon-side="bottom" aria-label="Icon below text"><span class="material-symbols-rounded">align_vertical_bottom</span></button>
            </div>
          </div>
          <label id="label-icon-outside-field" class="row">
            <span><input id="label-icon-outside" type="checkbox"> Outside label</span>
          </label>
          <label id="label-icon-offset-field" class="row">
            Icon offset
            <span class="slider"><input type="range" min="-200" max="200" step="1" value="0" aria-label="Icon offset"><span class="percent-field"><input id="label-icon-offset" type="number" step="1"></span></span>
          </label>
          <label id="label-icon-size-field" class="row">
            Icon size
            <span class="slider"><input type="range" min="4" max="120" step="1" aria-label="Icon size"><input id="label-icon-size" type="number" min="4" max="200" step="1"></span>
          </label>
          <label id="label-icon-gap-field" class="row">
            Icon gap
            <span class="slider"><input type="range" min="0" max="60" step="1" aria-label="Icon gap"><input id="label-icon-gap" type="number" min="0" max="200" step="1"></span>
          </label>
        </div>
        <div class="group">
          <div class="row">
            Layers
            <div id="label-layers">
              <button type="button" data-layer="sky" aria-pressed="false">Sky</button>
              <button type="button" data-layer="canopy" aria-pressed="false">Canopy</button>
              <button type="button" data-layer="ground" aria-pressed="false">Ground</button>
            </div>
          </div>
        </div>
        <div id="label-style-picker" class="group">
          Style
        </div>
      </div>
      <div id="label-styles">
        <div id="label-style-browser" class="group">
          <div id="label-style-list"></div>
          <button id="new-label-style" type="button">New label style</button>
        </div>
        <form id="label-style-form" hidden>
          <button id="style-back" type="button" aria-label="Back to label styles">
            <span class="material-symbols-rounded">arrow_back</span>
          </button>
          <div class="group">
            <label class="row">
              Name
              <input id="style-name" type="text" required>
            </label>
            <label class="row">
              Font
              <span class="font-picker">
                <input id="style-font" type="text" autocomplete="off" required>
                <div id="font-options" hidden></div>
              </span>
            </label>
            <label class="row">
              Font weight
              <select id="style-weight">
                <option value="100">Thin</option>
                <option value="200">Extra light</option>
                <option value="300">Light</option>
                <option value="400">Regular</option>
                <option value="500">Medium</option>
                <option value="600">Semi bold</option>
                <option value="700">Bold</option>
                <option value="800">Extra bold</option>
                <option value="900">Black</option>
              </select>
            </label>
            <label class="row">
              Font size
              <input id="style-size" type="number" min="4" max="200" step="1" required>
            </label>
            <label class="row">
              Line height
              <input id="style-line-height" type="number" min="0.5" max="4" step="0.1" required>
            </label>
            <label class="row">
              Icon size
              <input id="style-icon-size" type="number" min="4" max="200" step="1">
            </label>
            <label class="row">
              Icon gap
              <input id="style-icon-gap" type="number" min="0" max="200" step="1">
            </label>
            <label class="row">

          <span class="color-field"><input id="sketch-fill-color" type="color" value="#d9cfb4"><input class="opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Opacity">%</span>

  <script src="google-fonts.js"></script>
  <script src="material-symbols.js"></script>
  <script>
    // A color input followed by an opacity percentage makes one #rrggbbaa
    // color with it.
    function colorOf(input) {
      if (!input.nextElementSibling?.classList.contains('opacity')) return input.value;
      const percent = input.nextElementSibling.valueAsNumber;
      const alpha = Math.round(Math.min(100, Math.max(0, Number.isNaN(percent) ? 100 : percent)) * 2.55);
      return alpha === 255 ? input.value : input.value + alpha.toString(16).padStart(2, '0');
    }
    function showColor(input, color) {
      input.value = color.slice(0, 7);
      const opacity = input.nextElementSibling;
      if (document.activeElement !== opacity) {
        opacity.value = color.length > 7 ? Math.round(parseInt(color.slice(7), 16) / 2.55) : 100;
      }
    }
    for (const opacity of document.querySelectorAll('.opacity')) {
      const color = opacity.previousElementSibling;
      opacity.addEventListener('input', () => color.dispatchEvent(new Event('input')));
      opacity.addEventListener('change', () => {
        color.dispatchEvent(new Event('change'));
        opacity.blur();
      });
    }
    const modeButtons = document.querySelectorAll('#mode-menu [data-mode]');
    const labelTools = document.getElementById('label-tools');
    const labelToolButtons = document.querySelectorAll('[data-label-tool]');
    let labelTool = 'select';
    let selectedLabels = [];
    const soleLabel = () => (selectedLabels.length === 1 ? selectedLabels[0] : null);
    // Selected pins always belong to selected labels.
    let selectedPins = [];
    const pinOwner = (pin) => labels.find((label) => label.pins.includes(pin));
    const addPinButton = document.getElementById('add-pin');

    // 'pin' drops one pin for the selected label, from the panel's button.
    function setLabelTool(name) {
      labelTool = name;
      for (const button of labelToolButtons) {
        button.setAttribute('aria-pressed', button.dataset.labelTool === name);
      }
      addPinButton.setAttribute('aria-pressed', name === 'pin');
      updateCursor();
    }
    addPinButton.addEventListener('click', () => {
      setLabelTool(labelTool === 'pin' ? 'select' : 'pin');
      addPinButton.blur();
    });
    for (const button of labelToolButtons) {
      button.addEventListener('click', () => setLabelTool(button.dataset.labelTool));
    }
    const backgroundTools = document.getElementById('background-tools');
    const backgroundToolButtons = document.querySelectorAll('[data-background-tool]');
    const shapeMenu = document.getElementById('shape-menu');
    const shapeButtons = document.querySelectorAll('[data-shape]');
    // { kind: 'circle' | 'square' | 'triangle' | 'polygon', x, y, w, h, color }
    // in background pixels, with x, y the top left of the shape's box before
    // it's turned by rotation (radians, about its centre, absent when 0), and
    // sides on a polygon. Every shape is stretched to fill its box, so a
    // circle is an ellipse unless the box is square.
    const shapes = [];
    let selectedShapes = [];
    // What the Segments tool draws: one path of straight segments, kept apart
    // from the paths in path mode. The loops it closes can be filled; each
    // fill is a Set of its loop's points carrying a color.
    const sketch = { points: [], segments: [] };
    const sketchFills = [];
    // The point the next segment starts from while drawing.
    let sketchActive = null;
    // { point } | { segment } | { area: Set of points }
    let sketchSelected = null;
    let backgroundTool = 'select';
    let shapeKind = 'circle';
    const soleShape = () => (selectedShapes.length === 1 ? selectedShapes[0] : null);

    // The shape options sit just right of the Shapes tool button.
    function setBackgroundTool(name) {
      backgroundTool = name;
      sketchActive = null;
      for (const button of backgroundToolButtons) {
        button.setAttribute('aria-pressed', button.dataset.backgroundTool === name);
      }
      shapeMenu.hidden = name !== 'shapes';
      if (!shapeMenu.hidden) {
        const modeMenu = document.getElementById('mode-menu');
        const button = backgroundTools.querySelector('[data-background-tool="shapes"]');
        shapeMenu.style.left = `${modeMenu.offsetLeft + modeMenu.offsetWidth + 6}px`;
        shapeMenu.style.top = `${modeMenu.offsetTop + button.offsetTop + (button.offsetHeight - shapeMenu.offsetHeight) / 2}px`;
      }
      updateCursor();
    }
    for (const button of backgroundToolButtons) {
      button.addEventListener('click', () => setBackgroundTool(button.dataset.backgroundTool));
    }
    for (const button of shapeButtons) {
      button.addEventListener('click', () => {
        shapeKind = button.dataset.shape;
        for (const other of shapeButtons) other.setAttribute('aria-pressed', other === button);
      });
    }

    const modePanels = {
      preview: document.getElementById('preview-panel'),
      path: document.getElementById('path-panel'),
      background: document.getElementById('background-panel'),
      labels: document.getElementById('labels-panel'),
    };
    // Viewport sizes in CSS pixels, so a device's frame is its real size on screen.
    const DEVICES = [
      { name: 'iPhone 17 Pro', w: 402, h: 874 },
      { name: 'Pixel 10', w: 412, h: 923 },
    ];
    let previewDevice = DEVICES[0];
    document.getElementById('device-list').replaceChildren(...DEVICES.map((device) => {
      const row = document.createElement('label');
      row.className = 'row';
      const pick = Object.assign(document.createElement('input'), { type: 'radio', name: 'device', checked: device === previewDevice });
      pick.addEventListener('change', () => {
        previewDevice = device;
        pick.blur();
        draw();
      });
      const name = document.createElement('span');
      name.append(pick, ` ${device.name}`);
      row.append(name, Object.assign(document.createElement('span'), { className: 'device-size', textContent: `${device.w} × ${device.h}` }));
      return row;
    }));
    // Devices share one scale, the largest that fits every device inside
    // the canvas with room around it, so they stay true to each other's size.
    const PREVIEW_INSET = 40;
    const PHONE_BORDER = 12;
    function previewFrame() {
      const room = PREVIEW_INSET + PHONE_BORDER;
      const k = Math.min(
        (canvas.clientWidth - 2 * room) / Math.max(...DEVICES.map((device) => device.w)),
        (canvas.clientHeight - 2 * room) / Math.max(...DEVICES.map((device) => device.h)),
      );
      const w = previewDevice.w * k;
      const h = previewDevice.h * k;
      return { x: (canvas.clientWidth - w) / 2, y: (canvas.clientHeight - h) / 2, w, h, k };
    }
    // In preview, the fields set the view: the default zoom as the device
    // would see it, and offsets from -100% to 100% that slide the map until
    // its edge meets the screen's edge.
    const previewInputs = ['preview-zoom', 'preview-offset-x', 'preview-offset-y'].map((id) => document.getElementById(id));
    const [previewZoomInput, previewOffsetXInput, previewOffsetYInput] = previewInputs;
    for (const field of previewInputs) {
      const slider = field.closest('.slider').querySelector('input[type="range"]');
      slider.addEventListener('input', () => {
        field.value = slider.value;
        draw();
      });
      slider.addEventListener('change', () => slider.blur());
      field.addEventListener('input', () => {
        slider.value = field.value;
        draw();
      });
      field.addEventListener('change', () => field.blur());
    }
    const previewZoom = () => Math.min(MAX_SCALE * 100, Math.max(MIN_SCALE * 100, Number(previewZoomInput.value) || 100));
    function applyPreviewView() {
      const frame = previewFrame();
      view.scale = (previewZoom() / 100) * frame.k;
      const size = BACKGROUND * view.scale;
      const offset = (input) => Math.min(100, Math.max(-100, Number(input.value) || 0)) / 100;
      view.x = frame.x + frame.w / 2 - size / 2 - offset(previewOffsetXInput) * Math.max(0, (size - frame.w) / 2);
      view.y = frame.y + frame.h / 2 - size / 2 - offset(previewOffsetYInput) * Math.max(0, (size - frame.h) / 2);
    }
    // The device drawn as a phone around its screen.
    function drawDeviceFrame() {
      const frame = previewFrame();
      const dpr = window.devicePixelRatio || 1;
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = PHONE_BORDER;
      ctx.beginPath();
      const b = PHONE_BORDER / 2;
      ctx.roundRect(frame.x - b, frame.y - b, frame.w + 2 * b, frame.h + 2 * b, frame.w * 0.13 + b);
      ctx.stroke();
      ctx.restore();
    }

    // Each button in the left menus shows its name after a short hover.
    const TOOLTIP_DELAY = 500;
    const tooltip = document.getElementById('tooltip');
    let tooltipTimer = null;
    const hideTooltip = () => {
      clearTimeout(tooltipTimer);
      tooltip.hidden = true;
    };
    for (const button of document.querySelectorAll('#mode-menu button, #shape-menu button')) {
      button.addEventListener('mouseenter', () => {
        hideTooltip();
        tooltipTimer = setTimeout(() => {
          const rect = button.getBoundingClientRect();
          tooltip.textContent = button.getAttribute('aria-label');
          tooltip.hidden = false;
          tooltip.style.left = `${rect.right + 6}px`;
          tooltip.style.top = `${rect.top + rect.height / 2 - tooltip.offsetHeight / 2}px`;
        }, TOOLTIP_DELAY);
      });
      button.addEventListener('mouseleave', hideTooltip);
      button.addEventListener('pointerdown', hideTooltip);
    }

    const pathTools = document.getElementById('path-tools');
    const toolButtons = document.querySelectorAll('#path-tools [data-tool]');
    let tool = 'add';

    function setTool(name) {
      tool = name;
      for (const button of toolButtons) {
        button.setAttribute('aria-pressed', button.dataset.tool === name);
      }
      updateCursor();
      draw();
    }

    // Preview takes over the view and the layer, and gives both back after.
    let beforePreview = null;
    function setMode(mode) {
      if (mode === 'preview' && !inPreview()) {
        beforePreview = { view: { ...view }, layer: layerSelect.value };
        layerSelect.value = 'Automatic';
      } else if (mode !== 'preview' && inPreview()) {
        Object.assign(view, beforePreview.view);
        layerSelect.value = beforePreview.layer;
      }
      document.getElementById('view-menu').hidden = mode === 'preview';
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', button.dataset.mode === mode);
      }
      for (const [name, panel] of Object.entries(modePanels)) {
        panel.hidden = name !== mode;
      }
      const enteringLabels = mode === 'labels' && labelTools.hidden;
      const enteringPath = mode === 'path' && pathTools.hidden;
      pathTools.hidden = mode !== 'path';
      labelTools.hidden = mode !== 'labels';
      backgroundTools.hidden = mode !== 'background';
      if (enteringLabels) setLabelTool('add');
      if (mode !== 'background') {
        setBackgroundTool('select');
        selectedShapes = [];
        sketchSelected = null;
      }
      if (mode !== 'labels') {
        setLabelTool('select');
        finishLabel(false);
        selectedLabels = [];
      }
      if (mode !== 'path') selected = null;
      closeCrossingDialog();
      if (mode !== 'path') setTool('select');
      // Path mode starts on the Add path tool.
      else if (enteringPath) setTool('add');
    }

    for (const button of modeButtons) {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    }
    for (const button of toolButtons) {
      button.addEventListener('click', () => setTool(button.dataset.tool));
    }

    // A path is a set of points joined by segments. A segment is [a, b] or
    // [a, b, c1, c2]: its ends are the point objects themselves, so moving a
    // point moves its segments, and two control points bend it into a curve.
    const paths = [];
    // { path, point }, { path, segment }, { path, area: Set of its points }, or
    // { items: [...] } for two or more dots and segments.
    let selected = null;

    const selectionItems = () => selected?.items ?? (selected?.point || selected?.segment ? [selected] : []);

    // A user-made path: segments grouped so that they select and move as one.
    // Internally "path" already names a connected set of dots, so these are
    // groups in the code. { segments: Set, visible, width, widthColor }, with
    // width in background pixels so it scales with the map.
    const groups = [];
    const groupOf = (segment) => groups.find((group) => group.segments.has(segment));
    const pathOf = (segment) => paths.find((path) => path.segments.includes(segment));
    const groupItems = (group) => [...group.segments].map((segment) => ({ path: pathOf(segment), segment }));

    // Drops segments that no longer exist from groups, and groups left empty.
    function pruneGroups() {
      for (const group of groups) {
        for (const segment of group.segments) {
          if (!pathOf(segment)) group.segments.delete(segment);
        }
      }
      groups.splice(0, groups.length, ...groups.filter((group) => group.segments.size));
    }

    // Any grouped segment brings its whole group along. A selection that is
    // exactly one group is tagged with it.
    function setSelectionItems(items) {
      const expanded = [...items];
      for (const item of items) {
        const group = item.segment && groupOf(item.segment);
        if (!group) continue;
        for (const member of groupItems(group)) {
          if (!expanded.some((other) => sameItem(other, member))) expanded.push(member);
        }
      }
      const first = expanded[0]?.segment && groupOf(expanded[0].segment);
      const whole = first && expanded.length === first.segments.size && expanded.every((item) => first.segments.has(item.segment));
      if (whole) selected = { items: expanded, group: first };
      else selected = expanded.length === 0 ? null : expanded.length === 1 ? expanded[0] : { items: expanded };
    }

    // Every point a move of the selection carries: selected dots and the ends
    // of selected segments.
    const movingPoints = () =>
      new Set(selectionItems().flatMap((item) => (item.point ? [item.point] : item.segment.slice(0, 2))));

    const sameItem = (a, b) => (a.point ? a.point === b.point : a.segment === b.segment);

    function toggleInSelection(item) {
      const group = item.segment && groupOf(item.segment);
      const members = group ? groupItems(group) : [item];
      const items = selectionItems();
      const kept = items.filter((other) => !members.some((member) => sameItem(other, member)));
      setSelectionItems(kept.length === items.length ? [...items, ...members] : kept);
    }
    const DOT_RADIUS = 5;
    const SELECTED_DOT_RADIUS = 7;
    // Intersection dots are drawn this much bigger.
    const dotScale = (point) => (point.intersection ? 1.5 : 1);
    // Bending right at an end would swing the control points wildly, so a
    // bend is placed at least this far (as a fraction of the segment) from
    // either end.
    const BEND_END_MARGIN = 0.1;

    function labelledSlider(id, unit = 'px') {
      const input = document.getElementById(id);
      const output = document.querySelector(`output[for="${id}"]`);
      const show = () => { output.value = `${input.value}${unit}`; };
      show();
      input.addEventListener('input', show);
      return input;
    }
    const snapInput = labelledSlider('snap-distance');
    const segmentDistanceInput = labelledSlider('segment-distance');
    const nudgeInput = labelledSlider('nudge-amount');
    const bendFocusInput = labelledSlider('bend-focus', '%');
    const SHIFT_NUDGE_FACTOR = 10;
    const NUDGE_DIRECTIONS = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
    };
    const showLabelsToggle = document.getElementById('show-labels');
    showLabelsToggle.addEventListener('change', () => {
      showLabelsToggle.blur();
      draw();
    });
    const pathColor = document.getElementById('path-color');
    pathColor.addEventListener('input', () => draw());

    // Distances are in screen pixels so they feel the same at any zoom.
    function nearestPoint(sx, sy, maxDistance, exclude) {
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const point of path.points) {
          if (point === exclude) continue;
          const d = Math.hypot(point.x * view.scale + view.x - sx, point.y * view.scale + view.y - sy);
          if (d <= bestDistance) {
            best = { path, point };
            bestDistance = d;
          }
        }
      }
      return best;
    }

    function pointAt(sx, sy) {
      return nearestPoint(sx, sy, SELECTED_DOT_RADIUS);
    }

    const lerp = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });

    function segmentPoint([a, b, c1, c2], t) {
      if (!c1) return lerp(a, b, t);
      const p12 = lerp(c1, c2, t);
      return lerp(lerp(lerp(a, c1, t), p12, t), lerp(p12, lerp(c2, b, t), t), t);
    }

    // The closest spot on a segment to p, all in background coordinates.
    // Curves are approximated by short straight pieces.
    function closestOnSegment(segment, p) {
      const steps = segment[2] ? 32 : 1;
      let best = null;
      for (let i = 0; i < steps; i++) {
        const a = segmentPoint(segment, i / steps);
        const b = segmentPoint(segment, (i + 1) / steps);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSq = dx * dx + dy * dy;
        const u = lengthSq === 0 ? 0 : Math.min(1, Math.max(0, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSq));
        const q = lerp(a, b, u);
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (!best || d < best.distance) best = { point: q, t: (i + u) / steps, distance: d };
      }
      return best;
    }

    // The segment nearest screen point s within the hover distance, and t,
    // where along it the nearest spot is.
    function segmentHit(sx, sy, maxDistance = Number(segmentDistanceInput.value), skip = () => false) {
      const p = toBackground(sx, sy);
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const segment of path.segments) {
          if (skip(segment)) continue;
          const { t, distance } = closestOnSegment(segment, p);
          if (distance * view.scale <= bestDistance) {
            best = { path, segment, t };
            bestDistance = distance * view.scale;
          }
        }
      }
      return best;
    }

    function segmentAt(sx, sy) {
      const hit = segmentHit(sx, sy);
      return hit && { path: hit.path, segment: hit.segment };
    }

    const bendT = (t) => Math.min(1 - BEND_END_MARGIN, Math.max(BEND_END_MARGIN, t));

    // Replaces any bend with one that passes through m at t. It starts from
    // the straight segment (control points at its thirds) and pushes the two
    // control points by k1 and k2 times the offset of m from that line.
    // Equal weights give a symmetric bulge peaking mid-segment. Focused
    // weights put the peak at t, or a third of the way from an end when t is
    // nearer than that, since a single bulge can't peak closer. The bend focus
    // slider blends between the two; both keep the weights non-negative, so
    // the curve never doubles back into an S.
    function bendSegment(segment, t, m) {
      const [a, b] = segment;
      const u = 1 - t;
      const base = lerp(a, b, t);
      const dx = m.x - base.x;
      const dy = m.y - base.y;
      // The curve's offset at t is 3tu(u·k1 + t·k2), which must equal 1 there.
      // For the focused weights its slope must also be 0 at t.
      const reach = 1 / (3 * t * u);
      const spread = -((1 - 2 * t) * reach) / (t * u);
      let f1 = reach - t * spread;
      let f2 = f1 + spread;
      if (f2 < 0) [f1, f2] = [reach / u, 0];
      if (f1 < 0) [f1, f2] = [0, reach / t];
      const focus = Number(bendFocusInput.value) / 100;
      const k1 = reach + (f1 - reach) * focus;
      const k2 = reach + (f2 - reach) * focus;
      const third = lerp(a, b, 1 / 3);
      const twoThirds = lerp(a, b, 2 / 3);
      segment[2] = { x: third.x + dx * k1, y: third.y + dy * k1 };
      segment[3] = { x: twoThirds.x + dx * k2, y: twoThirds.y + dy * k2 };
    }

    // Splits a segment at t, keeping any bend's shape. The split point is new
    // unless one already in the path is given.
    function splitSegment(path, segment, t, point = segmentPoint(segment, t)) {
      const [a, b, c1, c2] = segment;
      if (!path.points.includes(point)) path.points.push(point);
      let halves = [[a, point], [point, b]];
      if (c1) {
        const p01 = lerp(a, c1, t);
        const p12 = lerp(c1, c2, t);
        const p23 = lerp(c2, b, t);
        halves = [[a, point, p01, lerp(p01, p12, t)], [point, b, lerp(p12, p23, t), p23]];
      }
      path.segments.splice(path.segments.indexOf(segment), 1, ...halves);
      const group = groupOf(segment);
      if (group) {
        group.segments.delete(segment);
        for (const half of halves) group.segments.add(half);
      }
      for (const fill of fills) {
        if (fill.has(a) && fill.has(b)) fill.add(point);
      }
      return point;
    }

    function insertOnSegment({ t }) {
      const { path, segment } = selected;
      selected = { path, point: splitSegment(path, segment, t) };
    }

    // An area is a bounded face of a path: the smallest loop of segments
    // around a spot. Fills are remembered by the set of points on the loop,
    // so they survive moving and bending.
    const fills = [];

    // Points along a segment walked from one end, without the far end.
    function sampleEdge({ from, segment }) {
      const steps = segment[2] ? 16 : 1;
      const forward = segment[0] === from;
      const points = [];
      for (let i = 0; i < steps; i++) points.push(segmentPoint(segment, forward ? i / steps : 1 - i / steps));
      return points;
    }

    function computeAreas(list = paths) {
      const areas = [];
      for (const path of list) {
        const out = new Map();
        const addEdge = (from, to, segment, toward) => {
          if (!out.has(from)) out.set(from, []);
          out.get(from).push({ from, to, segment, angle: Math.atan2(toward.y - from.y, toward.x - from.x) });
        };
        for (const segment of path.segments) {
          const [a, b, c1, c2] = segment;
          addEdge(a, b, segment, c1 ?? b);
          addEdge(b, a, segment, c2 ?? a);
        }
        for (const edges of out.values()) edges.sort((p, q) => p.angle - q.angle);

        // Walk each face by always taking the next edge clockwise at every
        // point. Bounded faces come out with positive area, the outer one negative.
        const seen = new Set();
        for (const edges of out.values()) {
          for (const start of edges) {
            if (seen.has(start)) continue;
            const loop = [];
            let edge = start;
            do {
              seen.add(edge);
              loop.push(edge);
              const next = out.get(edge.to);
              const back = next.findIndex((e) => e.segment === edge.segment && e.to === edge.from);
              edge = next[(back - 1 + next.length) % next.length];
            } while (edge !== start);
            const polygon = loop.flatMap(sampleEdge);
            let area = 0;
            for (let i = 0; i < polygon.length; i++) {
              const p = polygon[i];
              const q = polygon[(i + 1) % polygon.length];
              area += p.x * q.y - q.x * p.y;
            }
            if (area > 1e-6) {
              areas.push({ path, loop, polygon, area: area / 2, points: new Set(loop.map((e) => e.from)) });
            }
          }
        }
      }
      return areas;
    }

    const samePoints = (s, t) => s.size === t.size && [...s].every((p) => t.has(p));
    // Each fill is a Set of its area's points, carrying `visible` and `color`
    // like a path: a visible fill shows in its own color in both modes.
    const fillOf = (points) => fills.find((fill) => samePoints(fill, points));
    const isFilled = (area) => !!fillOf(area.points);

    function insidePolygon(polygon, p) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if ((a.y > p.y) !== (b.y > p.y) && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) {
          inside = !inside;
        }
      }
      return inside;
    }

    function areaAt(areas, sx, sy) {
      const p = toBackground(sx, sy);
      let best = null;
      for (const area of areas) {
        if (insidePolygon(area.polygon, p) && (!best || area.area < best.area)) best = area;
      }
      return best;
    }

    // Returns the segment drawn to the new point, if any.
    function addPoint(point) {
      if (selected?.point) {
        const segment = [selected.point, point];
        selected.path.points.push(point);
        selected.path.segments.push(segment);
        selected = { path: selected.path, point };
        return segment;
      }
      const path = { points: [point], segments: [] };
      paths.push(path);
      selected = { path, point };
      return null;
    }

    // Folds point `from` into `onto`, keeping every connection either had.
    // Segments between the two vanish, and duplicates collapse to one.
    function mergePoints(path, from, onto) {
      const into = onto.path;
      mergePaths(into, path);
      for (const segment of into.segments) {
        if (segment[0] === from) segment[0] = onto.point;
        if (segment[1] === from) segment[1] = onto.point;
      }
      into.points.splice(into.points.indexOf(from), 1);
      const seen = new Set();
      into.segments = into.segments.filter(([a, b]) => {
        const key = [into.points.indexOf(a), into.points.indexOf(b)].sort().join();
        if (a === b || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      for (const fill of fills) {
        if (fill.delete(from)) fill.add(onto.point);
      }
      onto.point.intersection ||= from.intersection;
      pruneGroups();
      selected = { path: into, point: onto.point };
    }

    function mergePaths(into, from) {
      if (into === from) return;
      into.points.push(...from.points);
      into.segments.push(...from.segments);
      paths.splice(paths.indexOf(from), 1);
    }

    // Returns the segment it creates, or null if the two were already joined.
    function connectTo(target) {
      const path = selected.path;
      const from = selected.point;
      const to = target.point;
      mergePaths(path, target.path);
      selected = { path, point: to };
      if (path.segments.some(([a, b]) => (a === from && b === to) || (a === to && b === from))) return null;
      const segment = [from, to];
      path.segments.push(segment);
      return segment;
    }

    // Where a segment crosses others away from either one's ends, as
    // { path, segment, t (along that segment), s (along this one), point }.
    // Curves are approximated by short straight pieces.
    function findCrossings(piece) {
      const pieces = (segment) => {
        const steps = segment[2] ? 32 : 1;
        return Array.from({ length: steps }, (_, i) => [segmentPoint(segment, i / steps), segmentPoint(segment, (i + 1) / steps), i, steps]);
      };
      const mine = pieces(piece);
      const crossings = [];
      const nearEnd = (t) => t < 1e-4 || t > 1 - 1e-4;
      for (const path of paths) {
        for (const segment of path.segments) {
          if (segment === piece) continue;
          for (const [m0, m1, i, mSteps] of mine) {
            for (const [o0, o1, j, oSteps] of pieces(segment)) {
              const rx = m1.x - m0.x, ry = m1.y - m0.y, sx = o1.x - o0.x, sy = o1.y - o0.y;
              const denom = rx * sy - ry * sx;
              if (Math.abs(denom) < 1e-9) continue;
              const u = ((o0.x - m0.x) * sy - (o0.y - m0.y) * sx) / denom;
              const v = ((o0.x - m0.x) * ry - (o0.y - m0.y) * rx) / denom;
              if (u < 0 || u > 1 || v < 0 || v > 1) continue;
              const t = (j + v) / oSteps;
              const s = (i + u) / mSteps;
              if (nearEnd(t) || nearEnd(s)) continue;
              crossings.push({ path, segment, t, s, point: lerp(m0, m1, u) });
            }
          }
        }
      }
      return crossings;
    }

    // Adds a shared intersection node wherever the segment crosses another,
    // splitting both.
    function addCrossingNodes(start) {
      const work = [start];
      for (let guard = 0; work.length && guard < 200; guard++) {
        const piece = work.pop();
        const path = pathOf(piece);
        const hit = path && findCrossings(piece)[0];
        if (!hit) continue;
        mergePaths(path, hit.path);
        const point = splitSegment(path, hit.segment, hit.t);
        point.intersection = true;
        const at = path.segments.indexOf(piece);
        splitSegment(path, piece, hit.s, point);
        work.push(path.segments[at], path.segments[at + 1]);
      }
      if (selected?.point) selected = { path: paths.find((path) => path.points.includes(selected.point)), point: selected.point };
    }

    // An item may already be gone when an earlier deletion in the same
    // selection took it along, as an orphaned end or a dot's segment.
    function deleteItem({ path, point, segment }) {
      if (!paths.includes(path)) return;
      if (segment) {
        if (!path.segments.includes(segment)) return;
        path.segments.splice(path.segments.indexOf(segment), 1);
        for (const end of segment.slice(0, 2)) {
          if (!path.segments.some(([a, b]) => a === end || b === end)) {
            path.points.splice(path.points.indexOf(end), 1);
          }
        }
      } else {
        if (!path.points.includes(point)) return;
        path.points.splice(path.points.indexOf(point), 1);
        path.segments = path.segments.filter(([a, b]) => a !== point && b !== point);
      }
      if (path.points.length === 0) paths.splice(paths.indexOf(path), 1);
    }

    function deleteSelected() {
      for (const item of selectionItems()) deleteItem(item);
      pruneGroups();
      selected = null;
    }

    // One step of undo: a copy of the paths, fills and selection taken just
    // before the last edit. Copies of points replace the originals everywhere
    // so segments, fills and the selection still share them.
    let undoState = null;

    function snapshot() {
      const copies = new Map();
      const segmentCopies = new Map();
      const copy = (p) => {
        if (!copies.has(p)) copies.set(p, { ...p });
        return copies.get(p);
      };
      const copiedPaths = paths.map((path) => ({
        points: path.points.map(copy),
        segments: path.segments.map((segment) => {
          const [a, b, ...controls] = segment;
          const copied = [copy(a), copy(b), ...controls.map((c) => ({ ...c }))];
          segmentCopies.set(segment, copied);
          return copied;
        }),
      }));
      const copyItem = ({ path, point, segment }) => ({
        pathIndex: paths.indexOf(path),
        point: point && copy(point),
        segmentIndex: segment && path.segments.indexOf(segment),
      });
      let copiedSelection = { items: selectionItems().map(copyItem) };
      if (selected?.area) copiedSelection = { pathIndex: paths.indexOf(selected.path), area: new Set([...selected.area].map(copy)) };
      return {
        paths: copiedPaths,
        fills: fills.map((fill) => Object.assign(new Set([...fill].filter((p) => copies.has(p)).map(copy)), { visible: fill.visible, color: fill.color })),
        groups: groups.map((group) => ({ ...group, segments: new Set([...group.segments].map((segment) => segmentCopies.get(segment))) })),
        labels: labels.map((label) => ({ ...label, pins: label.pins.map((pin) => ({ ...pin })) })),
        labelStyles: labelStyles.map((style) => ({ ...style })),
        shapes: shapes.map((shape) => ({ ...shape })),
        ...copySketch(),
        selection: copiedSelection,
      };
    }

    function recordUndo(state = snapshot()) {
      undoState = state;
    }

    function undo() {
      if (!undoState) return;
      const { paths: restoredPaths, fills: restoredFills, groups: restoredGroups, labels: restoredLabels, labelStyles: restoredStyles, shapes: restoredShapes, sketch: restoredSketch, sketchFills: restoredSketchFills, selection } = undoState;
      undoState = null;
      paths.splice(0, paths.length, ...restoredPaths);
      groups.splice(0, groups.length, ...restoredGroups);
      labels.splice(0, labels.length, ...restoredLabels);
      labelStyles.splice(0, labelStyles.length, ...restoredStyles);
      renderLabelStyles();
      closeStyleForm();
      selectedLabels = [];
      selectedPins = [];
      shapes.splice(0, shapes.length, ...restoredShapes);
      selectedShapes = [];
      sketch.points.splice(0, sketch.points.length, ...restoredSketch.points);
      sketch.segments.splice(0, sketch.segments.length, ...restoredSketch.segments);
      sketchFills.splice(0, sketchFills.length, ...restoredSketchFills);
      sketchActive = null;
      sketchSelected = null;
      fills.splice(0, fills.length, ...restoredFills);
      if (selection.area) {
        selected = { path: restoredPaths[selection.pathIndex], area: selection.area };
      } else {
        setSelectionItems(selection.items.map(({ pathIndex, point, segmentIndex }) => {
          const path = restoredPaths[pathIndex];
          return point ? { path, point } : { path, segment: path.segments[segmentIndex] };
        }));
      }
      drag = null;
      draw();
      updateCursor();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input[type="text"], textarea')) return;
      if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (pathTools.hidden || e.target.closest('input, textarea, select')) return;
      const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
      if (plain && e.key === '1') setTool('select');
      if (plain && e.key === '2') setTool('add');
      const nudge = NUDGE_DIRECTIONS[e.key];
      if (nudge && selectionItems().length) {
        e.preventDefault();
        // Background pixels, so a nudge is the same distance on the map at any zoom.
        const step = Number(nudgeInput.value) * (e.shiftKey ? SHIFT_NUDGE_FACTOR : 1);
        recordUndo();
        moveSelection(nudge[0] * step, nudge[1] * step);
        draw();
        updateCursor();
      }
      // Mac keyboards label Backspace "delete".
      const deleting = e.key === 'Delete' || e.key === 'Backspace';
      const fillIndex = selected?.area ? fills.findIndex((fill) => samePoints(fill, selected.area)) : -1;
      if (deleting && selectionItems().length) {
        e.preventDefault();
        recordUndo();
        deleteSelected();
        draw();
        updateCursor();
      } else if (deleting && fillIndex !== -1) {
        // On a selected area, Delete only ever removes its fill.
        e.preventDefault();
        recordUndo();
        fills.splice(fillIndex, 1);
        draw();
      } else if (e.key === 'Escape') {
        // An embedding page may otherwise take Esc as a cue to move focus out
        // of this frame, and then the next Esc never arrives here.
        e.preventDefault();
        closeCrossingDialog();
        // A first Esc clears the selection; with nothing selected it returns to the cursor tool.
        if (!selected) setTool('select');
        selected = null;
        draw();
        updateCursor();
      } else if (e.key === 'Enter') {
        // Stops a focused toolbar button from being pressed.
        e.preventDefault();
        selected = null;
        draw();
        updateCursor();
      }
    });

    const BACKGROUND = 1500;
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 6;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const canvasColor = document.getElementById('canvas-color');
    canvasColor.addEventListener('input', () => draw());
    const showPreviewColor = () => { document.getElementById('image-preview').style.background = colorOf(canvasColor); };
    canvasColor.addEventListener('input', showPreviewColor);
    showPreviewColor();

    const view = { scale: 1, x: 0, y: 0 };
    let size = null;

    const zoomInput = document.getElementById('zoom-input');
    const autoLayers = document.getElementById('auto-layers');
    // In preview, the zoom is the one the device would see.
    const zoomPercent = () => (inPreview() ? previewZoom() : Math.round(view.scale * 100));
    const inPreview = () => !document.getElementById('preview-panel').hidden;
    // Zooms about the middle of the canvas.
    function zoomTo(scale) {
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale));
      const mx = canvas.clientWidth / 2;
      const my = canvas.clientHeight / 2;
      view.x = mx - (mx - view.x) * (next / view.scale);
      view.y = my - (my - view.y) * (next / view.scale);
      view.scale = next;
      draw();
    }
    zoomInput.addEventListener('change', () => {
      zoomTo((Number(zoomInput.value) || zoomPercent()) / 100);
      zoomInput.blur();
      draw();
    });
    // Arrow keys step the zoom in whole percents straight away.
    zoomInput.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      zoomTo((zoomPercent() + (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1)) / 100);
      zoomInput.value = zoomPercent();
    });
    document.getElementById('fit-button').addEventListener('click', (e) => {
      centerBackground(canvas.clientWidth, canvas.clientHeight);
      e.currentTarget.blur();
      draw();
    });

    function centerBackground(w, h) {
      view.scale = Math.min(w, h) / BACKGROUND * 0.9;
      view.x = (w - BACKGROUND * view.scale) / 2;
      view.y = (h - BACKGROUND * view.scale) / 2;
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      // The canvas can still be settling into its final size after load, so
      // centre on the first real size and keep the view centred through resizes.
      if (size === null) {
        centerBackground(w, h);
      } else {
        view.x += (w - size.w) / 2;
        view.y += (h - size.h) / 2;
      }
      size = { w, h };
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      draw();
    }

    function draw() {
      if (inPreview()) applyPreviewView();
      if (document.activeElement !== zoomInput) zoomInput.value = zoomPercent();
      // Under Automatic, names the layers the current zoom shows.
      autoLayers.hidden = layerSelect.value !== 'Automatic';
      if (!autoLayers.hidden) {
        const names = shownLayers().map((layer) => layer[0].toUpperCase() + layer.slice(1));
        autoLayers.textContent = names.join(', ') || 'None';
      }
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.fillStyle = colorOf(canvasColor);
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);
      if (backgroundImage) {
        // Cover the background, centred, and draw the overflow too.
        const s = Math.max(BACKGROUND / backgroundImage.naturalWidth, BACKGROUND / backgroundImage.naturalHeight);
        const w = backgroundImage.naturalWidth * s;
        const h = backgroundImage.naturalHeight * s;
        ctx.drawImage(backgroundImage, (BACKGROUND - w) / 2, (BACKGROUND - h) / 2, w, h);
      }
      drawShapes();
      drawSketchFills();
      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 1 / view.scale;
      ctx.strokeRect(0, 0, BACKGROUND, BACKGROUND);
      if (pathTools.hidden) {
        for (const area of computeAreas()) {
          const fill = fillOf(area.points);
          if (!fill?.visible) continue;
          ctx.fillStyle = fill.color;
          traceArea(area);
          ctx.fill();
        }
        for (const group of groups) {
          if (group.visible && group.width > 0) strokeGroupWidth(group);
        }
        drawLabels();
        if (!labelTools.hidden) drawPins();
        if (!backgroundTools.hidden) {
          drawSketch();
          drawShapeSelection();
        }
        if (!modePanels.preview.hidden) drawDeviceFrame();
        drawMarquee();
        updatePanel();
        return;
      }

      // Lines and dots keep the same on-screen size at any zoom.
      const px = 1 / view.scale;
      const items = selectionItems();
      const selectedPoints = new Set(items.map((item) => item.point).filter(Boolean));
      const selectedSegments = new Set(items.map((item) => item.segment).filter(Boolean));
      const color = colorOf(pathColor);
      const shadow = () => {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4 * dpr;
        ctx.shadowOffsetY = 1 * dpr;
      };

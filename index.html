<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map Editor Prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0&icon_names=add_circle,delete,image,route">
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
    }
    .material-symbols-rounded {
      font-variation-settings: 'wght' 300;
    }
    #canvas-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #mode-menu {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #mode-menu button {
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    #mode-menu button[aria-pressed="true"] {
      background: #ddd;
    }
    #mode-menu hr {
      margin: 2px 4px;
      border: none;
      border-top: 1px solid #ddd;
    }
    #panel {
      flex: none;
      width: 300px;
      padding: 8px;
      box-sizing: border-box;
    }
    #image-preview {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #image-preview[hidden] {
      display: none;
    }
    #image-preview img {
      min-width: 0;
      max-width: 100%;
    }
    #image-delete {
      flex: none;
      display: flex;
      padding: 0;
    }
    #color-field {
      display: block;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
    <div id="mode-menu">
      <button type="button" data-mode="path" aria-label="Path editing mode" aria-pressed="false">
        <span class="material-symbols-rounded">route</span>
      </button>
      <button type="button" data-mode="background" aria-label="Background mode" aria-pressed="true">
        <span class="material-symbols-rounded">image</span>
      </button>
      <div id="path-tools" hidden>
        <hr>
        <button id="add-path" type="button" aria-label="Add path" aria-pressed="false">
          <span class="material-symbols-rounded">add_circle</span>
        </button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="path-panel" hidden></div>
    <div id="background-panel">
      <input id="image-upload" type="file" accept="image/*">
      <div id="image-preview" hidden>
        <img alt="Background image">
        <button id="image-delete" type="button" aria-label="Delete image">
          <span class="material-symbols-rounded">delete</span>
        </button>
      </div>
      <label id="color-field">
        Background color
        <input id="canvas-color" type="color" value="#eeeeee">
      </label>
    </div>
  </div>
  <script>
    const modeButtons = document.querySelectorAll('#mode-menu [data-mode]');
    const modePanels = {
      path: document.getElementById('path-panel'),
      background: document.getElementById('background-panel'),
    };
    const pathTools = document.getElementById('path-tools');
    const addPathButton = document.getElementById('add-path');
    let addingPath = false;

    function setAddingPath(on) {
      addingPath = on;
      addPathButton.setAttribute('aria-pressed', on);
      updateCursor();
    }

    function setMode(mode) {
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', button.dataset.mode === mode);
      }
      for (const [name, panel] of Object.entries(modePanels)) {
        panel.hidden = name !== mode;
      }
      pathTools.hidden = mode !== 'path';
      if (mode !== 'path') {
        setAddingPath(false);
        selectedPath = null;
        draw();
      }
    }

    for (const button of modeButtons) {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    }
    addPathButton.addEventListener('click', () => setAddingPath(!addingPath));

    const paths = [];
    let selectedPath = null;
    const DOT_RADIUS = 5;
    const SELECTED_DOT_RADIUS = 7;

    function pathAt(sx, sy) {
      for (let i = paths.length - 1; i >= 0; i--) {
        const start = paths[i].points[0];
        const dx = start.x * view.scale + view.x - sx;
        const dy = start.y * view.scale + view.y - sy;
        if (Math.hypot(dx, dy) <= SELECTED_DOT_RADIUS) return paths[i];
      }
      return null;
    }

    document.addEventListener('keydown', (e) => {
      if (!selectedPath || e.target.closest('input')) return;
      // Mac keyboards label Backspace "delete".
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        paths.splice(paths.indexOf(selectedPath), 1);
        selectedPath = null;
        draw();
        updateCursor();
      }
    });

    const BACKGROUND = 1500;
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 20;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const canvasColor = document.getElementById('canvas-color');
    canvasColor.addEventListener('input', () => draw());

    const view = { scale: 1, x: 0, y: 0 };
    let size = null;

    function centerBackground(w, h) {
      view.scale = Math.min(w, h) / BACKGROUND * 0.9;
      view.x = (w - BACKGROUND * view.scale) / 2;
      view.y = (h - BACKGROUND * view.scale) / 2;
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      // The canvas can still be settling into its final size after load, so
      // centre on the first real size and keep the view centred through resizes.
      if (size === null) {
        centerBackground(w, h);
      } else {
        view.x += (w - size.w) / 2;
        view.y += (h - size.h) / 2;
      }
      size = { w, h };
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      draw();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = canvasColor.value;
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);
      if (backgroundImage) {
        // Cover the background, centred, and draw the overflow too.
        const s = Math.max(BACKGROUND / backgroundImage.naturalWidth, BACKGROUND / backgroundImage.naturalHeight);
        const w = backgroundImage.naturalWidth * s;
        const h = backgroundImage.naturalHeight * s;
        ctx.drawImage(backgroundImage, (BACKGROUND - w) / 2, (BACKGROUND - h) / 2, w, h);
      }
      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 1 / view.scale;
      ctx.strokeRect(0, 0, BACKGROUND, BACKGROUND);

      // Dots keep the same on-screen size at any zoom.
      ctx.fillStyle = '#1a73e8';
      for (const path of paths) {
        if (path === selectedPath) continue;
        const start = path.points[0];
        ctx.beginPath();
        ctx.arc(start.x, start.y, DOT_RADIUS / view.scale, 0, Math.PI * 2);
        ctx.fill();
      }
      if (selectedPath) {
        const start = selectedPath.points[0];
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4 * dpr;
        ctx.shadowOffsetY = 1 * dpr;
        ctx.beginPath();
        ctx.arc(start.x, start.y, SELECTED_DOT_RADIUS / view.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2 / view.scale;
        ctx.stroke();
      }
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * Math.exp(-e.deltaY * 0.001)));
      // Keep the point under the cursor fixed while zooming.
      view.x = mx - (mx - view.x) * (next / view.scale);
      view.y = my - (my - view.y) * (next / view.scale);
      view.scale = next;
      draw();
      updateCursor();
    }, { passive: false });

    function toBackground(sx, sy) {
      return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale };
    }

    function inBackground(p) {
      return p.x >= 0 && p.x <= BACKGROUND && p.y >= 0 && p.y <= BACKGROUND;
    }

    function clampToBackground(v) {
      return Math.min(BACKGROUND, Math.max(0, v));
    }

    let addCursor = 'crosshair';
    document.fonts.load('300 24px "Material Symbols Rounded"', 'add_circle').then(() => {
      const icon = document.createElement('canvas');
      icon.width = icon.height = 24;
      const c = icon.getContext('2d');
      c.font = '300 24px "Material Symbols Rounded"';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      // A white halo keeps the icon visible over dark background images.
      c.strokeStyle = '#fff';
      c.lineWidth = 3;
      c.strokeText('add_circle', 12, 12);
      c.fillText('add_circle', 12, 12);
      addCursor = `url(${icon.toDataURL()}) 12 12, crosshair`;
      updateCursor();
    });

    let pointer = null;

    function updateCursor() {
      let cursor = '';
      if (pointer && !drag && addingPath && !pathAt(pointer.x, pointer.y)
          && inBackground(toBackground(pointer.x, pointer.y))) {
        cursor = addCursor;
      }
      canvas.style.cursor = cursor;
    }

    // Movement below this many pixels counts as a click rather than a pan.
    const CLICK_SLOP = 4;
    let drag = null;

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      const s = canvasPoint(e);
      const hit = pathTools.hidden ? null : pathAt(s.x, s.y);
      if (hit) {
        selectedPath = hit;
        const p = toBackground(s.x, s.y);
        const start = hit.points[0];
        drag = { path: hit, dx: start.x - p.x, dy: start.y - p.y };
        draw();
      } else {
        drag = { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY };
      }
      updateCursor();
    });

    canvas.addEventListener('pointermove', (e) => {
      pointer = canvasPoint(e);
      if (drag?.path) {
        const p = toBackground(pointer.x, pointer.y);
        const start = drag.path.points[0];
        start.x = clampToBackground(p.x + drag.dx);
        start.y = clampToBackground(p.y + drag.dy);
        draw();
      } else if (drag) {
        view.x += e.clientX - drag.x;
        view.y += e.clientY - drag.y;
        drag.x = e.clientX;
        drag.y = e.clientY;
        draw();
      }
      updateCursor();
    });

    canvas.addEventListener('pointerleave', () => {
      pointer = null;
      updateCursor();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const wasPan = !drag.path;
      const moved = wasPan && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
      drag = null;
      if (wasPan && moved < CLICK_SLOP && !pathTools.hidden) {
        selectedPath = null;
        const s = canvasPoint(e);
        const p = toBackground(s.x, s.y);
        if (addingPath && inBackground(p)) paths.push({ points: [p] });
        draw();
      }
      updateCursor();
    });
    canvas.addEventListener('pointercancel', () => { drag = null; });

    const upload = document.getElementById('image-upload');
    const preview = document.getElementById('image-preview');
    const previewImg = preview.querySelector('img');
    let backgroundImage = null;

    upload.addEventListener('change', () => {
      const file = upload.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        backgroundImage = img;
        previewImg.src = img.src;
        upload.hidden = true;
        preview.hidden = false;
        draw();
      };
      img.src = URL.createObjectURL(file);
    });

    document.getElementById('image-delete').addEventListener('click', () => {
      URL.revokeObjectURL(backgroundImage.src);
      backgroundImage = null;
      previewImg.removeAttribute('src');
      upload.value = '';
      preview.hidden = true;
      upload.hidden = false;
      draw();
    });

    new ResizeObserver(resize).observe(canvas);
  </script>
</body>
</html>

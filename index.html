<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map Editor Prototype</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0&icon_names=add_circle,arrow_selector_tool,delete,image,route">
  <style>
    /* Without this, any display rule on an element overrides its hidden attribute. */
    [hidden] {
      display: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
    }
    .material-symbols-rounded {
      font-variation-settings: 'wght' 300;
    }
    #canvas-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #mode-menu {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #mode-menu button {
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    #mode-menu button[aria-pressed="true"] {
      background: #ddd;
    }
    #mode-menu hr {
      margin: 2px 4px;
      border: none;
      border-top: 1px solid #ddd;
    }
    #panel {
      flex: none;
      width: 300px;
      padding: 8px;
      box-sizing: border-box;
    }
    #image-preview {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #image-preview img {
      min-width: 0;
      max-width: 100%;
    }
    #image-delete {
      flex: none;
      display: flex;
      padding: 0;
    }
    .field {
      display: block;
    }
    * + .field {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-area">
    <canvas id="canvas"></canvas>
    <div id="mode-menu">
      <button type="button" data-mode="path" aria-label="Path editing mode" aria-pressed="false">
        <span class="material-symbols-rounded">route</span>
      </button>
      <button type="button" data-mode="background" aria-label="Background mode" aria-pressed="true">
        <span class="material-symbols-rounded">image</span>
      </button>
      <div id="path-tools" hidden>
        <hr>
        <button type="button" data-tool="select" aria-label="Select" aria-pressed="true">
          <span class="material-symbols-rounded">arrow_selector_tool</span>
        </button>
        <button type="button" data-tool="add" aria-label="Add path" aria-pressed="false">
          <span class="material-symbols-rounded">add_circle</span>
        </button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="path-panel" hidden>
      <label class="field">
        Snap distance
        <input id="snap-distance" type="range" min="0" max="50" value="15">
        <output for="snap-distance"></output>
      </label>
      <label class="field">
        Segment hover distance
        <input id="segment-distance" type="range" min="1" max="50" value="10">
        <output for="segment-distance"></output>
      </label>
      <label class="field">
        Path color
        <input id="path-color" type="color" value="#ffbf17">
      </label>
      <button id="delete-bend" class="field" type="button" hidden>Delete bend</button>
      <label id="fill-area-field" class="field" hidden>
        <input id="fill-area" type="checkbox">
        Fill area
      </label>
    </div>
    <div id="background-panel">
      <input id="image-upload" type="file" accept="image/*">
      <div id="image-preview" hidden>
        <img alt="Background image">
        <button id="image-delete" type="button" aria-label="Delete image">
          <span class="material-symbols-rounded">delete</span>
        </button>
      </div>
      <label class="field">
        Background color
        <input id="canvas-color" type="color" value="#7b8365">
      </label>
    </div>
  </div>
  <script>
    const modeButtons = document.querySelectorAll('#mode-menu [data-mode]');
    const modePanels = {
      path: document.getElementById('path-panel'),
      background: document.getElementById('background-panel'),
    };
    const pathTools = document.getElementById('path-tools');
    const toolButtons = document.querySelectorAll('#path-tools [data-tool]');
    let tool = 'select';

    function setTool(name) {
      tool = name;
      for (const button of toolButtons) {
        button.setAttribute('aria-pressed', button.dataset.tool === name);
      }
      updateCursor();
      draw();
    }

    function setMode(mode) {
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', button.dataset.mode === mode);
      }
      for (const [name, panel] of Object.entries(modePanels)) {
        panel.hidden = name !== mode;
      }
      pathTools.hidden = mode !== 'path';
      if (mode !== 'path') {
        selected = null;
        setTool('select');
      }
    }

    for (const button of modeButtons) {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    }
    for (const button of toolButtons) {
      button.addEventListener('click', () => setTool(button.dataset.tool));
    }

    // A path is a set of points joined by segments. A segment is [a, b] or
    // [a, b, control]: its ends are the point objects themselves, so moving a
    // point moves its segments, and a control point bends it into a curve.
    const paths = [];
    let selected = null; // { path, point }, { path, segment } or { path, area: Set of its points }
    const DOT_RADIUS = 5;
    const SELECTED_DOT_RADIUS = 7;
    // Bending near an end would swing the control point wildly, so the grab
    // point stays this far (as a fraction of the segment) from either end.
    const BEND_END_MARGIN = 0.1;

    function pixelSlider(id) {
      const input = document.getElementById(id);
      const output = document.querySelector(`output[for="${id}"]`);
      const show = () => { output.value = `${input.value}px`; };
      show();
      input.addEventListener('input', show);
      return input;
    }
    const snapInput = pixelSlider('snap-distance');
    const segmentDistanceInput = pixelSlider('segment-distance');
    const pathColor = document.getElementById('path-color');
    pathColor.addEventListener('input', () => draw());

    // Distances are in screen pixels so they feel the same at any zoom.
    function nearestPoint(sx, sy, maxDistance, exclude) {
      let best = null;
      let bestDistance = maxDistance;
      for (const path of paths) {
        for (const point of path.points) {
          if (point === exclude) continue;
          const d = Math.hypot(point.x * view.scale + view.x - sx, point.y * view.scale + view.y - sy);
          if (d <= bestDistance) {
            best = { path, point };
            bestDistance = d;
          }
        }
      }
      return best;
    }

    function pointAt(sx, sy) {
      return nearestPoint(sx, sy, SELECTED_DOT_RADIUS);
    }

    const lerp = (p, q, t) => ({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });

    function segmentPoint([a, b, c], t) {
      return c ? lerp(lerp(a, c, t), lerp(c, b, t), t) : lerp(a, b, t);
    }

    // The closest spot on a segment to p, all in background coordinates.
    // Curves are approximated by short straight pieces.
    function closestOnSegment(segment, p) {
      const steps = segment[2] ? 32 : 1;
      let best = null;
      for (let i = 0; i < steps; i++) {
        const a = segmentPoint(segment, i / steps);
        const b = segmentPoint(segment, (i + 1) / steps);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSq = dx * dx + dy * dy;
        const u = lengthSq === 0 ? 0 : Math.min(1, Math.max(0, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSq));
        const q = lerp(a, b, u);
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (!best || d < best.distance) best = { point: q, t: (i + u) / steps, distance: d };
      }
      return best;
    }

    // The segment nearest screen point s within the hover distance, and t,
    // where along it the nearest spot is.
    function segmentHit(sx, sy) {
      const p = toBackground(sx, sy);
      let best = null;
      let bestDistance = Number(segmentDistanceInput.value);
      for (const path of paths) {
        for (const segment of path.segments) {
          const { t, distance } = closestOnSegment(segment, p);
          if (distance * view.scale <= bestDistance) {
            best = { path, segment, t };
            bestDistance = distance * view.scale;
          }
        }
      }
      return best;
    }

    function segmentAt(sx, sy) {
      const hit = segmentHit(sx, sy);
      return hit && { path: hit.path, segment: hit.segment };
    }

    const bendT = (t) => Math.min(1 - BEND_END_MARGIN, Math.max(BEND_END_MARGIN, t));

    // Choose the control point so the curve passes through m at t.
    function bendSegment(segment, t, m) {
      const [a, b] = segment;
      const u = 1 - t;
      const k = 2 * t * u;
      segment[2] = {
        x: (m.x - u * u * a.x - t * t * b.x) / k,
        y: (m.y - u * u * a.y - t * t * b.y) / k,
      };
    }

    function insertOnSegment({ point, t }) {
      const { path, segment } = selected;
      const [a, b, c] = segment;
      path.points.push(point);
      const halves = c
        ? [[a, point, lerp(a, c, t)], [point, b, lerp(c, b, t)]]
        : [[a, point], [point, b]];
      path.segments.splice(path.segments.indexOf(segment), 1, ...halves);
      for (const fill of fills) {
        if (fill.has(a) && fill.has(b)) fill.add(point);
      }
      selected = { path, point };
    }

    // An area is a bounded face of a path: the smallest loop of segments
    // around a spot. Fills are remembered by the set of points on the loop,
    // so they survive moving and bending.
    const fills = [];

    // Points along a segment walked from one end, without the far end.
    function sampleEdge({ from, segment }) {
      const steps = segment[2] ? 16 : 1;
      const forward = segment[0] === from;
      const points = [];
      for (let i = 0; i < steps; i++) points.push(segmentPoint(segment, forward ? i / steps : 1 - i / steps));
      return points;
    }

    function computeAreas() {
      const areas = [];
      for (const path of paths) {
        const out = new Map();
        const addEdge = (from, to, segment, toward) => {
          if (!out.has(from)) out.set(from, []);
          out.get(from).push({ from, to, segment, angle: Math.atan2(toward.y - from.y, toward.x - from.x) });
        };
        for (const segment of path.segments) {
          const [a, b, c] = segment;
          addEdge(a, b, segment, c ?? b);
          addEdge(b, a, segment, c ?? a);
        }
        for (const edges of out.values()) edges.sort((p, q) => p.angle - q.angle);

        // Walk each face by always taking the next edge clockwise at every
        // point. Bounded faces come out with positive area, the outer one negative.
        const seen = new Set();
        for (const edges of out.values()) {
          for (const start of edges) {
            if (seen.has(start)) continue;
            const loop = [];
            let edge = start;
            do {
              seen.add(edge);
              loop.push(edge);
              const next = out.get(edge.to);
              const back = next.findIndex((e) => e.segment === edge.segment && e.to === edge.from);
              edge = next[(back - 1 + next.length) % next.length];
            } while (edge !== start);
            const polygon = loop.flatMap(sampleEdge);
            let area = 0;
            for (let i = 0; i < polygon.length; i++) {
              const p = polygon[i];
              const q = polygon[(i + 1) % polygon.length];
              area += p.x * q.y - q.x * p.y;
            }
            if (area > 1e-6) {
              areas.push({ path, loop, polygon, area: area / 2, points: new Set(loop.map((e) => e.from)) });
            }
          }
        }
      }
      return areas;
    }

    const samePoints = (s, t) => s.size === t.size && [...s].every((p) => t.has(p));
    const isFilled = (area) => fills.some((fill) => samePoints(fill, area.points));

    function insidePolygon(polygon, p) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if ((a.y > p.y) !== (b.y > p.y) && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) {
          inside = !inside;
        }
      }
      return inside;
    }

    function areaAt(areas, sx, sy) {
      const p = toBackground(sx, sy);
      let best = null;
      for (const area of areas) {
        if (insidePolygon(area.polygon, p) && (!best || area.area < best.area)) best = area;
      }
      return best;
    }

    function addPoint(point) {
      if (selected?.point) {
        selected.path.points.push(point);
        selected.path.segments.push([selected.point, point]);
        selected = { path: selected.path, point };
      } else {
        const path = { points: [point], segments: [] };
        paths.push(path);
        selected = { path, point };
      }
    }

    function connectTo(target) {
      const path = selected.path;
      const from = selected.point;
      const to = target.point;
      if (target.path !== path) {
        path.points.push(...target.path.points);
        path.segments.push(...target.path.segments);
        paths.splice(paths.indexOf(target.path), 1);
      }
      const exists = path.segments.some(([a, b]) => (a === from && b === to) || (a === to && b === from));
      if (!exists) path.segments.push([from, to]);
      selected = { path, point: to };
    }

    function deleteSelected() {
      const { path, point, segment } = selected;
      if (segment) {
        path.segments.splice(path.segments.indexOf(segment), 1);
        for (const end of segment.slice(0, 2)) {
          if (!path.segments.some(([a, b]) => a === end || b === end)) {
            path.points.splice(path.points.indexOf(end), 1);
          }
        }
        if (path.points.length === 0) paths.splice(paths.indexOf(path), 1);
      } else {
        path.points.splice(path.points.indexOf(point), 1);
        path.segments = path.segments.filter(([a, b]) => a !== point && b !== point);
        if (path.points.length === 0) paths.splice(paths.indexOf(path), 1);
      }
      selected = null;
    }

    document.addEventListener('keydown', (e) => {
      if (pathTools.hidden || e.target.closest('input')) return;
      const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
      if (plain && e.key === '1') setTool('select');
      if (plain && e.key === '2') setTool('add');
      // Mac keyboards label Backspace "delete".
      if ((e.key === 'Delete' || e.key === 'Backspace') && (selected?.point || selected?.segment)) {
        e.preventDefault();
        deleteSelected();
        draw();
        updateCursor();
      } else if (e.key === 'Escape') {
        selected = null;
        setTool('select');
      }
    });

    const BACKGROUND = 1500;
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 20;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const canvasColor = document.getElementById('canvas-color');
    canvasColor.addEventListener('input', () => draw());

    const view = { scale: 1, x: 0, y: 0 };
    let size = null;

    function centerBackground(w, h) {
      view.scale = Math.min(w, h) / BACKGROUND * 0.9;
      view.x = (w - BACKGROUND * view.scale) / 2;
      view.y = (h - BACKGROUND * view.scale) / 2;
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      // The canvas can still be settling into its final size after load, so
      // centre on the first real size and keep the view centred through resizes.
      if (size === null) {
        centerBackground(w, h);
      } else {
        view.x += (w - size.w) / 2;
        view.y += (h - size.h) / 2;
      }
      size = { w, h };
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      draw();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = canvasColor.value;
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);
      if (backgroundImage) {
        // Cover the background, centred, and draw the overflow too.
        const s = Math.max(BACKGROUND / backgroundImage.naturalWidth, BACKGROUND / backgroundImage.naturalHeight);
        const w = backgroundImage.naturalWidth * s;
        const h = backgroundImage.naturalHeight * s;
        ctx.drawImage(backgroundImage, (BACKGROUND - w) / 2, (BACKGROUND - h) / 2, w, h);
      }
      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 1 / view.scale;
      ctx.strokeRect(0, 0, BACKGROUND, BACKGROUND);

      // Lines and dots keep the same on-screen size at any zoom.
      const px = 1 / view.scale;
      const color = pathColor.value;
      const shadow = () => {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4 * dpr;
        ctx.shadowOffsetY = 1 * dpr;
      };

      const areas = computeAreas();
      if (selected?.area && !areas.some((area) => samePoints(area.points, selected.area))) selected = null;
      const fillArea = (area) => {
        ctx.beginPath();
        area.polygon.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.closePath();
        ctx.fill();
      };
      ctx.fillStyle = color;
      ctx.save();
      ctx.globalAlpha = 0.8;
      for (const area of areas) {
        if (isFilled(area)) fillArea(area);
      }
      ctx.restore();
      const hoveredArea = hoveredAreaIn(areas);
      if (hoveredArea && !isFilled(hoveredArea)) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        fillArea(hoveredArea);
        ctx.restore();
      }

      const selectedArea = selected?.area && areas.find((area) => samePoints(area.points, selected.area));
      if (selectedArea) {
        ctx.save();
        ctx.lineCap = ctx.lineJoin = 'round';
        shadow();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 7 * px;
        ctx.beginPath();
        for (const edge of selectedArea.loop) traceSegment(edge.segment);
        ctx.stroke();
        ctx.restore();
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * px;
      ctx.beginPath();
      for (const path of paths) {
        for (const segment of path.segments) {
          if (segment !== selected?.segment) traceSegment(segment);
        }
      }
      ctx.stroke();

      if (selected?.segment) {
        ctx.save();
        ctx.lineCap = 'round';
        shadow();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 7 * px;
        ctx.beginPath();
        traceSegment(selected.segment);
        ctx.stroke();
        ctx.restore();
        ctx.lineWidth = 3 * px;
        ctx.stroke();
      }

      const target = addTarget();
      const lineEnd = target?.connect?.point ?? target?.add;
      if (selected?.point && lineEnd) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2 * px;
        ctx.setLineDash([6 * px, 4 * px]);
        ctx.beginPath();
        ctx.moveTo(selected.point.x, selected.point.y);
        ctx.lineTo(lineEnd.x, lineEnd.y);
        ctx.stroke();
        ctx.restore();
      }

      if (drag?.guides?.length) {
        const length = 4 * BACKGROUND;
        ctx.save();
        ctx.strokeStyle = 'red';
        ctx.lineWidth = px;
        ctx.beginPath();
        for (const { origin, dx, dy } of drag.guides) {
          ctx.moveTo(origin.x - dx * length, origin.y - dy * length);
          ctx.lineTo(origin.x + dx * length, origin.y + dy * length);
        }
        ctx.stroke();
        ctx.restore();
      }

      const hovered = hoveredPoint(target);
      ctx.fillStyle = color;
      for (const path of paths) {
        for (const point of path.points) {
          if (point === selected?.point || point === hovered) continue;
          ctx.beginPath();
          ctx.arc(point.x, point.y, DOT_RADIUS * px, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const emphasise = (point, outlineAlpha) => {
        ctx.save();
        shadow();
        ctx.beginPath();
        ctx.arc(point.x, point.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = `rgba(255, 255, 255, ${outlineAlpha})`;
        ctx.lineWidth = 2 * px;
        ctx.stroke();
      };
      if (hovered) emphasise(hovered, 0.7);
      if (selected?.point) emphasise(selected.point, 1);

      const ghost = target?.insert?.point ?? bendGhost();
      if (ghost) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(ghost.x, ghost.y, SELECTED_DOT_RADIUS * px, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      updatePanel();
    }

    const deleteBendButton = document.getElementById('delete-bend');
    deleteBendButton.addEventListener('click', () => {
      selected.segment.length = 2;
      draw();
    });

    const fillAreaField = document.getElementById('fill-area-field');
    const fillAreaToggle = document.getElementById('fill-area');
    fillAreaToggle.addEventListener('change', () => {
      const index = fills.findIndex((fill) => samePoints(fill, selected.area));
      if (fillAreaToggle.checked && index === -1) fills.push(new Set(selected.area));
      if (!fillAreaToggle.checked && index !== -1) fills.splice(index, 1);
      // Hand focus back so keyboard shortcuts keep working.
      fillAreaToggle.blur();
      draw();
    });

    // Runs after every draw, which follows every change to the selection.
    function updatePanel() {
      deleteBendButton.hidden = !selected?.segment;
      deleteBendButton.disabled = !selected?.segment?.[2];
      fillAreaField.hidden = !selected?.area;
      fillAreaToggle.checked = !!selected?.area && fills.some((fill) => samePoints(fill, selected.area));
    }

    function traceSegment([a, b, c]) {
      ctx.moveTo(a.x, a.y);
      if (c) ctx.quadraticCurveTo(c.x, c.y, b.x, b.y);
      else ctx.lineTo(b.x, b.y);
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * Math.exp(-e.deltaY * 0.001)));
      // Keep the point under the cursor fixed while zooming.
      view.x = mx - (mx - view.x) * (next / view.scale);
      view.y = my - (my - view.y) * (next / view.scale);
      view.scale = next;
      draw();
      updateCursor();
    }, { passive: false });

    function toBackground(sx, sy) {
      return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale };
    }

    function inBackground(p) {
      return p.x >= 0 && p.x <= BACKGROUND && p.y >= 0 && p.y <= BACKGROUND;
    }

    function clampToBackground(v) {
      return Math.min(BACKGROUND, Math.max(0, v));
    }

    let addCursor = 'crosshair';
    document.fonts.load('300 24px "Material Symbols Rounded"', 'add_circle').then(() => {
      const icon = document.createElement('canvas');
      icon.width = icon.height = 24;
      const c = icon.getContext('2d');
      c.font = '300 24px "Material Symbols Rounded"';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      // A white halo keeps the icon visible over dark background images.
      c.strokeStyle = '#fff';
      c.lineWidth = 3;
      c.strokeText('add_circle', 12, 12);
      c.fillText('add_circle', 12, 12);
      addCursor = `url(${icon.toDataURL()}) 12 12, crosshair`;
      updateCursor();
    });

    let pointer = null;

    // What a click with the add tool at screen point s would do:
    // { connect: {path, point} } joins the selected point to an existing one,
    // { add: p } places a new point, { insert: p } splits the selected segment.
    // null means the click selects or deselects instead.
    let shiftHeld = false;
    const trackShift = (e) => {
      if (e.key !== 'Shift' || shiftHeld === (e.type === 'keydown')) return;
      shiftHeld = e.type === 'keydown';
      draw();
      updateCursor();
    };
    document.addEventListener('keydown', trackShift);
    document.addEventListener('keyup', trackShift);
    window.addEventListener('blur', () => { shiftHeld = false; });

    // Moves screen point s onto the nearest of the 8 rays (every 45°) out of
    // the given point, keeping how far along that ray it reaches.
    function lockAngle(from, s) {
      const ox = from.x * view.scale + view.x;
      const oy = from.y * view.scale + view.y;
      const angle = Math.round(Math.atan2(s.y - oy, s.x - ox) / (Math.PI / 4)) * (Math.PI / 4);
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const reach = Math.max(0, (s.x - ox) * dx + (s.y - oy) * dy);
      return { x: ox + dx * reach, y: oy + dy * reach };
    }

    // Pulls a dragged point onto lines at multiples of 45° through the points
    // it connects to, when it comes within snap distance of them. Near a
    // crossing of two such lines it goes to the crossing. Returns the guide
    // lines it snapped to, as { origin, angle }.
    function snapToNeighbourAngles(path, point, target) {
      const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS) / view.scale;
      const lines = [];
      for (const [a, b] of path.segments) {
        const origin = a === point ? b : b === point ? a : null;
        if (!origin) continue;
        let best = null;
        for (let k = 0; k < 4; k++) {
          const angle = (k * Math.PI) / 4;
          const dx = Math.cos(angle);
          const dy = Math.sin(angle);
          const offset = Math.abs((target.x - origin.x) * dy - (target.y - origin.y) * dx);
          if (offset <= reach && (!best || offset < best.offset)) best = { origin, angle, dx, dy, offset };
        }
        if (best) lines.push(best);
      }

      let crossing = null;
      for (let i = 0; i < lines.length; i++) {
        for (let j = i + 1; j < lines.length; j++) {
          const l = lines[i];
          const m = lines[j];
          const denom = l.dx * m.dy - l.dy * m.dx;
          if (Math.abs(denom) < 1e-9) continue;
          const u = ((m.origin.x - l.origin.x) * m.dy - (m.origin.y - l.origin.y) * m.dx) / denom;
          const x = { x: l.origin.x + l.dx * u, y: l.origin.y + l.dy * u };
          const d = Math.hypot(x.x - target.x, x.y - target.y);
          if (d <= reach * Math.SQRT2 && (!crossing || d < crossing.d)) crossing = { point: x, lines: [l, m], d };
        }
      }
      if (crossing) return { target: crossing.point, guides: crossing.lines };

      if (lines.length === 0) return { target, guides: [] };
      const l = lines.reduce((p, q) => (q.offset < p.offset ? q : p));
      const along = (target.x - l.origin.x) * l.dx + (target.y - l.origin.y) * l.dy;
      return { target: { x: l.origin.x + l.dx * along, y: l.origin.y + l.dy * along }, guides: [l] };
    }

    function addTarget(s = pointer) {
      if (!s || drag || spaceHeld || tool !== 'add' || pathTools.hidden) return null;
      const hit = pointAt(s.x, s.y);
      const p = toBackground(s.x, s.y);
      if (selected?.point) {
        if (hit?.point === selected.point) return null;
        const q = shiftHeld ? lockAngle(selected.point, s) : s;
        const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS);
        const snap = nearestPoint(q.x, q.y, reach, selected.point);
        if (snap) return { connect: snap };
        const end = toBackground(q.x, q.y);
        return inBackground(end) ? { add: end } : null;
      }
      if (hit) return null;
      if (selected?.segment) {
        const { t } = closestOnSegment(selected.segment, p);
        return { insert: { point: segmentPoint(selected.segment, t), t } };
      }
      if (segmentAt(s.x, s.y)) return null;
      return inBackground(p) ? { add: p } : null;
    }

    // In the cursor tool, a ghost dot marks where a segment would be grabbed
    // for bending: the spot on it nearest the pointer.
    function bendGhost() {
      if (drag?.bend) return segmentPoint(drag.bend, drag.t);
      if (!pointer || drag || spaceHeld || tool !== 'select' || pathTools.hidden) return null;
      if (pointAt(pointer.x, pointer.y)) return null;
      const hit = segmentHit(pointer.x, pointer.y);
      return hit && segmentPoint(hit.segment, bendT(hit.t));
    }

    function hoveredAreaIn(areas) {
      if (!pointer || drag || spaceHeld || tool !== 'select' || pathTools.hidden) return null;
      if (pointAt(pointer.x, pointer.y) || segmentHit(pointer.x, pointer.y)) return null;
      return areaAt(areas, pointer.x, pointer.y);
    }

    function hoveredPoint(target) {
      if (!pointer || drag || spaceHeld || pathTools.hidden) return null;
      if (target?.connect) return target.connect.point;
      const hit = pointAt(pointer.x, pointer.y);
      return hit && hit.point !== selected?.point ? hit.point : null;
    }

    function updateCursor() {
      if (spaceHeld || drag?.spacePan) canvas.style.cursor = drag ? 'grabbing' : 'grab';
      else canvas.style.cursor = addTarget() ? addCursor : '';
    }

    // Holding space turns every press on the canvas into a pan.
    let spaceHeld = false;
    const trackSpace = (e) => {
      if (e.code !== 'Space' || e.target.closest('input[type="text"], textarea')) return;
      // Stops the page scrolling and a focused button being pressed.
      e.preventDefault();
      const down = e.type === 'keydown';
      if (spaceHeld === down) return;
      spaceHeld = down;
      draw();
      updateCursor();
    };
    document.addEventListener('keydown', trackSpace);
    document.addEventListener('keyup', trackSpace);
    window.addEventListener('blur', () => { spaceHeld = false; });

    // Movement below this many pixels counts as a click rather than a pan.
    const CLICK_SLOP = 4;
    let drag = null;

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      const s = canvasPoint(e);
      if (spaceHeld) {
        drag = { x: e.clientX, y: e.clientY, spacePan: true };
        updateCursor();
        return;
      }
      const hit = pathTools.hidden || addTarget(s)?.connect ? null : pointAt(s.x, s.y);
      const handle = !hit && tool === 'select' && !pathTools.hidden ? segmentHit(s.x, s.y) : null;
      const p = toBackground(s.x, s.y);
      if (hit) {
        selected = hit;
        drag = { point: hit.point, path: hit.path, dx: hit.point.x - p.x, dy: hit.point.y - p.y };
        draw();
      } else if (handle) {
        selected = { path: handle.path, segment: handle.segment };
        const t = bendT(handle.t);
        const m = segmentPoint(handle.segment, t);
        drag = { bend: handle.segment, t, dx: m.x - p.x, dy: m.y - p.y, startX: e.clientX, startY: e.clientY };
        draw();
      } else {
        drag = { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY };
      }
      updateCursor();
    });

    canvas.addEventListener('pointermove', (e) => {
      pointer = canvasPoint(e);
      shiftHeld = e.shiftKey;
      if (drag?.point) {
        const p = toBackground(pointer.x, pointer.y);
        let target = { x: p.x + drag.dx, y: p.y + drag.dy };
        drag.guides = [];
        if (shiftHeld) ({ target, guides: drag.guides } = snapToNeighbourAngles(drag.path, drag.point, target));
        drag.point.x = clampToBackground(target.x);
        drag.point.y = clampToBackground(target.y);
      } else if (drag?.bend) {
        // Ignore jitter so a plain click doesn't bend a straight segment.
        if (drag.bending || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          drag.bending = true;
          const p = toBackground(pointer.x, pointer.y);
          bendSegment(drag.bend, drag.t, { x: p.x + drag.dx, y: p.y + drag.dy });
        }
      } else if (drag) {
        view.x += e.clientX - drag.x;
        view.y += e.clientY - drag.y;
        drag.x = e.clientX;
        drag.y = e.clientY;
      }
      draw();
      updateCursor();
    });

    canvas.addEventListener('pointerleave', () => {
      pointer = null;
      draw();
      updateCursor();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!drag) return;
      const wasClick = !drag.point && !drag.bend && !drag.spacePan
        && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < CLICK_SLOP;
      drag = null;
      if (wasClick && !pathTools.hidden) {
        const s = canvasPoint(e);
        const target = addTarget(s);
        if (target?.connect) {
          connectTo(target.connect);
        } else if (target?.add) {
          addPoint(target.add);
        } else if (target?.insert) {
          insertOnSegment(target.insert);
        } else {
          const area = tool === 'select' ? areaAt(computeAreas(), s.x, s.y) : null;
          selected = segmentAt(s.x, s.y) ?? (area && { path: area.path, area: area.points });
        }
      }
      draw();
      updateCursor();
    });
    canvas.addEventListener('pointercancel', () => { drag = null; });

    const upload = document.getElementById('image-upload');
    const preview = document.getElementById('image-preview');
    const previewImg = preview.querySelector('img');
    let backgroundImage = null;

    function setBackgroundImage(src) {
      const img = new Image();
      img.onload = () => {
        backgroundImage = img;
        previewImg.src = img.src;
        upload.hidden = true;
        preview.hidden = false;
        draw();
      };
      img.src = src;
    }

    upload.addEventListener('change', () => {
      const file = upload.files[0];
      if (file) setBackgroundImage(URL.createObjectURL(file));
    });

    setBackgroundImage('demo-park.svg');

    document.getElementById('image-delete').addEventListener('click', () => {
      if (backgroundImage.src.startsWith('blob:')) URL.revokeObjectURL(backgroundImage.src);
      backgroundImage = null;
      previewImg.removeAttribute('src');
      upload.value = '';
      preview.hidden = true;
      upload.hidden = false;
      draw();
    });

    new ResizeObserver(resize).observe(canvas);
  </script>
</body>
</html>

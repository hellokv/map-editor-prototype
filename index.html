        selectedLabels = [];
        draw();
      }
    });

    // The call_split icon over an intersection dot, in black or white to
    // stand out from the dot, centred by its drawn shape rather than its
    // font box, which sits it off-centre.
    function drawIntersectionIcon(point, radius, dotColor) {
      const font = '300 24px "Material Symbols Rounded"';
      if (!document.fonts.check(font, 'call_split')) {
        document.fonts.load(font, 'call_split').then(draw);
        return;
      }
      ctx.save();
      ctx.font = `300 ${radius * 1.5}px "Material Symbols Rounded"`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const glyph = ctx.measureText('call_split');
      ctx.fillStyle = isLight(dotColor) ? '#000000' : '#ffffff';
      ctx.fillText('call_split', point.x - (glyph.actualBoundingBoxRight - glyph.actualBoundingBoxLeft) / 2, point.y + (glyph.actualBoundingBoxAscent - glyph.actualBoundingBoxDescent) / 2);
      ctx.restore();
    }

    function traceArea(area) {
      ctx.beginPath();
      area.polygon.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.closePath();
    }

    function traceSegment([a, b, c1, c2]) {
      ctx.moveTo(a.x, a.y);
      if (c1) ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, b.x, b.y);
      else ctx.lineTo(b.x, b.y);
    }

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * Math.exp(-e.deltaY * 0.001)));
      // Keep the point under the cursor fixed while zooming.
      view.x = mx - (mx - view.x) * (next / view.scale);
      view.y = my - (my - view.y) * (next / view.scale);
      view.scale = next;
      draw();
      updateCursor();
    }, { passive: false });

    function toBackground(sx, sy) {
      return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale };
    }

    function inBackground(p) {
      return p.x >= 0 && p.x <= board.w && p.y >= 0 && p.y <= board.h;
    }

    const clampX = (v) => Math.min(board.w, Math.max(0, v));
    const clampY = (v) => Math.min(board.h, Math.max(0, v));

    // The pin cursor's hotspot is the tip of the pin.
    let pinCursor = 'crosshair';
    document.fonts.load('300 24px "Material Symbols Rounded"', 'add_location').then(() => {
      const icon = document.createElement('canvas');
      icon.width = icon.height = 24;
      const c = icon.getContext('2d');
      c.font = '300 24px "Material Symbols Rounded"';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.strokeStyle = '#fff';
      c.lineWidth = 3;
      c.strokeText('add_location', 12, 12);
      c.fillText('add_location', 12, 12);
      const tip = Math.min(23, Math.round(12 + c.measureText('add_location').actualBoundingBoxDescent));
      pinCursor = `url(${icon.toDataURL()}) 12 ${tip}, crosshair`;
      updateCursor();
    });

    let pointer = null;

    let shiftHeld = false;
    const trackShift = (e) => {
      if (e.key !== 'Shift' || shiftHeld === (e.type === 'keydown')) return;
      shiftHeld = e.type === 'keydown';
      draw();
      updateCursor();
    };
    document.addEventListener('keydown', trackShift);
    document.addEventListener('keyup', trackShift);
    window.addEventListener('blur', () => { shiftHeld = false; });

    // Moves screen point s onto the nearest of the 8 rays (every 45°) out of
    // the given point, keeping how far along that ray it reaches.
    function lockAngle(from, s) {
      const ox = from.x * view.scale + view.x;
      const oy = from.y * view.scale + view.y;
      const angle = Math.round(Math.atan2(s.y - oy, s.x - ox) / (Math.PI / 4)) * (Math.PI / 4);
      const dx = Math.cos(angle);
      const dy = Math.sin(angle);
      const reach = Math.max(0, (s.x - ox) * dx + (s.y - oy) * dy);
      return { x: ox + dx * reach, y: oy + dy * reach, dx, dy };
    }

    // Shift while drawing: lock to 45° steps from the point being drawn from,
    // then, within snap distance, slide along that ray to where it crosses a
    // 45° line through the point nearest the cursor. Returns the screen point
    // and the guide lines used.
    function shiftSnapFrom(from, s) {
      const locked = lockAngle(from, s);
      const guides = [{ origin: from, dx: locked.dx, dy: locked.dy }];
      const nearest = nearestPoint(s.x, s.y, Infinity, from);
      if (!nearest) return { q: locked, guides };
      const p = toBackground(locked.x, locked.y);
      const n = nearest.point;
      const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS) / view.scale;
      let best = null;
      for (let k = 0; k < 4; k++) {
        const dx = Math.cos((k * Math.PI) / 4);
        const dy = Math.sin((k * Math.PI) / 4);
        const denom = locked.dx * dy - locked.dy * dx;
        if (Math.abs(denom) < 1e-9) continue;
        const u = ((n.x - from.x) * dy - (n.y - from.y) * dx) / denom;
        if (u < 0) continue;
        const x = { x: from.x + locked.dx * u, y: from.y + locked.dy * u };
        const d = Math.hypot(x.x - p.x, x.y - p.y);
        if (d <= reach && (!best || d < best.d)) best = { x, d, guide: { origin: n, dx, dy } };
      }
      if (!best) return { q: locked, guides };
      guides.push(best.guide);
      return { q: { x: best.x.x * view.scale + view.x, y: best.x.y * view.scale + view.y }, guides };
    }

    // Pulls a dragged point onto lines at multiples of 45° through the points
    // it connects to, when it comes within snap distance of them. Near a
    // crossing of two such lines it goes to the crossing. Returns the guide
    // lines it snapped to, as { origin, angle }.
    function snapToNeighbourAngles(path, point, target) {
      const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS) / view.scale;
      const lines = [];
      for (const [a, b] of path.segments) {
        const origin = a === point ? b : b === point ? a : null;
        if (!origin) continue;
        let best = null;
        for (let k = 0; k < 4; k++) {
          const angle = (k * Math.PI) / 4;
          const dx = Math.cos(angle);
          const dy = Math.sin(angle);
          const offset = Math.abs((target.x - origin.x) * dy - (target.y - origin.y) * dx);
          if (offset <= reach && (!best || offset < best.offset)) best = { origin, angle, dx, dy, offset };
        }
        if (best) lines.push(best);
      }

      let crossing = null;
      for (let i = 0; i < lines.length; i++) {
        for (let j = i + 1; j < lines.length; j++) {
          const l = lines[i];
          const m = lines[j];
          const denom = l.dx * m.dy - l.dy * m.dx;
          if (Math.abs(denom) < 1e-9) continue;
          const u = ((m.origin.x - l.origin.x) * m.dy - (m.origin.y - l.origin.y) * m.dx) / denom;
          const x = { x: l.origin.x + l.dx * u, y: l.origin.y + l.dy * u };
          const d = Math.hypot(x.x - target.x, x.y - target.y);
          if (d <= reach * Math.SQRT2 && (!crossing || d < crossing.d)) crossing = { point: x, lines: [l, m], d };
        }
      }
      if (crossing) return { target: crossing.point, guides: crossing.lines };

      if (lines.length === 0) return { target, guides: [] };
      const l = lines.reduce((p, q) => (q.offset < p.offset ? q : p));
      const along = (target.x - l.origin.x) * l.dx + (target.y - l.origin.y) * l.dy;
      return { target: { x: l.origin.x + l.dx * along, y: l.origin.y + l.dy * along }, guides: [l] };
    }

    // What a click with the add tool at screen point s would do:
    // { connect: {path, point} } joins the selected point to an existing one,
    // { add: p } places a new point, { insert: {point, t} } splits the selected
    // segment, and { split: {path, segment, t, point} } splits a segment the
    // pointer snapped to. null means the click selects or deselects instead.
    function addTarget(s = pointer) {
      if (!s || drag || spaceHeld || tool !== 'add' || pathTools.hidden) return null;
      const hit = pointAt(s.x, s.y);
      const p = toBackground(s.x, s.y);
      if (selected?.point) {
        if (hit?.point === selected.point) return null;
        const { q, guides } = shiftHeld ? shiftSnapFrom(selected.point, s) : { q: s, guides: [] };
        const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS);
        const snap = nearestPoint(q.x, q.y, reach, selected.point);
        if (snap) return { connect: snap, guides };
        const from = selected.point;
        const onto = segmentHit(q.x, q.y, reach, ([a, b]) => a === from || b === from);
        if (onto) return { split: { ...onto, point: segmentPoint(onto.segment, onto.t) }, guides };
        const end = toBackground(q.x, q.y);
        return inBackground(end) ? { add: end, guides } : null;
      }
      if (hit) return null;
      if (selected?.segment) {
        const { t } = closestOnSegment(selected.segment, p);
        return { insert: { point: segmentPoint(selected.segment, t), t } };
      }
      const onto = segmentHit(s.x, s.y, Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS));
      if (onto) return { split: { ...onto, point: segmentPoint(onto.segment, onto.t) } };
      return inBackground(p) ? { add: p } : null;
    }

    // In the cursor tool, a ghost dot marks where a segment would be grabbed
    // for bending: the spot on it nearest the pointer.
    function bendGhost() {
      if (drag?.bend) return drag.bending ? segmentPoint(drag.bend, drag.t) : drag.grab;
      if (!pointer || drag || spaceHeld || tool !== 'select' || pathTools.hidden) return null;
      if (pointAt(pointer.x, pointer.y)) return null;
      const hit = segmentHit(pointer.x, pointer.y);
      if (!hit || grabbedSelectionItem(null, hit)) return null;
      return segmentPoint(hit.segment, hit.t);
    }

    function hoveredAreaIn(areas) {
      if (!pointer || drag || spaceHeld || tool !== 'select' || pathTools.hidden) return null;
      if (pointAt(pointer.x, pointer.y) || segmentHit(pointer.x, pointer.y)) return null;
      return areaAt(areas, pointer.x, pointer.y);
    }

    function hoveredPoint(target) {
      if (!pointer || drag || spaceHeld || pathTools.hidden) return null;
      if (target?.connect) return target.connect.point;
      const hit = pointAt(pointer.x, pointer.y);
      return hit && hit.point !== selected?.point ? hit.point : null;
    }

    function updateCursor() {
      if (spaceHeld || drag?.spacePan || inPreview() || (!labelTools.hidden && labelTool === 'pan')) canvas.style.cursor = drag ? 'grabbing' : 'grab';
      else if (labelTool === 'add' && !labelTools.hidden) canvas.style.cursor = 'crosshair';
      else if (labelTool === 'pin' && !labelTools.hidden) canvas.style.cursor = pinCursor;
      else if (labelTool === 'list' && !labelTools.hidden) canvas.style.cursor = 'crosshair';
      else if (!backgroundTools.hidden) canvas.style.cursor = ['shapes', 'segments', 'compass'].includes(backgroundTool) ? 'crosshair' : shapeHandleCursor();
      else if (!labelTools.hidden) canvas.style.cursor = shapeHandleCursor();
      else canvas.style.cursor = !pathTools.hidden && tool === 'add' ? 'crosshair' : '';
    }

    // Holding space turns every press on the canvas into a pan.
    let spaceHeld = false;
    const trackSpace = (e) => {
      if (e.code !== 'Space' || e.target.closest('input[type="text"], textarea')) return;
      // Stops the page scrolling and a focused button being pressed.
      e.preventDefault();
      const down = e.type === 'keydown';
      if (spaceHeld === down) return;
      spaceHeld = down;
      showLabelTool();
      draw();
      updateCursor();
    };
    document.addEventListener('keydown', trackSpace);
    document.addEventListener('keyup', trackSpace);
    window.addEventListener('blur', () => {
      spaceHeld = false;
      showLabelTool();
    });

    // Movement below this many pixels counts as a click rather than a pan.
    const CLICK_SLOP = 4;
    let drag = null;

    // With two or more things selected, pressing on one of them grabs the
    // whole selection. Returns the item pressed, or null.
    // A selection that is exactly one path is the exception: its segments
    // still bend, and it moves from its width band instead.
    // The path whose width band covers screen point s.
    function groupBandAt(sx, sy) {
      const p = toBackground(sx, sy);
      return groups.find((group) => group.visible && group.width > 0
        && [...group.segments].some((segment) => closestOnSegment(segment, p).distance <= group.width / 2)) ?? null;
    }

    function grabbedSelectionItem(hit, handle) {
      const items = selectionItems();
      if (items.length < 2 || selected?.group) return null;
      if (hit) return items.find((item) => item.point === hit.point) ?? null;
      if (handle) return items.find((item) => item.segment === handle.segment) ?? null;
      return null;
    }

    // Moves every selected dot and selected segment's ends together, keeping
    // the whole set inside the background.
    function moveSelection(dx, dy) {
      const moving = movingPoints();
      const xs = [...moving].map((p) => p.x);
      const ys = [...moving].map((p) => p.y);
      dx = Math.min(board.w - Math.max(...xs), Math.max(-Math.min(...xs), dx));
      dy = Math.min(board.h - Math.max(...ys), Math.max(-Math.min(...ys), dy));
      keepingBends(moving, () => {
        for (const p of moving) {
          p.x += dx;
          p.y += dy;
        }
      });
    }

    // Runs `move`, holding each bend on a segment touching one of `moving` in
    // place relative to that segment's ends, so curves keep their shape rather
    // than being twisted by control points left behind.
    function keepingBends(moving, move, segments = paths.flatMap((path) => path.segments)) {
      // Control points as (along, across) the segment, in units of its length.
      const bends = [];
      for (const segment of segments) {
        const [a, b, ...controls] = segment;
        if (!controls.length || !(moving.has(a) || moving.has(b))) continue;
        const ex = b.x - a.x;
        const ey = b.y - a.y;
        const lengthSq = ex * ex + ey * ey;
        if (lengthSq === 0) continue;
        for (const c of controls) {
          const cx = c.x - a.x;
          const cy = c.y - a.y;
          bends.push({ segment, c, along: (cx * ex + cy * ey) / lengthSq, across: (cy * ex - cx * ey) / lengthSq });
        }
      }

      move();

      for (const { segment, c, along, across } of bends) {
        const [a, b] = segment;
        const ex = b.x - a.x;
        const ey = b.y - a.y;
        c.x = a.x + along * ex - across * ey;
        c.y = a.y + along * ey + across * ex;
      }
    }

    // The marquee being dragged, in screen pixels.
    function marqueeBox() {
      const x = Math.min(drag.x0, pointer.x);
      const y = Math.min(drag.y0, pointer.y);
      return { x, y, w: Math.abs(pointer.x - drag.x0), h: Math.abs(pointer.y - drag.y0) };
    }

    function drawMarquee() {
      if (!drag?.marquee || !drag.active) return;
      const box = marqueeBox();
      const dpr = window.devicePixelRatio || 1;
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w, box.h);
      ctx.restore();
    }

    // Labels lying wholly inside the box (in screen pixels).
    function labelsInBox(box) {
      return labels.filter(labelShown).filter((label) => {
        const b = labelArea(label);
        const x = b.x * view.scale + view.x;
        const y = b.y * view.scale + view.y;
        return x >= box.x && y >= box.y && x + b.w * view.scale <= box.x + box.w && y + b.h * view.scale <= box.y + box.h;
      });
    }

    // Dots inside the box, and segments lying wholly inside it.
    function itemsInBox(box) {
      const inside = (p) => {
        const sx = p.x * view.scale + view.x;
        const sy = p.y * view.scale + view.y;
        return sx >= box.x && sx <= box.x + box.w && sy >= box.y && sy <= box.y + box.h;
      };
      const items = [];
      for (const path of paths) {
        for (const point of path.points) {
          if (inside(point)) items.push({ path, point });
        }
        for (const segment of path.segments) {
          const steps = segment[2] ? 16 : 1;
          let all = true;
          for (let i = 0; i <= steps && all; i++) all = inside(segmentPoint(segment, i / steps));
          if (all) items.push({ path, segment });
        }
      }
      return items;
    }

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      const s = canvasPoint(e);
      // Preview has nothing to edit, so any drag there pans, as with the pan tool.
      if (spaceHeld || inPreview() || (!labelTools.hidden && labelTool === 'pan')) {
        drag = { x: e.clientX, y: e.clientY, spacePan: true };
        updateCursor();
        return;
      }
      if (!backgroundTools.hidden) {
        shapePointerDown(e, s);
        draw();
        updateCursor();
        return;
      }
      if (!labelTools.hidden && labelTool === 'select') {
        const p = toBackground(s.x, s.y);
        // A selected image's handles, then any image not under a label, pin
        // or list, are handled as shapes are.
        if (handleAt(s) || (!pinAt(p) && !labelAt(p) && !listAt(p) && shapeAt(p))) {
          selectedLabels = [];
          selectedPins = [];
          selectedList = null;
          shapePointerDown(e, s);
          draw();
          updateCursor();
          return;
        }
        selectedShapes = [];
        const pressedPin = pinAt(p);
        if (pressedPin) {
          selectedList = null;
          // Selecting a pin selects its label too, so it shows at full opacity.
          const owner = pinOwner(pressedPin);
          if (shiftHeld) {
            selectedPins = selectedPins.includes(pressedPin)
              ? selectedPins.filter((pin) => pin !== pressedPin)
              : [...selectedPins, pressedPin];
            if (!selectedLabels.includes(owner)) selectedLabels = [...selectedLabels, owner];
          } else {
            const member = selectedPins.includes(pressedPin);
            if (!member) {
              selectedPins = [pressedPin];
              selectedLabels = [owner];
            }
            // As with labels, the undo step waits for a move, and a click on
            // one of several selected pins narrows to it.
            drag = { pins: [...selectedPins], last: p, before: snapshot(), narrowToPin: member ? pressedPin : null };
          }
          draw();
          return;
        }
        if (!shiftHeld) selectedPins = [];
        const pressedLabel = labelAt(p);
        const pressedList = pressedLabel ? null : listAt(p);
        if (!pressedList) selectedList = null;
        if (pressedList) {
          selectedLabels = [];
          selectedPins = [];
          selectedList = pressedList;
          // The snapshot only becomes the undo step once the list moves.
          drag = { list: pressedList, last: p, before: snapshot() };
        } else if (pressedLabel && shiftHeld) {
          selectedLabels = selectedLabels.includes(pressedLabel)
            ? selectedLabels.filter((label) => label !== pressedLabel)
            : [...selectedLabels, pressedLabel];
        } else if (pressedLabel) {
          const member = selectedLabels.includes(pressedLabel);
          if (!member) selectedLabels = [pressedLabel];
          // The snapshot only becomes the undo step once the labels actually
          // move. A click on one of several without moving narrows to it.
          drag = { labels: [...selectedLabels], last: p, before: snapshot(), narrowTo: member ? pressedLabel : null };
        } else {
          drag = { marquee: true, labelMarquee: true, x0: s.x, y0: s.y, startX: e.clientX, startY: e.clientY, base: shiftHeld ? [...selectedLabels] : [] };
        }
        draw();
        return;
      }
      const hit = pathTools.hidden || addTarget(s)?.connect ? null : pointAt(s.x, s.y);
      const handle = !hit && tool === 'select' && !pathTools.hidden ? segmentHit(s.x, s.y) : null;
      const p = toBackground(s.x, s.y);
      // With Shift in the cursor tool, a click adds to or removes from the
      // selection; a drag still moves or bends as usual.
      const toggling = shiftHeld && tool === 'select';
      const grabbed = !toggling && tool === 'select' && grabbedSelectionItem(hit, handle);
      const band = !hit && !handle && tool === 'select' && !pathTools.hidden ? groupBandAt(s.x, s.y) : null;
      if (grabbed) {
        // The snapshot only becomes the undo step once the selection actually moves.
        drag = { group: true, item: grabbed, last: p, startX: e.clientX, startY: e.clientY, before: snapshot() };
      } else if (hit) {
        if (!toggling) selected = hit;
        // The snapshot only becomes the undo step once the point actually moves.
        drag = { point: hit.point, path: hit.path, dx: hit.point.x - p.x, dy: hit.point.y - p.y, before: snapshot(), toggle: toggling && hit };
        draw();
      } else if (handle) {
        const item = { path: handle.path, segment: handle.segment };
        if (!toggling) setSelectionItems([item]);
        // The new bend passes through the pointer at the grabbed spot, so that
        // spot stays under the cursor for the whole drag.
        const grab = segmentPoint(handle.segment, handle.t);
        const t = bendT(handle.t);
        drag = { bend: handle.segment, t, grab, startX: e.clientX, startY: e.clientY, before: snapshot(), toggle: toggling && item };
        draw();
      } else if (band && !toggling) {
        const [item] = groupItems(band);
        setSelectionItems([item]);
        drag = { group: true, item, last: p, startX: e.clientX, startY: e.clientY, before: snapshot() };
        draw();
      } else if (tool === 'select' && !pathTools.hidden) {
        drag = { marquee: true, x0: s.x, y0: s.y, startX: e.clientX, startY: e.clientY, base: toggling ? selectionItems() : [] };
      } else {
        drag = { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY };
      }
      updateCursor();
    });

    canvas.addEventListener('pointermove', (e) => {
      pointer = canvasPoint(e);
      shiftHeld = e.shiftKey;
      if (drag?.shapes) {
        shapePointerMove(e);
        draw();
        updateCursor();
        return;
      }
      if (drag?.point) {
        const p = toBackground(pointer.x, pointer.y);
        let target = { x: p.x + drag.dx, y: p.y + drag.dy };
        drag.guides = [];
        if (shiftHeld) ({ target, guides: drag.guides } = snapToNeighbourAngles(drag.path, drag.point, target));
        if (drag.before) {
          recordUndo(drag.before);
          drag.before = null;
          if (drag.toggle) setSelectionItems([drag.toggle]);
          drag.toggle = null;
        }
        // Near another point, sit exactly on it; letting go there merges them.
        const reach = Math.max(Number(snapInput.value), SELECTED_DOT_RADIUS);
        const sx = target.x * view.scale + view.x;
        const sy = target.y * view.scale + view.y;
        drag.snapTo = nearestPoint(sx, sy, reach, drag.point);
        // Failing that, sit on a segment it isn't part of; letting go there splits it.
        drag.snapOnto = drag.snapTo ? null : segmentHit(sx, sy, reach, (segment) => segment.includes(drag.point));
        if (drag.snapTo) target = { x: drag.snapTo.point.x, y: drag.snapTo.point.y };
        else if (drag.snapOnto) target = segmentPoint(drag.snapOnto.segment, drag.snapOnto.t);
        keepingBends(new Set([drag.point]), () => {
          drag.point.x = clampX(target.x);
          drag.point.y = clampY(target.y);
        });
      } else if (drag?.bend) {
        // Ignore jitter so a plain click doesn't bend a straight segment.
        if (drag.bending || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          if (!drag.bending) {
            recordUndo(drag.before);
            if (drag.toggle) setSelectionItems([drag.toggle]);
            drag.toggle = null;
          }
          drag.bending = true;
          const p = toBackground(pointer.x, pointer.y);
          bendSegment(drag.bend, drag.t, p);
        }
      } else if (drag?.pins) {
        if (drag.before) {
          recordUndo(drag.before);
          drag.before = null;
          drag.narrowToPin = null;
        }
        const p = toBackground(pointer.x, pointer.y);
        for (const pin of drag.pins) {
          pin.x = clampX(pin.x + p.x - drag.last.x);
          pin.y = clampY(pin.y + p.y - drag.last.y);
        }
        drag.last = p;
      } else if (drag?.list) {
        if (drag.before) {
          recordUndo(drag.before);
          drag.before = null;
        }
        const p = toBackground(pointer.x, pointer.y);
        drag.list.x += p.x - drag.last.x;
        drag.list.y += p.y - drag.last.y;
        drag.last = p;
      } else if (drag?.labels) {
        if (drag.before) {
          recordUndo(drag.before);
          drag.before = null;
          drag.narrowTo = null;
        }
        const p = toBackground(pointer.x, pointer.y);
        for (const label of drag.labels) {
          label.x = clampX(label.x + p.x - drag.last.x);
          label.y = clampY(label.y + p.y - drag.last.y);
        }
        drag.last = p;
      } else if (drag?.group) {
        if (drag.moving || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          if (!drag.moving) recordUndo(drag.before);
          drag.moving = true;
          const p = toBackground(pointer.x, pointer.y);
          moveSelection(p.x - drag.last.x, p.y - drag.last.y);
          drag.last = p;
        }
      } else if (drag?.labelMarquee) {
        if (drag.active || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          drag.active = true;
          selectedLabels = [...new Set([...drag.base, ...labelsInBox(marqueeBox())])];
        }
      } else if (drag?.marquee) {
        if (drag.active || Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) >= CLICK_SLOP) {
          drag.active = true;
          const inside = itemsInBox(marqueeBox());
          setSelectionItems([...drag.base, ...inside.filter((item) => !drag.base.some((b) => sameItem(b, item)))]);
        }
      } else if (drag) {
        view.x += e.clientX - drag.x;
        view.y += e.clientY - drag.y;
        drag.x = e.clientX;
        drag.y = e.clientY;
      }
      draw();
      updateCursor();
    });

    canvas.addEventListener('pointerleave', () => {
      pointer = null;
      draw();
      updateCursor();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!drag) return;
      if (drag.shapes) {
        shapePointerUp();
        draw();
        updateCursor();
        return;
      }
      const { toggle, marquee, active, base, group, moving, item } = drag;
      if (drag.narrowTo) selectedLabels = [drag.narrowTo];
      if (drag.narrowToPin) {
        selectedPins = [drag.narrowToPin];
        selectedLabels = [pinOwner(drag.narrowToPin)];
      }
      if (drag.point && drag.snapTo) mergePoints(drag.path, drag.point, drag.snapTo);
      if (drag.point && drag.snapOnto) {
        const { path, segment, t } = drag.snapOnto;
        mergePoints(drag.path, drag.point, { path, point: splitSegment(path, segment, t) });
      }
      const wasClick = !drag.point && !drag.bend && !drag.spacePan && !drag.labels && !drag.list && !drag.pins && !active && !group
        && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < CLICK_SLOP;
      drag = null;
      if (group && !moving) {
        // Clicking one member of a multi-selection without moving selects just it.
        setSelectionItems([item]);
      } else if (toggle) {
        toggleInSelection(toggle);
      } else if (marquee && wasClick && base.length) {
        // A Shift-click on empty space leaves the selection alone.
      } else if (wasClick && !labelTools.hidden) {
        const s = canvasPoint(e);
        const p = toBackground(s.x, s.y);
        if (labelTool === 'add') {
          // New label places one label, then hands back to the cursor tool.
          if (inBackground(p)) {
            startLabel(p);
            setLabelTool('select');
          }
        } else if (labelTool === 'pin') {
          const label = soleLabel();
          if (label && inBackground(p)) {
            recordUndo();
            label.pins.push({ x: p.x, y: p.y });
          }
          setLabelTool('select');
        } else if (labelTool === 'list') {
          // The List tool places one list, then hands back to the cursor tool.
          if (inBackground(p)) {
            recordUndo();
            const list = newList(p);
            lists.push(list);
            selectedLabels = [];
            selectedList = list;
          }
          setLabelTool('select');
        } else {
          selectedLabels = [];
        }
      } else if (wasClick && !pathTools.hidden) {
        const s = canvasPoint(e);
        const target = addTarget(s);
        if (target) recordUndo();
        let drawn = null;
        if (target?.connect) {
          drawn = connectTo(target.connect);
        } else if (target?.add) {
          drawn = addPoint(target.add);
        } else if (target?.insert) {
          insertOnSegment(target.insert);
        } else if (target?.split) {
          const { path, segment, t } = target.split;
          const point = splitSegment(path, segment, t);
          if (selected?.point) drawn = connectTo({ path, point });
          else selected = { path, point };
        }
        if (drawn) lastDrawn = drawn;
        if (target) {
          const crossing = drawn && findCrossings(drawn)[0];
          if (crossing) askAboutCrossings(drawn, crossing.point);
        } else {
          const area = tool === 'select' ? areaAt(computeAreas(), s.x, s.y) : null;
          selected = segmentAt(s.x, s.y) ?? (area && { path: area.path, area: area.points });
        }
      }
      draw();
      updateCursor();
    });
    canvas.addEventListener('pointercancel', () => { drag = null; });

    const upload = document.getElementById('image-upload');
    const preview = document.getElementById('image-preview');
    const previewImg = preview.querySelector('img');
    let backgroundImage = null;

    function setBackgroundImage(src, onError) {
      const img = new Image();
      img.onload = () => {
        backgroundImage = img;
        previewImg.src = img.src;
        upload.closest('.field').hidden = true;
        preview.hidden = false;
        draw();
      };
      if (onError) img.onerror = onError;
      img.src = src;
    }

    upload.addEventListener('change', () => {
      const file = upload.files[0];
      if (file) setBackgroundImage(URL.createObjectURL(file));
    });

    // The editor opens on labelling a map that has a background, and on
    // making one when it hasn't.
    const START_IMAGE = 'demo-park.svg';
    if (START_IMAGE) setBackgroundImage(START_IMAGE, () => setMode('background'));

    function clearBackgroundImage() {
      if (backgroundImage?.src.startsWith('blob:')) URL.revokeObjectURL(backgroundImage.src);
      backgroundImage = null;
      previewImg.removeAttribute('src');
      upload.value = '';
      preview.hidden = true;
      upload.closest('.field').hidden = false;
      draw();
    }
    document.getElementById('image-delete').addEventListener('click', clearBackgroundImage);

    // A map file holds the whole map, images included as data URLs, so it
    // can be loaded back into a later version of the editor. Shared points
    // and segments are saved as indexes into their lists. Anything a file
    // lacks, being older than the editor, loads as its default.
    const MAP_FILE_VERSION = 1;
    // Settings that live only in their fields, saved by id.
    const SETTING_FIELDS = [
      'show-labels', 'snap-distance', 'segment-distance', 'bend-focus', 'nudge-amount', 'path-color',
      'canvas-color', 'board-color', ...boardFields.map(([id]) => id), 'preview-blur',
    ];
    function imageData(image) {
      return fetch(image.src)
        .then((response) => response.blob())
        .then((blob) => new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        }));
    }
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }
    async function mapFile() {
      const pointIds = new Map();
      const pointId = (point) => {
        if (!pointIds.has(point)) pointIds.set(point, pointIds.size);
        return pointIds.get(point);
      };
      const segmentIds = new Map();
      const savedPaths = paths.map((path, i) => ({
        points: path.points.map(pointId),
        segments: path.segments.map((segment, j) => {
          segmentIds.set(segment, [i, j]);
          const [a, b, ...controls] = segment;
          return [pointId(a), pointId(b), ...controls];
        }),
      }));
      const sketchIds = new Map(sketch.points.map((point, i) => [point, i]));
      const images = [];
      const imageId = (image) => (images.includes(image) ? images.indexOf(image) : images.push(image) - 1);
      const settings = {};
      for (const id of SETTING_FIELDS) {
        const input = document.getElementById(id);
        settings[id] = input.type === 'checkbox' ? input.checked : input.type === 'color' ? colorOf(input) : input.value;
      }
      const file = {
        version: MAP_FILE_VERSION,
        points: [...pointIds.keys()],
        paths: savedPaths,
        fills: fills.map((fill) => ({ points: [...fill].filter((point) => pointIds.has(point)).map(pointId), visible: fill.visible, color: fill.color })),
        groups: groups.map((group) => ({ ...group, segments: [...group.segments].map((segment) => segmentIds.get(segment)).filter(Boolean) })),
        labels,
        labelStyles,
        nextStyleId,
        iconStyles,
        nextIconStyleId,
        lists,
        shapes: shapes.map((shape) => (shape.image ? { ...shape, image: imageId(shape.image) } : shape)),
        sketch: {
          points: sketch.points,
          segments: sketch.segments.map(([a, b, ...controls]) => [sketchIds.get(a), sketchIds.get(b), ...controls]),
          fills: sketchFills.map((fill) => ({ points: [...fill].map((point) => sketchIds.get(point)), ...lookOf(fill) })),
        },
        layerZoom,
        settings,
      };
      file.images = await Promise.all(images.map(imageData));
      file.background = backgroundImage && await imageData(backgroundImage);
      return file;
    }
    async function loadMapFile(file) {
      const images = await Promise.all((file.images ?? []).map(loadImage));
      const points = (file.points ?? []).map((point) => ({ ...point }));
      paths.splice(0, paths.length, ...(file.paths ?? []).map((path) => ({
        points: path.points.map((i) => points[i]),
        segments: path.segments.map(([a, b, ...controls]) => [points[a], points[b], ...controls]),
      })));
      fills.splice(0, fills.length, ...(file.fills ?? []).map((fill) => Object.assign(new Set(fill.points.map((i) => points[i])), { visible: fill.visible, color: fill.color })));
      groups.splice(0, groups.length, ...(file.groups ?? []).map((group) => ({ ...group, segments: new Set(group.segments.map(([i, j]) => paths[i].segments[j])) })));
      // Files from before icon styles keep each label style's icon settings
      // as an icon style of the same id, which its labels then use.
      const separateIcons = !!file.iconStyles;
      const savedIconStyles = file.iconStyles ?? (file.labelStyles ?? []).map((style) => ({ id: style.id, name: style.name, ...Object.fromEntries(ICON_STYLE_KEYS.filter((key) => key in style).map((key) => [key, style[key]])) }));
      iconStyles.splice(0, iconStyles.length, ...savedIconStyles.map((style) => ({ ...NEW_ICON_STYLE, ...style })));
      if (!iconStyles.length) iconStyles.push({ ...NEW_ICON_STYLE, id: 1, name: 'Icon' });
      nextIconStyleId = file.nextIconStyleId ?? Math.max(...iconStyles.map((style) => style.id)) + 1;
      const labelSettings = (style) => Object.fromEntries(Object.entries(style).filter(([key]) => !ICON_STYLE_KEYS.includes(key)));
      labelStyles.splice(0, labelStyles.length, ...(file.labelStyles ?? []).map((style) => ({ ...NEW_STYLE, ...labelSettings(style) })));
      if (!labelStyles.length) labelStyles.push({ ...NEW_STYLE, id: 1, name: 'Label' });
      nextStyleId = file.nextStyleId ?? Math.max(...labelStyles.map((style) => style.id)) + 1;
      labels.splice(0, labels.length, ...(file.labels ?? []).map((label) => ({ pins: [], ...(separateIcons ? {} : { iconStyleId: label.styleId }), ...label })));
      lists.splice(0, lists.length, ...(file.lists ?? []).map((list) => ({ ...newList(list), ...list })));
      shapes.splice(0, shapes.length, ...(file.shapes ?? []).map((shape) => (shape.kind === 'image' ? { ...shape, image: images[shape.image] } : shape)));
      const sketchPoints = file.sketch?.points ?? [];
      sketch.points.splice(0, sketch.points.length, ...sketchPoints);
      sketch.segments.splice(0, sketch.segments.length, ...(file.sketch?.segments ?? []).map(([a, b, ...controls]) => [sketchPoints[a], sketchPoints[b], ...controls]));
      sketchFills.splice(0, sketchFills.length, ...(file.sketch?.fills ?? []).map(({ points: loop, ...look }) => newLoop(loop.map((i) => sketchPoints[i]), look)));
      const zoomInputs = layerZoomGrid.querySelectorAll('input');
      LAYERS.forEach((layer, i) => {
        Object.assign(layerZoom[layer], file.layerZoom?.[layer]);
        zoomInputs[2 * i].value = layerZoom[layer].min;
        zoomInputs[2 * i + 1].value = layerZoom[layer].max;
      });
      // Every field is set before any applies, as some read others.
      const fields = SETTING_FIELDS.map((id) => document.getElementById(id));
      for (const input of fields) {
        const value = file.settings?.[input.id];
        const opacity = input.nextElementSibling?.classList.contains('opacity') ? input.nextElementSibling : null;
        if (input.type === 'checkbox') input.checked = value ?? input.defaultChecked;
        else if (value === undefined) {
          input.value = input.defaultValue;
          if (opacity) opacity.value = opacity.defaultValue;
        } else if (opacity) showColor(input, value);
        else input.value = value;
      }
      for (const input of fields) {
        input.dispatchEvent(new Event('input'));
        input.dispatchEvent(new Event('change'));
      }
      if (file.background) setBackgroundImage(file.background);
      else clearBackgroundImage();
      undoState = null;
      selected = null;
      selectedLabels = [];
      selectedPins = [];
      selectedList = null;
      selectedShapes = [];
      sketchSelected = null;
      sketchActive = null;
      closeStyleForm();
      renderLabelStyles();
      draw();
    }
    // Inside claude.ai the page is sandboxed and can only save through the
    // viewer's downloads capability; opened anywhere else, that's null.
    const downloadsReady = window.claude?.use('downloads') ?? Promise.resolve(null);
    document.getElementById('map-save').addEventListener('click', async (e) => {
      e.currentTarget.blur();
      const data = new Blob([JSON.stringify(await mapFile())], { type: 'application/json' });
      const downloads = await downloadsReady;
      if (downloads) {
        try {
          await downloads.save({ filename: 'map.json', data });
        } catch (error) {
          if (error?.code !== 'declined') alert('The map file could not be saved here.');
        }
        return;
      }
      const url = URL.createObjectURL(data);
      Object.assign(document.createElement('a'), { href: url, download: 'map.json' }).click();
      URL.revokeObjectURL(url);
    });
    const mapFileInput = document.getElementById('map-file');
    document.getElementById('map-load').addEventListener('click', (e) => {
      e.currentTarget.blur();
      mapFileInput.click();
    });
    mapFileInput.addEventListener('change', async () => {
      const chosen = mapFileInput.files[0];
      mapFileInput.value = '';
      if (!chosen) return;
      try {
        await loadMapFile(JSON.parse(await chosen.text()));
      } catch {
        alert('That file could not be loaded as a map.');
      }
    });

    renderLabelStyles();
    // Closing the panel gives the canvas the full width; the open button
    // floats over the canvas's top right until it's opened again.
    const panel = document.getElementById('panel');
    const panelOpenButton = document.getElementById('panel-open');
    function setPanelOpen(open) {
      panel.classList.toggle('closed', !open);
      panelOpenButton.hidden = open;
    }
    document.getElementById('panel-close').addEventListener('click', () => setPanelOpen(false));
    panelOpenButton.addEventListener('click', () => setPanelOpen(true));
    // The panel's heading: what's selected, else the mode.
    const SHAPE_NAMES = { circle: 'Circle', square: 'Square', triangle: 'Triangle', polygon: 'Polygon', compass: 'Compass', image: 'Image' };
    function panelTitle() {
      if (inPreview()) return 'Preview';
      if (!labelTools.hidden) {
        if (selectedPins.length) return selectedPins.length > 1 ? 'Pins' : 'Pin';
        if (selectedLabels.length) return selectedLabels.length > 1 ? 'Labels' : 'Label';
        if (selectedList) return 'List';
        if (selectedShapes.length) return selectedShapes.length > 1 ? 'Images' : 'Image';
        return 'Labels';
      }
      if (!backgroundTools.hidden) {
        if (selectedShapes.length > 1) return 'Shapes';
        if (selectedShapes.length) return SHAPE_NAMES[selectedShapes[0].kind];
        if (sketchSelected?.point) return 'Point';
        if (sketchSelected?.figure) return 'Shape';
        return 'Background';
      }
      if (selected?.area) return 'Area';
      if (selected?.group) return 'Path';
      const items = selectionItems();
      if (items.length > 1) return 'Selection';
      if (items[0]?.point) return 'Point';
      if (items[0]?.segment) return 'Segment';
      return 'Paths';
    }
    new ResizeObserver(resize).observe(canvas);
    setMode(START_IMAGE ? 'labels' : 'background');
  </script>
</body>
</html>
